name: Verify live Pigeon Poker v1.3.78 update

on:
  push:
    paths:
      - "update-diagnostics/v1.3.78.request"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate v1.3.78 using the shipped v1.3.77 updater
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import tempfile

          source = pathlib.Path("staging/source_1_3_77/pigeon_updater.py")
          if not source.is_file():
              raise SystemExit("Exact v1.3.77 shipped updater source is missing.")
          sys.path.insert(0, str(source.parent))
          import pigeon_updater as updater

          manifest = updater._fetch_manifest()
          if manifest["version"] != "1.3.78":
              raise SystemExit(f"Stable manifest reports {manifest['version']!r}, not 1.3.78.")
          if updater._version_tuple(manifest["version"]) <= updater._version_tuple("1.3.77"):
              raise SystemExit("The installed 1.3.77 updater does not treat 1.3.78 as newer.")

          limit = (
              updater.MAX_COMPRESSED_BYTES * 2
              if manifest.get("payload_encoding") == "base64"
              else updater.MAX_COMPRESSED_BYTES
          )
          downloaded = updater._https_get(
              str(manifest["payload_url"]), max_bytes=limit, timeout=60,
          )
          payload = updater._decode_downloaded_payload(downloaded, manifest)
          if len(payload) != int(manifest["payload_size"]):
              raise SystemExit("Decoded payload size does not match stable.json.")
          if hashlib.sha256(payload).hexdigest() != manifest["payload_sha256"]:
              raise SystemExit("Decoded payload SHA-256 does not match stable.json.")

          with tempfile.TemporaryDirectory() as td:
              destination = pathlib.Path(td) / "staged"
              extracted = updater._validate_and_extract(payload, manifest, destination)
              if (destination / "VERSION.txt").read_text(encoding="ascii").strip() != "1.3.78":
                  raise SystemExit("Extracted VERSION.txt is not 1.3.78.")
              if not {"PigeonPoker.pyw", "pigeon_updater.py"}.issubset(set(extracted)):
                  raise SystemExit("The required root app/update files were not extracted.")

          # Also validate fit math and the exact source markers in the published
          # package, without claiming that a Windows GTO+ UI has been exercised.
          import io, zipfile
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              main = archive.read("PigeonPoker.pyw").decode("utf-8")
              expected = (
                  "reference_width = 1320.0",
                  "reference_height = 676.0",
                  "self.integration.resize_docked_window(host_width, host_height)",
                  "self.after(1200, self._refresh_update_button_state)",
                  'text="UP TO DATE"',
              )
              for marker in expected:
                  if marker not in main:
                      raise SystemExit("Published PigeonPoker.pyw is missing: " + marker)
              range_files = {
                  "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
                  "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
                  "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
              }
              for name, expected_blob in range_files.items():
                  data = archive.read(name)
                  actual_blob = hashlib.sha1(
                      b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
                  ).hexdigest()
                  if actual_blob != expected_blob:
                      raise SystemExit("Published range baseline changed: " + name)

          print(json.dumps({
              "current_installed_version": "1.3.77",
              "stable_version": manifest["version"],
              "download_bytes": len(downloaded),
              "payload_bytes": len(payload),
              "sha256": manifest["payload_sha256"],
              "updater_compatibility": "passed",
              "package_validation": "passed",
              "range_baseline": "1.3.69 byte-identical",
              "native_zoom_reference": [1320, 676],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Record live package verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          printf '%s\n' "v1.3.78 passed the shipped v1.3.77 updater download, hash, ZIP and range-baseline verification." > update-diagnostics/v1.3.78.verified
          git add update-diagnostics/v1.3.78.verified
          git commit -m "Verify live Pigeon Poker v1.3.78 updater compatibility"
          git push
