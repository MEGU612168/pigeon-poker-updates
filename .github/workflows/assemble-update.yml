name: Assemble and publish Pigeon Poker update

on:
  push:
    paths:
      - "releases/**/payload.ready"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble, validate, hash and publish
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import struct
          import zipfile
          import zlib
          from io import BytesIO

          root = pathlib.Path(".")
          releases = root / "releases"
          candidates = [
              p.parent for p in releases.glob("*/payload.ready")
              if p.is_file()
          ]
          if not candidates:
              print("No completed release marker found; nothing to publish.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("publish=false\n")
              raise SystemExit(0)

          def candidate_version_key(path):
              meta_path = path / "release.json"
              if not meta_path.is_file():
                  raise SystemExit("Release marker has no release.json: " + str(path))
              candidate_meta = json.loads(meta_path.read_text(encoding="utf-8"))
              candidate_version = str(candidate_meta.get("version", ""))
              numbers = re.findall(r"\\d+", candidate_version)
              if not numbers:
                  raise SystemExit("Release marker has an invalid version: " + str(path))
              return tuple(int(number) for number in numbers)

          candidates.sort(key=candidate_version_key)
          release_dir = candidates[-1]
          if len(candidates) > 1:
              print("Multiple release markers found; selecting newest version: " + str(release_dir))
              print("Older pending markers will be cleaned after successful publication.")
          meta_path = release_dir / "release.json"
          parts_manifest_path = release_dir / "payload.parts.json"
          if not meta_path.is_file() or not parts_manifest_path.is_file():
              raise SystemExit("release.json or payload.parts.json is missing.")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          part_manifest = json.loads(parts_manifest_path.read_text(encoding="utf-8"))
          if meta.get("schema_version") != 1 or meta.get("product") != "pigeon-poker" or meta.get("channel") != "stable":
              raise SystemExit("Invalid release metadata.")
          version = str(meta.get("version", "")).strip()
          if release_dir.name not in {version, "v" + version}:
              raise SystemExit("Release directory and version do not match.")
          part_names = part_manifest.get("parts")
          if not isinstance(part_names, list) or not part_names or len(part_names) > 100:
              raise SystemExit("Invalid payload.parts.json.")
          if len(set(part_names)) != len(part_names):
              raise SystemExit("Duplicate part names are not allowed.")
          chunks = []
          for name in part_names:
              if not isinstance(name, str) or pathlib.PurePosixPath(name).name != name or not name.startswith("payload.part-"):
                  raise SystemExit("Unsafe payload part name.")
              part_path = release_dir / name
              if not part_path.is_file():
                  raise SystemExit("Missing payload part: " + name)
              chunk = part_path.read_text(encoding="ascii")
              if not chunk or any(c not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=" for c in chunk):
                  raise SystemExit("Payload part contains invalid Base64 characters: " + name)
              chunks.append(chunk)
          encoded = "".join(chunks)
          payload = base64.b64decode(encoded, validate=True)
          if base64.b64encode(payload).decode("ascii") != encoded:
              raise SystemExit("Base64 payload is not in canonical form.")
          if not payload or len(payload) > 18 * 1024 * 1024:
              raise SystemExit("Payload size is empty or exceeds the 18 MiB limit.")
          # If a transfer ended after the complete main application file but before
          # the ZIP directory/updater tail, recover only that verified first member.
          # The updater and version are separately supplied release sidecars.
          try:
              with zipfile.ZipFile(BytesIO(payload), "r") as archive:
                  archive.testzip()
          except (zipfile.BadZipFile, ValueError, OSError):
              if len(payload) < 30 or struct.unpack_from("<I", payload, 0)[0] != 0x04034b50:
                  raise SystemExit("Payload is not a valid ZIP and has no recoverable first member.")
              fields = struct.unpack_from("<IHHHHHIIIHH", payload, 0)
              _, _, flags, method, _, _, crc, compressed_size, uncompressed_size, name_len, extra_len = fields
              name = payload[30:30 + name_len].decode("utf-8")
              data_start = 30 + name_len + extra_len
              data_end = data_start + compressed_size
              if flags & 0x08 or method != 8 or name != "PigeonPoker.pyw" or data_end > len(payload):
                  raise SystemExit("Incomplete release has no safe, complete PigeonPoker.pyw member.")
              main_source = zlib.decompress(payload[data_start:data_end], -15)
              if len(main_source) != uncompressed_size or (zlib.crc32(main_source) & 0xffffffff) != crc:
                  raise SystemExit("Recovered PigeonPoker.pyw failed its size or CRC check.")
              main_text = main_source.decode("utf-8")
              ast.parse(main_text, filename=name)
              if "from pigeon_updater import start_update_check" not in main_text or "_begin_app_update" not in main_text:
                  raise SystemExit("Recovered app source does not contain the one-click updater.")
              updater_path = release_dir / "pigeon_updater.py"
              version_path = release_dir / "VERSION.txt"
              if not updater_path.is_file() or not version_path.is_file():
                  raise SystemExit("Recovery sidecars pigeon_updater.py and VERSION.txt are required.")
              updater_source = updater_path.read_bytes()
              ast.parse(updater_source.decode("utf-8"), filename="pigeon_updater.py")
              if version_path.read_text(encoding="utf-8").strip() != version:
                  raise SystemExit("Recovery VERSION.txt does not match release.json.")
              rebuilt = BytesIO()
              with zipfile.ZipFile(rebuilt, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as fixed:
                  fixed.writestr("PigeonPoker.pyw", main_source)
                  fixed.writestr("pigeon_updater.py", updater_source)
                  fixed.writestr("VERSION.txt", version_path.read_bytes())
              payload = rebuilt.getvalue()
              print("Recovered a complete updater package from the validated main source and release sidecars.")
          with zipfile.ZipFile(BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("ZIP integrity test failed.")
              names, seen, total = [], set(), 0
              for info in archive.infolist():
                  if info.is_dir():
                      raise SystemExit("Explicit directory entries are not allowed.")
                  name = info.filename
                  path = pathlib.PurePosixPath(name)
                  if chr(92) in name or chr(0) in name or path.is_absolute() or ".." in path.parts or "." in path.parts or path.as_posix() != name:
                      raise SystemExit("Unsafe ZIP path: " + name)
                  allowed_root = name in {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}
                  parts_path = path.parts
                  allowed_module = len(parts_path) >= 2 and parts_path[0] in {"pigeon_poker", "pigeon_gto_plus"} and path.suffix.lower() == ".py" and not any(p.startswith(".") or p == "__pycache__" for p in parts_path)
                  if not (allowed_root or allowed_module):
                      raise SystemExit("Update contains a non-allow-listed file: " + name)
                  folded = name.casefold()
                  if folded in seen:
                      raise SystemExit("Duplicate file path: " + name)
                  seen.add(folded)
                  names.append(name)
                  total += info.file_size
                  if len(names) > 500 or total > 18 * 1024 * 1024:
                      raise SystemExit("Update file count or uncompressed size limit exceeded.")
              package_mode = str(meta.get("package_mode", "full")).strip().lower()
              if package_mode == "updater-only":
                  required = {"pigeon_updater.py", "VERSION.txt"}
                  if set(names) != required:
                      raise SystemExit("Updater-only package must contain exactly pigeon_updater.py and VERSION.txt.")
              elif package_mode == "full":
                  required = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}
                  if not required.issubset(names):
                      raise SystemExit("Required full update files are missing.")
              else:
                  raise SystemExit("Unsupported package_mode: " + package_mode)
              bundled_version = archive.read("VERSION.txt").decode("utf-8").strip()
              if bundled_version != version:
                  raise SystemExit("VERSION.txt does not match release.json.")
          payload_path = release_dir / "payload-updater.zip.b64"
          payload_path.write_text(base64.b64encode(payload).decode("ascii"), encoding="ascii")
          manifest = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": version,
              "published_at": str(meta.get("published_at", "")),
              "release_notes": str(meta.get("release_notes", "修正と改善")),
              "package_mode": str(meta.get("package_mode", "full")).strip().lower(),
              "payload_encoding": "base64",
              "payload_url": f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/{release_dir.as_posix()}/payload-updater.zip.b64",
              "payload_sha256": hashlib.sha256(payload).hexdigest(),
              "payload_size": len(payload),
          }
          (root / "stable.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("publish=true\n")
              out.write("release_dir=" + release_dir.as_posix() + "\n")
          print(json.dumps({"version": version, "size": len(payload), "sha256": manifest["payload_sha256"], "files": names}, ensure_ascii=False))
          PY

      - name: Commit published update
        if: steps.build.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.json "${{ steps.build.outputs.release_dir }}/payload-updater.zip.b64"
          # Remove all processed/stale trigger markers so they cannot block the next release.
          find releases -mindepth 2 -maxdepth 2 -type f -name payload.ready -delete
          git add -u releases
          if git diff --cached --quiet; then
            echo "Manifest and payload are already current."
            exit 0
          fi
          git commit -m "Publish verified Pigeon Poker update"
          git push
