name: Assemble Pigeon Poker update payload

on:
  push:
    paths:
      - "releases/**/payload.ready"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          dir="releases/v1.3.2"
          cat "$dir"/payload.part-* > "$RUNNER_TEMP/payload.zip.b64"
          base64 --decode "$RUNNER_TEMP/payload.zip.b64" > "$dir/payload.zip"
          expected="$(python -c 'import json; print(json.load(open("stable.json", encoding="utf-8"))["payload_sha256"])')"
          expected_size="$(python -c 'import json; print(json.load(open("stable.json", encoding="utf-8"))["payload_size"])')"
          actual="$(sha256sum "$dir/payload.zip" | cut -d' ' -f1)"
          actual_size="$(wc -c < "$dir/payload.zip" | tr -d ' ')"
          test "$actual" = "$expected"
          test "$actual_size" = "$expected_size"
          unzip -t "$dir/payload.zip"

      - name: Publish binary payload to the update repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v1.3.2/payload.zip
          if git diff --cached --quiet; then
            echo "Payload already published"
            exit 0
          fi
          git commit -m "Publish Pigeon Poker v1.3.2 update payload"
          git push
