name: Assemble Pigeon Poker update payload

on:
  push:
    paths:
      - "releases/**/payload.ready"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          dir="releases/v1.3.2"
          cat "$dir"/payload.b64part-* > /tmp/payload.zip.b64
          python - <<'PY'
          import base64, hashlib, json, pathlib
          root = pathlib.Path("releases/v1.3.2")
          encoded = pathlib.Path("/tmp/payload.zip.b64").read_bytes()
          manifest = json.loads(pathlib.Path("stable.json").read_text(encoding="utf-8"))
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == manifest["payload_size"], (len(payload), manifest["payload_size"])
          assert hashlib.sha256(payload).hexdigest() == manifest["payload_sha256"], "SHA-256 mismatch"
          (root / "payload.zip").write_bytes(payload)
          PY
          unzip -t "$dir/payload.zip"

      - name: Publish binary payload to the update repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v1.3.2/payload.zip
          if git diff --cached --quiet; then
            echo "Payload already published"
            exit 0
          fi
          git commit -m "Publish Pigeon Poker v1.3.2 update payload"
          git push
