name: Verify Pigeon Poker v1.3.106 candidate

on:
  push:
    paths:
      - "staging/source_1_3_101/PigeonPoker.pyw"
      - "staging/source_1_3_101/pigeon_poker/poker_reasoning.py"
      - "staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py"
      - "staging/test_postflop_controls.py"
      - "staging/test_preflop_user_actions.py"
      - "staging/test_wallet_bonus.py"
      - ".github/workflows/verify-v1-3-106-candidate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile app and updated policy modules
        run: |
          python -m py_compile staging/source_1_3_101/PigeonPoker.pyw
          python -m py_compile staging/source_1_3_101/pigeon_updater.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/poker_reasoning.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py
      - name: Verify one shared all-street action UI and editable preflop default
        run: |
          python staging/test_postflop_controls.py
          python staging/test_preflop_user_actions.py
      - name: Verify one-time wallet credit
        run: python staging/test_wallet_bonus.py
      - name: Verify effect volume and updater contract
        run: |
          python staging/test_sound_volume_settings.py
          python staging/test_updater_package_requirements.py
      - name: Verify immutable chart and range reasoning
        run: |
          cp staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py staging/preflop_screenshot_ranges_75.py
          python staging/test_preflop_ranges_75.py
          python staging/test_poker_reasoning.py
