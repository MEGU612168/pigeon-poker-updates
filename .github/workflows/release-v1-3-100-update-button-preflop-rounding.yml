name: Release Pigeon Poker v1.3.100 always-clickable updater and fixed preflop sizing

on:
  push:
    paths:
      - "releases/v1.3.100/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate Stable v1.3.100
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import subprocess
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.99"
          TARGET_VERSION = "1.3.100"
          SOURCE_SHA256 = "7834124c5dbb02c34774eb52dde8c5d70d40c1963698d5ec904670dd4fe75900"
          SOURCE_SIZE = 270126
          source_url = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )
          request = urllib.request.Request(
              source_url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              encoded = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.99 payload size mismatch.")
          if hashlib.sha256(payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.99 payload SHA-256 mismatch.")

          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("v1.3.99 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.99 package file layout.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned v1.3.99 VERSION.txt mismatch.")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return source.replace(old, new, 1)

          main = files["PigeonPoker.pyw"].decode("utf-8")
          main = replace_once(
              main,
              'text="CHECKING…", style="MutedUpdate.TButton",\n            command=self._begin_app_update, state="disabled",',
              'text="CHECK / UPDATE", style="Accent.TButton",\n            command=self._begin_app_update, state="normal",',
              "make global update button always clickable at startup",
          )
          main = replace_once(
              main,
              '"""Recheck the stable channel every 30 minutes while Pigeon is open."""',
              '"""Recheck the stable channel every minute while Pigeon is open."""',
              "correct updater interval documentation",
          )

          refresh_start = main.index("    def _refresh_update_button_state(self):")
          refresh_end = main.index("\n    def _begin_app_update(self):", refresh_start)
          refresh_method = '''\
          def _refresh_update_button_state(self):
              """Check the stable manifest without disabling the manual update button."""
              if getattr(self, "_update_check_active", False) or getattr(self, "_update_in_progress", False):
                  return
              self._update_check_active = True
              try:
                  self.update_button.configure(
                      state="normal", style="Accent.TButton", text="CHECK / UPDATE"
                  )
              except tk.TclError:
                  self._update_check_active = False
                  return
          
              def on_result(available: bool, current: str, candidate: str):
                  def apply_result():
                      self._update_check_active = False
                      self.update_button.configure(
                          state="normal", style="Accent.TButton", text="CHECK / UPDATE"
                      )
                      if available:
                          self.update_status_var.set(
                              f"Update {candidate} available (current {current}). Press CHECK / UPDATE."
                          )
                      else:
                          self.update_status_var.set(
                              f"Pigeon Poker is up to date ({current}). Press CHECK / UPDATE to check again."
                          )
                  try:
                      self.after(0, apply_result)
                  except tk.TclError:
                      pass
          
              def on_error(error: str):
                  def apply_error():
                      self._update_check_active = False
                      self.update_button.configure(
                          state="normal", style="Accent.TButton", text="CHECK / UPDATE"
                      )
                      self.update_status_var.set(
                          f"Update check failed: {error} • Press CHECK / UPDATE to retry."
                      )
                  try:
                      self.after(0, apply_error)
                  except tk.TclError:
                      pass
          
              start_update_availability_check(ROOT, on_result, on_error)
          '''
                    refresh_method = "\n".join(
                        "    " + line if line else "" for line in refresh_method.rstrip().splitlines()
                    )
                    main = main[:refresh_start] + refresh_method.rstrip() + main[refresh_end:]
          
                    begin_start = main.index("    def _begin_app_update(self):")
          begin_end = main.index("\n    def _save_betting_display_settings(self):", begin_start)
          begin_method = '''\
          def _begin_app_update(self):
              """Check, verify and apply a stable update while keeping the button clickable."""
              if getattr(self, "_update_in_progress", False):
                  return
              self._update_in_progress = True
              self.update_button.configure(
                  state="normal", style="Accent.TButton", text="CHECK / UPDATE"
              )
              self.update_status_var.set("Checking for updates…")
          
              def report(message: str):
                  def apply_report():
                      self.update_status_var.set(message)
                      if message.startswith("Pigeon Poker is up to date"):
                          self._update_in_progress = False
                          self.update_button.configure(
                              state="normal", style="Accent.TButton", text="CHECK / UPDATE"
                          )
                  try:
                      self.after(0, apply_report)
                  except tk.TclError:
                      pass
          
              def close_for_update():
                  def close_now():
                      try:
                          self.update_status_var.set("Applying update and restarting Pigeon Poker…")
                      except tk.TclError:
                          pass
                      self.after(500, self._on_close)
                  try:
                      self.after(0, close_now)
                  except tk.TclError:
                      pass
          
              def show_error(message: str):
                  def display_error():
                      self._update_in_progress = False
                      try:
                          self.update_button.configure(
                              state="normal", style="Accent.TButton", text="CHECK / UPDATE"
                          )
                          self.update_status_var.set(message)
                          messagebox.showerror("Pigeon Poker Update", message, parent=self)
                      except tk.TclError:
                          pass
                  try:
                      self.after(0, display_error)
                  except tk.TclError:
                      pass
          
              start_update_check(ROOT, os.getpid(), report, close_for_update, show_error)
'''
          begin_method = "\n".join(
              "    " + line if line else "" for line in begin_method.rstrip().splitlines()
          )
          main = main[:begin_start] + begin_method.rstrip() + main[begin_end:]

          # Make sure no updater-result path disables the global manual button.
          forbidden = [
              'self.update_button.configure(state="disabled"',
              'self.update_button.configure(state="disabled",',
          ]
          for pattern in forbidden:
              if pattern in main:
                  raise SystemExit("Updater still disables its manual button: " + pattern)
          if 'text="CHECK / UPDATE"' not in main:
              raise SystemExit("Persistent manual update control label missing.")
          ast.parse(main, filename="PigeonPoker.pyw")
          files["PigeonPoker.pyw"] = main.encode("utf-8")

          pre = files["pigeon_poker/preflop_screenshot_ranges.py"].decode("utf-8")
          pre = replace_once(
              pre,
              "import random\nfrom dataclasses import dataclass",
              "import random\nfrom decimal import Decimal, ROUND_HALF_UP\nfrom dataclasses import dataclass",
              "add deterministic chip-denomination rounding",
          )
          pre = replace_once(
              pre,
              "def _clamp_raise_target(desired: int, legal: dict[str, Any]) -> int | None:\n",
              '''def _bb_target_to_cents(amount_bb: Any, big_blind_cents: int) -> int:
              """Convert a fixed chart BB target to the nearest available cent.

              ROUND_HALF_UP avoids Python's ties-to-even behavior (2.5 * 25
              becoming 62 cents and appearing as 2.48 BB at NL25). The screenshot
              chart value itself is never altered.
              """
              blind = int(big_blind_cents)
              amount = Decimal(str(amount_bb)) * Decimal(blind)
              if not amount.is_finite() or amount < 0 or blind <= 0:
                  raise ValueError("Invalid fixed chart BB target")
              return int(amount.quantize(Decimal("1"), rounding=ROUND_HALF_UP))


          def _clamp_raise_target(desired: int, legal: dict[str, Any]) -> int | None:
          ''',
              "add fixed-chart chip conversion and reject rather than resize illegal target",
          )
          clamp_start = pre.index("def _clamp_raise_target(desired: int, legal: dict[str, Any]) -> int | None:")
          clamp_end = pre.index("\n\ndef _decision_choices(", clamp_start)
          clamp_method = '''def _clamp_raise_target(desired: int, legal: dict[str, Any]) -> int | None:
              """Return the chart target unchanged only when that exact chip target is legal."""
              try:
                  target = int(desired)
                  minimum = legal.get("min_target")
                  maximum = legal.get("max_target")
                  if target <= 0:
                      return None
                  if minimum is not None and target < int(minimum):
                      return None
                  if maximum is not None and target > int(maximum):
                      return None
                  return target
              except (TypeError, ValueError, OverflowError):
                  return None
          '''
          pre = pre[:clamp_start] + clamp_method.rstrip() + pre[clamp_end:]
          pre = replace_once(
              pre,
              'desired = int(round(float(item["amount_bb"]) * big_blind))',
              'desired = _bb_target_to_cents(item["amount_bb"], big_blind)',
              "use half-up rounding for fixed screenshot BB targets",
          )
          # The 75 nodes, 169 classes, per-action frequencies and BB size values
          # remain byte-identical inside the compressed policy blob.
          ast.parse(pre, filename="preflop_screenshot_ranges.py")
          files["pigeon_poker/preflop_screenshot_ranges.py"] = pre.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")

          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final ZIP CRC failure: " + bad)
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final package file set mismatch.")
              main_check = archive.read("PigeonPoker.pyw").decode("utf-8")
              pre_check = archive.read("pigeon_poker/preflop_screenshot_ranges.py").decode("utf-8")
              ast.parse(main_check, filename="PigeonPoker.pyw")
              ast.parse(pre_check, filename="preflop_screenshot_ranges.py")
              assert 'state="normal", style="Accent.TButton", text="CHECK / UPDATE"' in main_check
              assert "ROUND_HALF_UP" in pre_check
              assert 'amount_bb' in pre_check
              assert "node_count" in pre_check
              assert "Pigeon Poker is up to date" in main_check

          digest = hashlib.sha256(final_payload).hexdigest()
          final_encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(final_encoded, encoding="ascii")
          parts = []
          for index, offset in enumerate(range(0, len(final_encoded), 48000)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(final_encoded[offset:offset + 48000], encoding="ascii")
              parts.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": parts}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "上部のCHECK / UPDATEボタンを、確認中・最新版・確認失敗を含む全状態で常時クリック可能に変更。"
              "起動時確認と60秒ごとの自動確認を維持し、手動ボタンからいつでも再確認・更新可能。"
              "プリフロップの75局面・12,675ハンドクラス・頻度・固定BB指定サイズは変更せず、"
              "NL25等で2.5BB×25セントがPythonの偶数丸めにより62セント(2.48BB)となる誤差だけを"
              "ROUND_HALF_UPへ修正。1セント刻みで厳密に表せない場合は最寄りセントへ変換し、"
              "チャート指定額が合法額でない場合に別サイズへ勝手に変更せず、そのアクションを除外。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "update_button_always_clickable": True,
              "automatic_update_check_interval_ms": 60000,
              "preflop_75_node_policy_preserved": True,
              "preflop_12675_hand_rows_preserved": True,
              "preflop_chart_bb_sizes_preserved": True,
              "preflop_chip_conversion_rounding": "ROUND_HALF_UP",
              "illegal_fixed_chart_target_resized": False,
              "postflop_ui_preserved": True,
              "withdrawable_redeposit_preserved": True,
              "package_ast_and_zip_crc": "passed",
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          pathlib.Path("dist").mkdir(exist_ok=True)
          (pathlib.Path("dist") / f"PigeonPoker_{TARGET_VERSION}.zip").write_bytes(final_payload)

          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+users.noreply.github.com"], check=True
          )
          subprocess.run(["git", "add", "stable.json", str(release_dir)], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.100 always-clickable updater and fixed BB rounding"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "sha256": digest,
              "payload_size": len(final_payload),
              "update_button_always_clickable": True,
              "automatic_check_interval_ms": 60000,
              "preflop_policy_data_unchanged": True,
              "rounding": "ROUND_HALF_UP",
              "illegal_chart_size_mutation": False,
          }, ensure_ascii=False, indent=2))
          PY
