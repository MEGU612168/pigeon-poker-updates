name: Build Pigeon Poker v1.3.73 GTO+ docking timing fix

on:
  push:
    paths:
      - "releases/v1.3.73/build.request"

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify v1.3.72 base and defer GTO+ docking until its host is visible
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import sys
          import time
          import urllib.request
          import zipfile

          root = pathlib.Path(".")
          source_version = "1.3.72"
          target_version = "1.3.73"
          source_sha256 = "58f5d2a456d13a93f3167c91959a4d3def8713271fc759f5581464ab469ccbed"
          source_size = 223610
          source_url = (
              "https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/"
              "releases/v1.3.72/payload-updater.zip.b64?v=" + source_sha256
          )

          with urllib.request.urlopen(source_url, timeout=90) as response:
              encoded = response.read().decode("ascii").strip()
          source_payload = base64.b64decode(encoded, validate=True)
          if len(source_payload) != source_size:
              raise SystemExit("Pinned v1.3.72 payload size mismatch.")
          if hashlib.sha256(source_payload).hexdigest() != source_sha256:
              raise SystemExit("Pinned v1.3.72 payload SHA-256 mismatch.")

          with zipfile.ZipFile(io.BytesIO(source_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Pinned v1.3.72 ZIP integrity failure: " + bad)
              files = {}
              for info in archive.infolist():
                  if info.is_dir():
                      raise SystemExit("Unexpected directory entry: " + info.filename)
                  name = info.filename
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or "." in path.parts or path.as_posix() != name or "\\" in name:
                      raise SystemExit("Unsafe source package path: " + name)
                  allowed_root = name in {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}
                  allowed_module = (
                      len(path.parts) >= 2
                      and path.parts[0] in {"pigeon_poker", "pigeon_gto_plus"}
                      and path.suffix.lower() == ".py"
                      and not any(part.startswith(".") or part == "__pycache__" for part in path.parts)
                  )
                  if not (allowed_root or allowed_module):
                      raise SystemExit("Non-allow-listed source package path: " + name)
                  key = name.casefold()
                  if any(existing.casefold() == key for existing in files):
                      raise SystemExit("Duplicate source path: " + name)
                  files[name] = archive.read(name)

          required = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          if not required.issubset(files):
              raise SystemExit("Pinned v1.3.72 source is missing required application files.")
          if files["VERSION.txt"].decode("utf-8").strip() != source_version:
              raise SystemExit("Pinned v1.3.72 VERSION.txt mismatch.")

          main = files["PigeonPoker.pyw"].decode("utf-8")

          # Never start GTO+ while the app is still showing the Lobby. The native
          # SetParent target must be a mapped, live GTO+ host inside the GTO page.
          startup_schedule = "        self.after(1200, self._auto_start_gto_plus)\n"
          if main.count(startup_schedule) != 1:
              raise SystemExit("Could not uniquely locate the unsafe hidden-page GTO+ startup timer.")
          main = main.replace(startup_schedule, "", 1)

          attach_state = "        self._gto_auto_connect_requested = False\n"
          if main.count(attach_state) != 1:
              raise SystemExit("Could not locate the GTO+ auto-connect state.")
          main = main.replace(
              attach_state,
              attach_state + "        self._gto_auto_start_attempts = 0\n",
              1
          )

          page_anchor = (
              '        if key == "poker_craft" and hasattr(self, "history_tree"):\n'
              '            self._refresh_pokercraft()\n'
          )
          page_addition = page_anchor + (
              '        if key == "gto":\n'
              '            self._gto_auto_start_attempts = 0\n'
              '            self.after(300, self._auto_start_gto_plus)\n'
          )
          if main.count(page_anchor) != 1:
              raise SystemExit("Could not uniquely locate show_page() completion.")
          main = main.replace(page_anchor, page_addition, 1)

          start = main.find("    def _auto_start_gto_plus(self):\n")
          end = main.find("    def _auto_connect_gto_plus(self):\n", start)
          if start < 0 or end < 0 or main.count("    def _auto_start_gto_plus(self):\n") != 1:
              raise SystemExit("Could not uniquely locate _auto_start_gto_plus().")
          auto_start = "\n".join([
              "    def _find_existing_gto_process_id(self) -> int | None:",
              "        \"\"\"Find one exact running GTO+ executable; never choose by process name alone.\"\"\"",
              "        if os.name != \"nt\":",
              "            return None",
              "        expected = Path(self.executable_var.get()).expanduser().resolve()",
              "        if not expected.is_file():",
              "            return None",
              "        listed = subprocess.run(",
              "            [\"tasklist\", \"/FI\", f\"IMAGENAME eq {expected.name}\", \"/FO\", \"CSV\", \"/NH\"],",
              "            check=False, capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\",",
              "            creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0),",
              "        )",
              "        candidate_pids = set()",
              "        for line in (listed.stdout or \"\").splitlines():",
              "            fields = line.strip().strip('\"').split('\",\"')",
              "            if len(fields) >= 2 and fields[1].isdigit():",
              "                candidate_pids.add(int(fields[1]))",
              "        if not candidate_pids:",
              "            return None",
              "        kernel32 = ctypes.WinDLL(\"kernel32\", use_last_error=True)",
              "        open_process = kernel32.OpenProcess",
              "        open_process.argtypes = [ctypes.c_uint32, ctypes.c_int, ctypes.c_uint32]",
              "        open_process.restype = ctypes.c_void_p",
              "        query_image = kernel32.QueryFullProcessImageNameW",
              "        query_image.argtypes = [ctypes.c_void_p, ctypes.c_uint32, ctypes.POINTER(ctypes.c_wchar), ctypes.POINTER(ctypes.c_uint32)]",
              "        query_image.restype = ctypes.c_int",
              "        close_handle = kernel32.CloseHandle",
              "        close_handle.argtypes = [ctypes.c_void_p]",
              "        close_handle.restype = ctypes.c_int",
              "        expected_key = os.path.normcase(str(expected))",
              "        matches = []",
              "        unverified = []",
              "        for pid in sorted(candidate_pids):",
              "            handle = open_process(0x1000, 0, int(pid))",
              "            if not handle:",
              "                unverified.append(pid)",
              "                continue",
              "            try:",
              "                image_path = ctypes.create_unicode_buffer(32768)",
              "                image_size = ctypes.c_uint32(len(image_path))",
              "                if not query_image(handle, 0, image_path, ctypes.byref(image_size)):",
              "                    unverified.append(pid)",
              "                    continue",
              "                actual_key = os.path.normcase(str(Path(image_path.value).resolve()))",
              "                if actual_key == expected_key:",
              "                    matches.append(pid)",
              "            except (OSError, ValueError):",
              "                unverified.append(pid)",
              "            finally:",
              "                close_handle(handle)",
              "        if len(matches) > 1:",
              "            raise RuntimeError(\"同じGTO+実行ファイルが複数起動しています。重複起動を防ぐため自動接続を停止しました。\")",
              "        if unverified:",
              "            raise RuntimeError(\"同名GTO.exeの実行ファイルを確認できません。重複起動を防ぐため自動起動を停止しました。\")",
              "        return matches[0] if matches else None",
              "",
              "    def _auto_start_gto_plus(self):",
              "        \"\"\"Dock GTO+ only after the GTO page and its native host are actually visible.\"\"\"",
              "        if self._gto_attach_requested or self._active_page_key != \"gto\":",
              "            return",
              "        if self.gto_embedded:",
              "            self.after(500, self._auto_connect_gto_plus)",
              "            return",
              "        try:",
              "            self.update_idletasks()",
              "            host_ready = bool(",
              "                self.gto_viewport.winfo_ismapped()",
              "                and self.gto_host.winfo_ismapped()",
              "                and self.gto_viewport.winfo_width() >= 100",
              "                and self.gto_viewport.winfo_height() >= 100",
              "            )",
              "            if not host_ready or not self._layout_embedded_gto_host():",
              "                self._gto_auto_start_attempts += 1",
              "                if self._gto_auto_start_attempts <= 20:",
              "                    self.after(200, self._auto_start_gto_plus)",
              "                else:",
              "                    self.status_var.set(\"GTO+表示先の準備ができません。GTO+ Engine画面を開き直してください。\")",
              "                return",
              "        except (tk.TclError, AttributeError):",
              "            self._gto_auto_start_attempts += 1",
              "            if self._gto_auto_start_attempts <= 20:",
              "                self.after(200, self._auto_start_gto_plus)",
              "            else:",
              "                self.status_var.set(\"GTO+表示先の準備を確認できません。\")",
              "            return",
              "        self.status_var.set(\"GTO+を表示領域へ接続中…\")",
              "        process = getattr(self.integration, \"process\", None)",
              "        try:",
              "            process_is_alive = process is not None and process.poll() is None",
              "        except Exception:",
              "            process_is_alive = process is not None",
              "        if process_is_alive:",
              "            process_id = getattr(process, \"pid\", None)",
              "            if process_id:",
              "                self._attach_existing_gto(int(process_id))",
              "            else:",
              "                self.status_var.set(\"起動済みGTO+のPIDを確認できません。\")",
              "            return",
              "        try:",
              "            external_pid = self._find_existing_gto_process_id()",
              "        except Exception as exc:",
              "            self.status_var.set(f\"GTO+既存プロセス確認失敗: {exc}\")",
              "            return",
              "        if external_pid is not None:",
              "            # Reattach a leftover exact-path GTO+ instance from v1.3.72.",
              "            self._attach_existing_gto(int(external_pid))",
              "            return",
              "        self._launch_gto()",
              "        if self.gto_embedded:",
              "            self.after(1500, self._auto_connect_gto_plus)",
              ""
          ]) + "\n"
          main = main[:start] + auto_start + main[end:]

          # Guard both launch and attach paths against a hidden/unmapped HWND.
          launch_anchor = (
              "            self._save_connection_config()\n"
              "            self.update_idletasks()\n"
              "            host_hwnd = int(self.gto_host.winfo_id())\n"
          )
          launch_replacement = (
              "            self._save_connection_config()\n"
              "            self.update_idletasks()\n"
              '            if self._active_page_key != "gto" or not self.gto_viewport.winfo_ismapped() or not self.gto_host.winfo_ismapped():\n'
              '                raise RuntimeError("GTO+ Engine画面が表示されてから起動してください。")\n'
              '            if not self._layout_embedded_gto_host():\n'
              '                raise RuntimeError("GTO+表示領域のサイズを確定できません。")\n'
              "            self.update_idletasks()\n"
              "            host_hwnd = int(self.gto_host.winfo_id())\n"
          )
          if main.count(launch_anchor) != 1:
              raise SystemExit("Could not uniquely locate the GTO+ launch parent HWND block.")
          main = main.replace(launch_anchor, launch_replacement, 1)

          attach_anchor = (
              "            self.update_idletasks()\n"
              "            hwnd = self.integration.attach_existing_and_dock(\n"
              "                process_id, int(self.gto_host.winfo_id()), startup_timeout=15,\n"
          )
          attach_replacement = (
              "            self.update_idletasks()\n"
              '            if self._active_page_key != "gto" or not self.gto_viewport.winfo_ismapped() or not self.gto_host.winfo_ismapped():\n'
              '                raise RuntimeError("GTO+ Engine画面が表示されてから再接続してください。")\n'
              '            if not self._layout_embedded_gto_host():\n'
              '                raise RuntimeError("GTO+表示領域のサイズを確定できません。")\n'
              "            self.update_idletasks()\n"
              "            hwnd = self.integration.attach_existing_and_dock(\n"
              "                process_id, int(self.gto_host.winfo_id()), startup_timeout=15,\n"
          )
          if main.count(attach_anchor) != 1:
              raise SystemExit("Could not uniquely locate the GTO+ existing-process attach block.")
          main = main.replace(attach_anchor, attach_replacement, 1)

          launch_error_anchor = (
              "            if still_running:\n"
              "                self.gto_embedded = False\n"
          )
          launch_error_replacement = (
              "            if still_running:\n"
              "                try:\n"
              "                    self.gto_owned_process_pid = int(process.pid)\n"
              "                except Exception:\n"
              "                    pass\n"
              "                self.gto_embedded = False\n"
          )
          if main.count(launch_error_anchor) != 1:
              raise SystemExit("Could not uniquely locate the launch failure ownership block.")
          main = main.replace(launch_error_anchor, launch_error_replacement, 1)

          # Keep the placeholder only until a real GTO+ child has docked.
          placeholder_old = (
              '        tk.Label(self.gto_host, text="GTO+ window will appear here after launch.\\nIf native docking fails, GTO+ will remain in a separate window.", bg="#080f18", fg=COLORS["muted"], justify="center", font=("Segoe UI", 11)).place(relx=.5, rely=.5, anchor="center")\n'
          )
          placeholder_new = (
              '        self.gto_placeholder_label = tk.Label(self.gto_host, text="GTO+ window will appear here after launch.\\nIf native docking fails, GTO+ will remain in a separate window.", bg="#080f18", fg=COLORS["muted"], justify="center", font=("Segoe UI", 11))\n'
              '        self.gto_placeholder_label.place(relx=.5, rely=.5, anchor="center")\n'
          )
          if main.count(placeholder_old) != 1:
              raise SystemExit("Could not uniquely locate the GTO+ host placeholder label.")
          main = main.replace(placeholder_old, placeholder_new, 1)

          placeholder_helper = "\n".join([
              "    def _hide_gto_placeholder(self):",
              "        label = getattr(self, \"gto_placeholder_label\", None)",
              "        if label is not None:",
              "            try:",
              "                if label.winfo_exists():",
              "                    label.destroy()",
              "            except tk.TclError:",
              "                pass",
              "            self.gto_placeholder_label = None",
              ""
          ]) + "\n"
          helper_anchor = "    def _launch_gto(self):\n"
          if main.count(helper_anchor) != 1:
              raise SystemExit("Could not locate _launch_gto() for placeholder helper.")
          main = main.replace(helper_anchor, placeholder_helper + helper_anchor, 1)

          launch_success = (
              '            self.gto_embedded = True\n'
              '            self.status_var.set(f"GTO+をPigeon内に表示中 (HWND {hwnd})")\n'
          )
          launch_success_new = launch_success + "            self._hide_gto_placeholder()\n"
          if main.count(launch_success) != 2:
              raise SystemExit("Expected exactly two GTO+ launch/attach success blocks.")
          main = main.replace(launch_success, launch_success_new)

          ast.parse(main, filename="PigeonPoker.pyw")
          # Assertions specifically prevent the old startup-before-show regression.
          if startup_schedule in main:
              raise SystemExit("Unsafe GTO+ auto-start timer remains in the app constructor.")
          if main.count('self.after(300, self._auto_start_gto_plus)') != 1:
              raise SystemExit("GTO+ auto-start must be scheduled exactly once when GTO Engine is opened.")
          for required_text in (
              'if key == "gto":',
              "self.gto_viewport.winfo_ismapped()",
              "self.gto_host.winfo_ismapped()",
              "self._layout_embedded_gto_host()",
              "self._attach_existing_gto(int(process_id))",
              "def _find_existing_gto_process_id(self) -> int | None:",
              "QueryFullProcessImageNameW",
              "self._find_existing_gto_process_id()",
              "self._launch_gto()",
              "def _hide_gto_placeholder(self):",
              "self._hide_gto_placeholder()",
          ):
              if required_text not in main:
                  raise SystemExit("Missing GTO+ docking guard: " + required_text)
          if 'self._active_page_key != "gto"' not in main:
              raise SystemExit("GTO+ auto-start is not protected by the active page check.")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (target_version + "\n").encode("ascii")
          for name, content in files.items():
              if name.endswith(".py"):
                  ast.parse(content.decode("utf-8"), filename=name)
          ast.parse(files["pigeon_gto_plus/auto_solve_ui.py"].decode("utf-8"),
                    filename="pigeon_gto_plus/auto_solve_ui.py")
          ast.parse(files["pigeon_gto_plus/live_range_builder.py"].decode("utf-8"),
                    filename="pigeon_gto_plus/live_range_builder.py")
          ast.parse(files["pigeon_gto_plus/ui_probe.py"].decode("utf-8"),
                    filename="pigeon_gto_plus/ui_probe.py")

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final v1.3.73 ZIP integrity check failed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != target_version:
                  raise SystemExit("Final v1.3.73 version marker mismatch.")
              if set(archive.namelist()) != set(files):
                  raise SystemExit("Final v1.3.73 package contents changed unexpectedly.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")

          digest = hashlib.sha256(payload).hexdigest()
          encoded_payload = base64.b64encode(payload).decode("ascii")
          release_dir = root / "releases" / ("v" + target_version)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded_payload, encoding="ascii")
          chunk_size = 48000
          part_names = []
          for index, offset in enumerate(range(0, len(encoded_payload), chunk_size)):
              part_name = f"payload.part-{index:03d}"
              (release_dir / part_name).write_text(encoded_payload[offset:offset + chunk_size], encoding="ascii")
              part_names.append(part_name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": part_names}, indent=2) + "\n", encoding="utf-8"
          )

          published_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          release_notes = (
              "GTO+の自動起動をPigeon起動直後からGTO+ Engine画面を開いた後へ変更。"
              "画面と埋め込み先HWNDが表示済みで、サイズ確定後にのみSetParent/ドッキングを実行。"
              "前回ドッキング失敗で残った既存GTO+プロセスは二重起動せず同じPIDへ再接続。"
              "埋め込み成功後はプレースホルダーを除去。v1.3.72の665:570比率維持・座標補正を継承。"
          )
          metadata = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": published_at,
              "package_mode": "full",
              "release_notes": release_notes,
              "payload_sha256": digest,
              "payload_size": len(payload),
              "files": sorted(files),
              "source_version": source_version,
              "responsive_gto_workspace": True,
              "gto_docking_requires_mapped_host": True,
              "existing_process_reattach": True,
              "existing_external_process_detection": True,
          }
          (release_dir / "release.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (release_dir / "payload.ready").write_text("verified " + target_version + "\n", encoding="ascii")
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": published_at,
              "release_notes": release_notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  "https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/"
                  + "releases/v" + target_version + "/payload-updater.zip.b64?v=" + digest
              ),
              "payload_sha256": digest,
              "payload_size": len(payload),
          }
          (root / "stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "source_version": source_version,
              "published_version": target_version,
              "payload_size": len(payload),
              "payload_sha256": digest,
              "files": sorted(files),
              "auto_start_after_gto_page_mapped": True,
              "existing_process_reattach": True,
              "existing_external_process_detection": True,
              "aspect_preserving_workspace": True,
          }, ensure_ascii=False))
          PY
      - name: Publish v1.3.73 stable package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.73/
          git commit -m "Release Pigeon Poker v1.3.73 GTO docking timing fix"
          git push
