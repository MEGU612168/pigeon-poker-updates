name: Release Pigeon Poker v1.3.93 blocker-aware preflop ranges

on:
  push:
    paths:
      - "releases/v1.3.93/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify preflop policy and blocker-aware opponent inference
        shell: bash
        run: |
          set -euo pipefail
          python staging/test_preflop_ranges_75.py
          python - <<'PY'
          import ast
          import pathlib
          source = pathlib.Path("staging/preflop_screenshot_ranges_75.py").read_text(encoding="utf-8")
          tests = pathlib.Path("staging/test_preflop_ranges_75.py").read_text(encoding="utf-8")
          tree = ast.parse(source, filename="preflop_screenshot_ranges_75.py")
          test_tree = ast.parse(tests, filename="test_preflop_ranges_75.py")
          test_count = sum(
              1 for node in test_tree.body
              if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")
          )
          if test_count < 19:
              raise SystemExit(f"Expected at least 19 regression tests, found {test_count}")
          if not any(isinstance(node, ast.FunctionDef) and node.name == "_available_combos_for_class" for node in tree.body):
              raise SystemExit("Physical-combo blocker adjustment is missing.")
          if not any(isinstance(node, ast.FunctionDef) and node.name == "_known_public_blockers" for node in tree.body):
              raise SystemExit("Known-card blocker extraction is missing.")
          print(f"Policy syntax: PASS; regression tests: {test_count}")
          PY

      - name: Build Stable package from the currently published v1.3.92
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile
          import subprocess

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.92"
          TARGET_VERSION = "1.3.93"
          SOURCE_SHA256 = "16df4d10e6528648d664c7fc862649012cf1f385bba2be52a8ff72b99bfb2f3b"
          SOURCE_SIZE = 264812
          url = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )
          request = urllib.request.Request(
              url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              encoded_source = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded_source, validate=True)
          if len(payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.92 package size mismatch.")
          if hashlib.sha256(payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.92 package SHA-256 mismatch.")

          expected = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("v1.3.92 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != expected:
              raise SystemExit("Unexpected pinned v1.3.92 package layout.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned source version marker mismatch.")

          main = files["PigeonPoker.pyw"].decode("utf-8")
          if "PigeonGTOPlusIntegration" in main or "cash_gto_waiting" in main:
              raise SystemExit("The v1.3.92 GTO+ ENGINE removal must remain intact.")

          module_path = "pigeon_poker/preflop_screenshot_ranges.py"
          source_path = pathlib.Path("staging/preflop_screenshot_ranges_75.py")
          test_path = pathlib.Path("staging/test_preflop_ranges_75.py")
          strategy_source = source_path.read_text(encoding="utf-8")
          test_source = test_path.read_text(encoding="utf-8")
          ast.parse(strategy_source, filename=module_path)
          test_tree = ast.parse(test_source, filename="test_preflop_ranges_75.py")
          test_count = sum(
              1 for node in test_tree.body
              if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")
          )
          if test_count < 19:
              raise SystemExit("Regression test count unexpectedly decreased.")
          files[module_path] = strategy_source.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")

          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final package ZIP CRC validation failed.")
              if set(archive.namelist()) != expected:
                  raise SystemExit("Final package file list changed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != TARGET_VERSION:
                  raise SystemExit("Final version marker mismatch.")
              final_module = archive.read(module_path).decode("utf-8")
              ast.parse(final_module, filename=module_path)
              if "_available_combos_for_class" not in final_module:
                  raise SystemExit("Blocker-aware strategy module not packaged.")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          chunks = []
          for index, offset in enumerate(range(0, len(encoded), 48000)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(encoded[offset:offset + 48000], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "Stable v1.3.92の変更（通常利用経路からGTO+ ENGINEを外した状態）を維持。"
              "プリフロップ75局面・12,675ハンドクラス、CPUのチャート判断と100BB・6人配札ガードを維持。"
              "相手レンジ推定APIでは、自分の2枚のカードと公開ボードのカードをブロッカーとして物理コンボ数を補正し、"
              "他プレイヤーの非公開カードは参照しない。写真由来の169クラス近似であり、ソルバー生コンボ頻度ではない。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "preflop_node_count": 75,
              "hand_classes_per_node": 169,
              "preflop_hand_rows": 12675,
              "nodes_with_raise_actions": 50,
              "nodes_with_allin_actions": 20,
              "preflop_module_changed": True,
              "opponent_range_blocker_adjustment": True,
              "gto_plus_engine_removed_from_runtime": True,
              "gto_plus_solver_required_for_cash_cpu": False,
              "regression_test_count": test_count,
              "regression_tests": "Passed in GitHub Actions",
              "frequency_method": "screenshot-colour-area estimated hand-class frequencies calibrated to displayed action totals; not solver-exact combo frequencies",
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("dist").mkdir(exist_ok=True)
          artifact = pathlib.Path("dist") / f"PigeonPoker_{TARGET_VERSION}.zip"
          artifact.write_bytes(final_payload)
          with zipfile.ZipFile(artifact, "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Installable ZIP verification failed.")
          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(
              ["git", "add", "stable.json", str(release_dir)],
              check=True,
          )
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.93 blocker-aware preflop ranges"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "preflop_nodes": 75,
              "hand_classes_per_node": 169,
              "preflop_rows": 12675,
              "regression_tests": test_count,
              "blocker_adjustment": True,
          }, ensure_ascii=False, indent=2))
          PY
