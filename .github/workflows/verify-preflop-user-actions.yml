name: Verify Pigeon Poker unrestricted preflop user actions

on:
  push:
    paths:
      - "staging/source_1_3_101/PigeonPoker.pyw"
      - "staging/test_preflop_user_actions.py"
      - ".github/workflows/verify-preflop-user-actions.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application
        run: python -m py_compile staging/source_1_3_101/PigeonPoker.pyw
      - name: Test unrestricted hero actions and preflop-only sizing
        run: python staging/test_preflop_user_actions.py
      - name: Run postflop action UI regression
        run: python staging/test_postflop_controls.py
      - name: Run effect volume settings regression
        run: python staging/test_sound_volume_settings.py
      - name: Verify new screenshot-trained GTO policy
        run: python staging/test_preflop_gto_policy.py
