name: Release Pigeon Poker v1.3.99 restore postflop UI and redepositable funds

on:
  push:
    paths:
      - "releases/v1.3.99/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify preserved preflop chart tests
        run: python staging/test_preflop_ranges_75.py
      - name: Build Stable v1.3.99 from exact v1.3.98
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import subprocess
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.98"
          TARGET_VERSION = "1.3.99"
          SOURCE_SHA256 = "ddd66141b88c37cc25f5e9564b62ca786a22dde80a02b4a13a45b1291c8b7591"
          SOURCE_SIZE = 1075468
          source_url = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )
          request = urllib.request.Request(
              source_url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              encoded = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.98 payload size mismatch.")
          if hashlib.sha256(payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.98 payload SHA-256 mismatch.")

          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("v1.3.98 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.98 package file layout.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned v1.3.98 VERSION.txt mismatch.")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return source.replace(old, new, 1)

          main = files["PigeonPoker.pyw"].decode("utf-8")

          # Preflop uses fixed chart BB buttons only. Postflop explicitly
          # retains the legacy slider / amount box / presets / BET or RAISE.
          refresh_start = main.index("    def _refresh_table_windows(")
          hero_start = main.index('            if hand.next_to_act == "hero":', refresh_start)
          hero_end_marker = (
              '            else:\n'
              '                actor = hand.player(hand.next_to_act).name if hand.next_to_act else "CPU"'
          )
          hero_end = main.index(hero_end_marker, hero_start)
          hero_block = '''            if hand.next_to_act == "hero":
                  record["status"].set("YOUR TURN")
                  try:
                      legal = hand.legal_actions("hero")
                      action_names = set(legal.get("actions", []))
                      if hand.street == "preflop" and not bool(state.get("cash_gto_spot_mode", False)):
                          chart_controls = preflop_chart_options(table, hand, "hero")
                          fold_button = record["fold_button"]
                          rush = is_rush_mode(state.get("cash_game_mode", RUSH_MODE))
                          fold_command = (
                              (lambda tid=slot.table_id: self._handle_table_fold(tid))
                              if rush else
                              (lambda tid=slot.table_id: self._floating_table_action(tid, "fold"))
                          )
                          fold_button.configure(
                              text="FOLD", command=fold_command,
                              state="normal" if chart_controls and chart_controls.get("fold") else "disabled"
                          )
                          fold_button.pack(side="left", padx=2)
                          call_action = chart_controls.get("call_action") if chart_controls else None
                          call_label = "CHECK" if call_action == "check" else "CALL"
                          call_button = self._compact_action_button(
                              actions_frame, call_label,
                              (lambda tid=slot.table_id, act=call_action:
                                  self._floating_table_action(tid, act)) if call_action else (lambda: None),
                              "accent"
                          )
                          call_button.configure(state="normal" if call_action else "disabled")
                          call_button.pack(side="left", padx=2)
                          raise_action = chart_controls.get("raise_action") if chart_controls else None
                          raise_amount = chart_controls.get("raise_amount") if chart_controls else None
                          if raise_amount is not None and int(hand.big_blind) > 0:
                              raise_bb = int(raise_amount) / int(hand.big_blind)
                              raise_label = f"RAISE {raise_bb:.2f} BB"
                              if raise_action == "all-in":
                                  raise_label += " (ALL-IN)"
                              raise_button = self._compact_action_button(
                                  actions_frame, raise_label,
                                  lambda tid=slot.table_id, act=raise_action, amt=raise_amount:
                                      self._floating_table_action(tid, act, None if act == "all-in" else amt),
                                  "accent"
                              )
                              raise_button.configure(state="normal")
                          else:
                              raise_button = self._compact_action_button(
                                  actions_frame, "RAISE — BB", lambda: None, "accent"
                              )
                              raise_button.configure(state="disabled")
                          raise_button.pack(side="left", padx=2)
                          record["status"].set(
                              f"YOUR TURN • CHART {chart_controls['node_id']} / {chart_controls['hand_class']}"
                              if chart_controls else "PREFLOP CHART LINE NOT COVERED • NO OFF-CHART ACTION"
                          )
                      else:
                          # Keep the old postflop betting interface intact.
                          rush_preflop = (
                              hand.street == "preflop"
                              and is_rush_mode(state.get("cash_game_mode", RUSH_MODE))
                          )
                          fold_button = record["fold_button"]
                          if rush_preflop or "fold" in action_names:
                              fold_command = (
                                  (lambda tid=slot.table_id: self._handle_table_fold(tid))
                                  if rush_preflop or hand.street != "preflop" else
                                  (lambda tid=slot.table_id: self._floating_table_action(tid, "fold"))
                              )
                              fold_button.configure(
                                  text="FOLD", command=fold_command, state="normal"
                              )
                              fold_button.pack(side="left", padx=2)
                          else:
                              fold_button.pack_forget()
                          if "check" in action_names:
                              self._compact_action_button(
                                  actions_frame, "CHECK",
                                  lambda tid=slot.table_id: self._floating_table_action(tid, "check"),
                                  "accent"
                              ).pack(side="left", padx=2)
                          elif "call" in action_names:
                              self._compact_action_button(
                                  actions_frame,
                                  f"CALL {format_chip_amount(legal['to_call'], bb, self.chip_display_unit)}",
                                  lambda tid=slot.table_id: self._floating_table_action(tid, "call"),
                                  "accent"
                              ).pack(side="left", padx=2)
                          if "bet" in action_names or "raise" in action_names:
                              verb = "bet" if "bet" in action_names else "raise"
                              minimum = int(legal["min_target"])
                              maximum = int(legal["max_target"])
                              minimum = min(minimum, maximum)
                              record["bet_min"], record["bet_max"] = minimum, maximum
                              record["bet_verb"], record["bet_bb"] = verb, bb
                              target = int(record["bet_target_cents"].get())
                              if target <= 0 or target < minimum or target > maximum:
                                  target = minimum
                              record["bet_target_cents"].set(target)
                              record["bet_slider"].set(target)
                              record["bet_target"].set("")
                              self._update_bet_submit_label(slot.table_id)
                              tk.Label(
                                  sizes_frame, text="BET TO" if verb == "bet" else "RAISE TO",
                                  bg=COLORS["panel"], fg=COLORS["muted"],
                                  font=("Segoe UI", 7, "bold")
                              ).pack(side="left", padx=(2, 4))
                              scale = tk.Scale(
                                  sizes_frame, from_=minimum, to=maximum, orient="horizontal",
                                  resolution=1, showvalue=False, variable=record["bet_slider"],
                                  command=lambda value, tid=slot.table_id: self._on_table_bet_slider(tid, value),
                                  length=190, width=10, sliderlength=15, bd=0,
                                  bg=COLORS["panel"], fg=COLORS["text"], troughcolor="#344d68",
                                  activebackground=COLORS["green"], highlightthickness=0,
                                  relief="flat", takefocus=True,
                              )
                              scale.pack(side="left", padx=(0, 4))
                              entry = ttk.Entry(
                                  sizes_frame, textvariable=record["bet_target"], width=7,
                                  font=("Segoe UI", 8), justify="right"
                              )
                              entry.pack(side="left", padx=(0, 2))
                              entry.bind(
                                  "<KeyRelease>",
                                  lambda _e, tid=slot.table_id: self._on_table_bet_entry_change(tid)
                              )
                              entry.bind(
                                  "<Return>",
                                  lambda _e, tid=slot.table_id: self._submit_table_bet_enter(tid),
                                  add="+"
                              )
                              entry.bind(
                                  "<KP_Enter>",
                                  lambda _e, tid=slot.table_id: self._submit_table_bet_enter(tid),
                                  add="+"
                              )
                              unit_text = "BB" if self.chip_display_unit == "BB" else "USD"
                              tk.Label(
                                  sizes_frame, text=unit_text, bg=COLORS["panel"],
                                  fg=COLORS["muted"], font=("Segoe UI", 7)
                              ).pack(side="left", padx=(0, 7))
                              for pct in self.bet_pot_percentages:
                                  self._compact_action_button(
                                      sizes_frame, f"{pct}%",
                                      lambda tid=slot.table_id, p=pct: self._set_table_pot_preset(tid, p),
                                      "normal"
                                  ).pack(side="left", padx=1)
                              submit = self._compact_action_button(
                                  actions_frame, "BET" if verb == "bet" else "RAISE",
                                  lambda tid=slot.table_id, var=record["bet_target"]:
                                      self._floating_table_bet_action(tid, var),
                                  "accent"
                              )
                              submit.pack(side="left", padx=(7, 2))
                              record["bet_action_button"] = submit
                              self._update_bet_submit_label(slot.table_id)
                      tk.Label(
                          actions_frame,
                          text=f"TO CALL {format_chip_amount(legal['to_call'], bb, self.chip_display_unit)}",
                          bg=COLORS["panel"], fg=COLORS["muted"],
                          font=("Segoe UI", 7, "bold")
                      ).pack(side="right", padx=6)
                  except Exception as exc:
                      record["status"].set(f"ACTION ERROR: {exc}")
                  try:
                      record["window"].deiconify()
                  except tk.TclError:
                      pass

          '''
          main = main[:hero_start] + hero_block + main[hero_end:]
          if "tk.Scale(" not in hero_block or "self.bet_pot_percentages" not in hero_block:
              raise SystemExit("Legacy postflop sizing controls not restored.")

          # A single atomic redeposit operation. Funds withdrawn from the
          # poker Wallet are used first; remaining amount may use Study hours.
          redeposit_helper = '''    def _redeposit_available_funds(self, amount_cents: int):
                  import sqlite3
                  amount = int(amount_cents)
                  if amount <= 0:
                      raise ValueError("入金額を入力してください。")
                  snapshot = read_study_time_snapshot()
                  connected = bool(getattr(snapshot, "connected", False))
                  total_seconds = max(0, int(getattr(snapshot, "total_seconds", 0) or 0))
                  now = datetime.now(timezone.utc).isoformat(timespec="seconds")
                  with sqlite3.connect(str(self.wallet_store.db_path), timeout=20) as con:
                      con.row_factory = sqlite3.Row
                      con.execute("PRAGMA busy_timeout=20000")
                      con.execute("BEGIN IMMEDIATE")
                      columns = {row[1] for row in con.execute("PRAGMA table_info(wallet_account)")}
                      if "withdrawable_cents" not in columns:
                          con.execute("ALTER TABLE wallet_account ADD COLUMN withdrawable_cents INTEGER NOT NULL DEFAULT 0")
                      row = con.execute(
                          "SELECT balance_cents,withdrawable_cents FROM wallet_account WHERE account_id=1"
                      ).fetchone()
                      if row is None:
                          con.execute("ROLLBACK")
                          raise ValueError("ウォレット口座が見つかりません。")
                      balance = max(0, int(row["balance_cents"]))
                      withdrawable = max(0, int(row["withdrawable_cents"]))
                      withdrawn_part = min(amount, withdrawable)
                      study_part = amount - withdrawn_part
                      redeemed_row = con.execute(
                          "SELECT COALESCE(SUM(amount_cents),0) FROM study_redemptions"
                      ).fetchone()
                      redeemed = max(0, int(redeemed_row[0] or 0))
                      study_available = (
                          max(0, (total_seconds // 3600) * 100 - redeemed)
                          if connected else 0
                      )
                      if study_part > 0:
                          if not connected:
                              con.execute("ROLLBACK")
                              raise ValueError(
                                  "出金済み残高を超える入金にはFocus TimerのStudy時間が必要です。"
                              )
                          if study_part % 100:
                              con.execute("ROLLBACK")
                              raise ValueError(
                                  "Study時間分の入金は整数ドルです。セント単位の入金には出金済み残高をご利用ください。"
                              )
                          if study_part > study_available:
                              con.execute("ROLLBACK")
                              combined = withdrawn_part + study_available
                              dollar = chr(36)
                              raise ValueError(
                                  f"入金可能額は {dollar}{combined / 100:,.2f} です "
                                  f"(出金済み {dollar}{withdrawn_part / 100:,.2f} + Study {dollar}{study_available / 100:,.2f})。"
                              )
                      new_balance = balance
                      if withdrawn_part > 0:
                          new_balance += withdrawn_part
                          con.execute(
                              "INSERT INTO cashier_transactions "
                              "(transaction_id,played_at,kind,delta_cents,balance_after_cents,recipient,note) "
                              "VALUES(?,?,?,?,?,?,?)",
                              (uuid.uuid4().hex, now, "withdrawable-redeposit", withdrawn_part,
                               new_balance, "", "Returned from Withdrawable Balance to Pigeon Wallet"),
                          )
                      if study_part > 0:
                          new_balance += study_part
                          note = f"Redeemed {study_part // 100} cumulative Study hours at $1/hour"
                          txid = uuid.uuid4().hex
                          con.execute(
                              "INSERT INTO cashier_transactions "
                              "(transaction_id,played_at,kind,delta_cents,balance_after_cents,recipient,note) "
                              "VALUES(?,?,?,?,?,?,?)",
                              (txid, now, "study-time-deposit", study_part, new_balance, "", note),
                          )
                          con.execute(
                              "INSERT INTO study_redemptions "
                              "(transaction_id,redeemed_at,amount_cents,balance_after_cents,total_study_seconds,note) "
                              "VALUES(?,?,?,?,?,?)",
                              (txid, now, study_part, new_balance, total_seconds, note),
                          )
                      new_withdrawable = withdrawable - withdrawn_part
                      con.execute(
                          "UPDATE wallet_account SET balance_cents=?,withdrawable_cents=?,updated_at=? "
                          "WHERE account_id=1",
                          (new_balance, new_withdrawable, now),
                      )
                      con.execute("COMMIT")
                  remaining_study = max(0, study_available - study_part)
                  return {
                      "balance_cents": new_balance,
                      "withdrawable_cents": new_withdrawable,
                      "withdrawn_part_cents": withdrawn_part,
                      "study_part_cents": study_part,
                      "remaining_study_cents": remaining_study,
                  }

          '''
          main = replace_once(
              main,
              "    def _cashier_deposit(self):\n",
              redeposit_helper + "    def _cashier_deposit(self):\n",
              "add atomic deposit from Study and withdrawable funds",
          )

          deposit_start = main.index("    def _cashier_deposit(self):")
          deposit_end = main.index("\n    def _open_study_wallet(self):", deposit_start)
          new_deposit = '''    def _cashier_deposit(self):
                  try:
                      self._sync_external_wallet_balance()
                      amount = self._parse_cashier_amount(self.cashier_amount_var.get())
                      result = self._redeposit_available_funds(amount)
                      self.cash_balance_cents = int(result["balance_cents"])
                      self._update_cash_balance()
                      self._refresh_study_funding_panel()
                      self._refresh_cashier()
                      dollar = chr(36)
                      self.cashier_status_var.set(
                          f"Deposit +{dollar}{amount / 100:.2f} • "
                          f"withdrawn funds {dollar}{result['withdrawn_part_cents'] / 100:.2f} • "
                          f"Study {dollar}{result['study_part_cents'] / 100:.2f}"
                      )
                      self.cashier_amount_var.set("")
                  except Exception as exc:
                      messagebox.showerror("Cashier deposit", str(exc), parent=self)
          '''
          new_deposit = new_deposit.replace("                  ", "        ")
          main = main[:deposit_start] + new_deposit.rstrip() + main[deposit_end:]

          funding_start = main.index("    def _refresh_study_funding_panel(self):")
          funding_end = main.index("\n    def _study_cashier_live_refresh(self):", funding_start)
          funding_method = '''    def _refresh_study_funding_panel(self):
                  if not hasattr(self, "study_depositable_var"):
                      return
                  snapshot = read_study_time_snapshot()
                  self.study_snapshot_connected = bool(snapshot.connected)
                  redeemed = self.wallet_store.redeemed_study_cents()
                  study_available = (
                      available_deposit_cents(snapshot.total_seconds, redeemed)
                      if snapshot.connected else 0
                  )
                  withdrawable = self._withdrawable_balance_cents()
                  total_available = max(0, int(study_available) + int(withdrawable))
                  self.study_depositable_cents = total_available
                  dollar = chr(36)
                  self.study_depositable_var.set(f"{dollar}{total_available / 100:,.2f}")
                  if snapshot.connected:
                      updated = snapshot.updated_at.replace("T", " ")[:19] if snapshot.updated_at else "unknown"
                      self.study_hours_detail_var.set(
                          f"Study allowance {dollar}{study_available / 100:,.2f} + "
                          f"withdrawable {dollar}{withdrawable / 100:,.2f} • "
                          f"Focus Timer {snapshot.total_hours:,.2f}h • Updated {updated}"
                      )
                  else:
                      self.study_hours_detail_var.set(
                          f"Focus Timer not linked • withdrawable {dollar}{withdrawable / 100:,.2f} "
                          "remains available to deposit into Pigeon"
                      )
                  pnl = self._cashier_poker_pnl_cents()
                  try:
                      self.wallet_store.set_live_poker_stack(self._active_cash_table_stacks_cents())
                  except Exception:
                      pass
                  self.poker_pnl_var.set(format_signed_usd(pnl))
                  if self.cashier_pnl_label is not None:
                      colour = COLORS["red"] if pnl < 0 else (COLORS["green"] if pnl > 0 else COLORS["white"])
                      self.cashier_pnl_label.configure(fg=colour)

          '''
          funding_method = funding_method.replace("                  ", "        ")
          main = main[:funding_start] + funding_method.rstrip() + main[funding_end:]

          main = replace_once(
              main,
              'text="DEPOSITABLE FROM STUDY TIME"',
              'text="AVAILABLE TO DEPOSIT"',
              "rename depositable amount label",
          )
          main = replace_once(
              main,
              '"1 full Study hour = $1. Only whole dollars can be redeemed. The allowance updates from Focus Timer history; already redeemed hours are never reused.",\n'
              '                           self._cashier_deposit, "REDEEM STUDY TIME")',
              '"Use previously withdrawn funds first, then remaining whole-dollar Study allowance. Withdrawn funds can be deposited back into your Pigeon Wallet.",\n'
              '                           self._cashier_deposit, "DEPOSIT AVAILABLE FUNDS")',
              "explain combined deposit sources",
          )

          required = [
              "preflop_chart_options(table, hand, \"hero\")",
              "self._floating_table_bet_action(tid, var)",
              "tk.Scale(",
              "self.bet_pot_percentages",
              "BET TO",
              "cash_cpu_timeout",
              "action_seconds_for_street(hand.street)",
              "progress=min(1.0,job[\"frame\"]/2.0)",
              'self.after(1, lambda tid=table_id: self._deal_animation_frame(tid))',
              "def _move_wallet_to_withdrawable(self, amount_cents)",
              "def _redeposit_available_funds(self, amount_cents: int)",
              "withdrawable_migration_v1",
              "AVAILABLE TO DEPOSIT",
          ]
          for item in required:
              if item not in main:
                  raise SystemExit("Required v1.3.99 behavior missing: " + item)
          ast.parse(main, filename="PigeonPoker.pyw")
          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")

          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final ZIP CRC failure: " + bad)
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final package file set mismatch.")
              packaged_main = archive.read("PigeonPoker.pyw").decode("utf-8")
              ast.parse(packaged_main, filename="PigeonPoker.pyw")
              assert "AVAILABLE TO DEPOSIT" in packaged_main
              assert "self._redeposit_available_funds(amount)" in packaged_main
              assert "self.bet_pot_percentages" in packaged_main
              assert "cash_cpu_timeout" in packaged_main

          digest = hashlib.sha256(final_payload).hexdigest()
          final_encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(final_encoded, encoding="ascii")
          parts = []
          for index, offset in enumerate(range(0, len(final_encoded), 48000)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(final_encoded[offset:offset + 48000], encoding="ascii")
              parts.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": parts}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "プリフロップだけを75局面チャートの固定BBアクションにし、ポストフロップは従来の"
              "BET/RAISEスライダー・金額入力・ポットサイズプリセット・実行ボタンを明示的に復元。"
              "出金可能額をCashierの入金可能額へ加算し、Study時間の入金枠と合算表示。"
              "入金時は出金済み残高を先に使い、残りをStudy時間から使う。両方の残高移動と台帳記録は"
              "共有SQLite内の1トランザクションで確定。CPUのストリート別タイマー、超高速配札、"
              "同位置の離席/再開ボタン、固定フォールドボタンはv1.3.98から維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "preflop_fixed_bb_only": True,
              "postflop_legacy_slider_entry_presets_restored": True,
              "postflop_controls_explicitly_preserved": True,
              "withdrawable_balance_included_in_cashier_depositable": True,
              "redeposit_withdrawable_first": True,
