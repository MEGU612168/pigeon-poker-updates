name: Verify Pigeon Poker 75-node preflop policy

on:
  push:
    paths:
      - "staging/preflop_screenshot_ranges_75.py"
      - "staging/test_preflop_ranges_75.py"
      - ".github/workflows/verify-preflop-75.yml"
  pull_request:
    paths:
      - "staging/preflop_screenshot_ranges_75.py"
      - "staging/test_preflop_ranges_75.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test every node, all 12,675 rows, and positive action choices
        run: python staging/test_preflop_ranges_75.py
