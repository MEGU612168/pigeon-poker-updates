name: Release Pigeon Poker v1.3.96 faster deal and sit-out resume

on:
  push:
    paths:
      - "releases/v1.3.96/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify preserved mechanical preflop strategy
        shell: bash
        run: |
          set -euo pipefail
          python staging/test_preflop_ranges_75.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("staging/preflop_screenshot_ranges_75.py").read_text(encoding="utf-8")
          ast.parse(source, filename="preflop_screenshot_ranges_75.py")
          if "DEVIATION_BY_LEVEL" in source:
              raise SystemExit("Unexpected CPU-level preflop deviation.")
          if "Execute only the supplied screenshot chart" not in source:
              raise SystemExit("Mechanical chart-only preflop policy missing.")
          print("Existing preflop policy syntax and tests: PASS")
          PY

      - name: Build Stable v1.3.96 from the exact v1.3.95 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import subprocess
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.95"
          TARGET_VERSION = "1.3.96"
          SOURCE_SHA256 = "931f5d2a7ae6065a93ae15d1d579a405d8b14fb1ebae29cc0cfa0f2f5e8499b5"
          SOURCE_SIZE = 265842
          source_url = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )
          request = urllib.request.Request(
              source_url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              encoded = response.read().decode("ascii").strip()
          source_payload = base64.b64decode(encoded, validate=True)
          if len(source_payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.95 payload size mismatch.")
          if hashlib.sha256(source_payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.95 payload SHA-256 mismatch.")

          expected_files = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(source_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("v1.3.95 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.95 package contents.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned v1.3.95 version marker mismatch.")

          main = files["PigeonPoker.pyw"].decode("utf-8")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              return source.replace(old, new, 1)

          # The existing callbacks divide these delays by two. Moving the
          # divisors to four halves the real elapsed time for the initial deal.
          for old, new, label in (
              ("DEAL_FIRST_DELAY_MS // 2", "DEAL_FIRST_DELAY_MS // 4", "initial deal start"),
              ("DEAL_FLIGHT_FRAME_MS // 2", "DEAL_FLIGHT_FRAME_MS // 4", "card flight speed"),
              ("DEAL_BETWEEN_CARDS_MS // 2", "DEAL_BETWEEN_CARDS_MS // 4", "gap between cards"),
          ):
              main = replace_once(main, old, new, label)
          main = replace_once(
              main,
              "HOLE_REVEAL_PAUSE_MS, lambda",
              "max(1, HOLE_REVEAL_PAUSE_MS // 2), lambda",
              "initial hole-card reveal pause",
          )

          # Add a prominent Resume control to the always-visible table header.
          lobby_line = (
              '        self._compact_action_button(header, "LOBBY", '
              'lambda: (self.deiconify(), self.lift()), "normal").pack(side="right", padx=3)\n'
          )
          resume_header = (
              '        resume_header_button = self._compact_action_button(\n'
              '            header, "再開",\n'
              '            lambda tid=table_id: self._resume_cash_table(tid), "accent")\n'
              '        resume_header_button.pack_forget()\n'
          )
          main = replace_once(main, lobby_line, resume_header + lobby_line, "header Resume button")
          main = replace_once(
              main,
              '"quick_leave_button": quick_leave_button, "sitout_button": sitout_button,',
              '"quick_leave_button": quick_leave_button, "sitout_button": sitout_button,\n'
              '            "resume_header_button": resume_header_button,',
              "table-window Resume button registration",
          )

          # Synchronize both Resume controls before any action-signature fast path
          # can continue early. This prevents the UI from retaining a stale label.
          event_line = '            record["event"].set(str(state.get("cash_action_feed", "")))\n'
          sync_block = (
              '            try:\n'
              '                if bool(state.get("cash_sitting_out", False)):\n'
              '                    record["resume_header_button"].pack(side="right", padx=3)\n'
              '                    record["sitout_button"].configure(\n'
              '                        text="再開", command=lambda tid=slot.table_id: self._resume_cash_table(tid),\n'
              '                        state="normal")\n'
              '                else:\n'
              '                    record["resume_header_button"].pack_forget()\n'
              '                    if bool(state.get("cash_sitout_pending", False)):\n'
              '                        record["sitout_button"].configure(\n'
              '                            text="離席予約中", command=lambda tid=slot.table_id: self._cancel_table_sitout(tid),\n'
              '                            state="normal")\n'
              '                    else:\n'
              '                        record["sitout_button"].configure(\n'
              '                            text="一時離席", command=lambda tid=slot.table_id: self._request_table_sitout(tid),\n'
              '                            state="normal")\n'
              '            except (KeyError, tk.TclError):\n'
              '                pass\n'
          )
          main = replace_once(main, event_line, event_line + sync_block, "always-synced sit-out controls")

          # Confirm the callback continues to clear the pause and start the next hand.
          resume_start = main.index("def _resume_cash_table(")
          resume_end = main.index("def _retry_queued_table_resume(", resume_start)
          resume_method = main[resume_start:resume_end]
          for required in (
              'state["cash_sitting_out"] = False',
              'self._start_cash_hand(first=table.hand is None)',
          ):
              if required not in resume_method:
                  raise SystemExit("Resume handler lost required state transition: " + required)

          if main.count("DEAL_FIRST_DELAY_MS // 4") != 1:
              raise SystemExit("Initial deal start was not halved.")
          if main.count("DEAL_FLIGHT_FRAME_MS // 4") != 1:
              raise SystemExit("Card flight duration was not halved.")
          if main.count("DEAL_BETWEEN_CARDS_MS // 4") != 1:
              raise SystemExit("Between-card delay was not halved.")
          if "max(1, HOLE_REVEAL_PAUSE_MS // 2)" not in main:
              raise SystemExit("Initial hole reveal pause was not halved.")
          if "resume_header_button = self._compact_action_button" not in main:
              raise SystemExit("Visible header Resume control missing.")
          if '"resume_header_button": resume_header_button' not in main:
              raise SystemExit("Header Resume control is not registered.")
          if main.index('record["resume_header_button"].pack(side="right"') > main.index("rebuild_actions ="):
              raise SystemExit("Resume control synchronization occurs too late.")
          ast.parse(main, filename="PigeonPoker.pyw")
          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")

          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final package ZIP CRC failure: " + bad)
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final package file set mismatch.")
              packaged_main = archive.read("PigeonPoker.pyw").decode("utf-8")
              ast.parse(packaged_main, filename="PigeonPoker.pyw")
              if "Preflop chart coverage missing" not in packaged_main:
                  raise SystemExit("v1.3.95 strict chart-only preflop runtime was lost.")
              if "resume_header_button" not in packaged_main:
                  raise SystemExit("Visible Resume button missing from final package.")

          digest = hashlib.sha256(final_payload).hexdigest()
          final_encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(final_encoded, encoding="ascii")
          chunks = []
          for index, offset in enumerate(range(0, len(final_encoded), 48000)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(final_encoded[offset:offset + 48000], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "最初のホールカード配札を従来の約50%の時間に短縮（初回待機、カード飛行、カード間隔、"
              "ホールカード公開前の待機を短縮）。一時離席中はテーブル上部に常時見える「再開」ボタンを追加し、"
              "下部の一時離席ボタンも「再開」に切り替え。画面更新の早期終了経路より前に離席状態と両ボタンを同期。"
              "再開すると保持中のテーブル・スタックから次のハンドを開始。プリフロップは全CPU共通の機械的75局面チャート、"
              "CPUレベル差はポストフロップのみのv1.3.95仕様を維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "initial_hole_card_deal_duration_multiplier": 0.5,
              "deal_timing_changes": [
                  "initial_delay",
                  "card_flight",
                  "between_cards",
                  "initial_reveal_pause"
              ],
              "sitout_resume_header_button": True,
              "sitout_resume_control_sync_before_ui_early_exit": True,
              "preflop_mechanical_all_cpu_levels": True,
              "cpu_level_differences_apply_to": ["postflop"],
              "gto_plus_engine_removed_from_runtime": True,
              "package_ast_and_zip_crc": "passed",
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          pathlib.Path("dist").mkdir(exist_ok=True)
          artifact = pathlib.Path("dist") / f"PigeonPoker_{TARGET_VERSION}.zip"
          artifact.write_bytes(final_payload)
          with zipfile.ZipFile(artifact, "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Installable ZIP validation failed.")
          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+users.noreply.github.com"], check=True
          )
          subprocess.run(["git", "add", "stable.json", str(release_dir)], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.96 faster deal and sit-out resume"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "sha256": digest,
              "size": len(final_payload),
              "deal_duration_multiplier": 0.5,
              "visible_resume_button": True,
              "resume_sync_before_early_exit": True,
              "mechanical_preflop_preserved": True,
          }, ensure_ascii=False, indent=2))
          PY
