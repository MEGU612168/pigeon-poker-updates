name: Release Pigeon Poker v1.3.82 fit complete GTO+ content and restore update checks

on:
  push:
    paths:
      - "releases/v1.3.82/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from the verified v1.3.81 stable package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.81"
          TARGET_VERSION = "1.3.82"
          SOURCE_SHA256 = "8e5204aee683ecdd70c1b69af8c9ab7b02c70112d11f8b76e87e03a6000672f9"
          SOURCE_SIZE = 222891
          SOURCE_URL = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )

          with urllib.request.urlopen(SOURCE_URL, timeout=90) as response:
              encoded_source = response.read().decode("ascii").strip()
          source_payload = base64.b64decode(encoded_source, validate=True)
          if len(source_payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.81 package size mismatch.")
          if hashlib.sha256(source_payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.81 package SHA-256 mismatch.")

          EXPECTED_FILES = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(source_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Pinned v1.3.81 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != EXPECTED_FILES:
              raise SystemExit("Unexpected v1.3.81 package file set.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned v1.3.81 version marker mismatch.")

          # Preserve the established v1.3.69 range datasets byte-for-byte.
          range_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected_blob in range_blobs.items():
              data = files[name]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise SystemExit("v1.3.69 range baseline changed: " + name)

          main = files["PigeonPoker.pyw"].decode("utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, got {count}.")
              return source.replace(old, new, 1)

          def replace_method(source: str, signature: str, replacement: str, label: str) -> str:
              if source.count(signature) != 1:
                  raise SystemExit(label + ": method signature is not unique.")
              start = source.find(signature)
              end = source.find("\n    def ", start + len(signature))
              if start < 0 or end < 0:
                  raise SystemExit(label + ": could not find next method boundary.")
              if not replacement.startswith(signature):
                  raise SystemExit(label + ": replacement signature mismatch.")
              return source[:start] + replacement.rstrip() + "\n" + source[end + 1:]

          # Confirm v1.3.81 permission-recovery and process-handoff code exists.
          base_required = (
              "def _restart_pigeon_elevated_for_gto(self, process_id: int):",
              "if isinstance(exc, WindowPermissionError):",
              "self._gto_handoff_in_progress = True",
              "app._gto_auto_start_started = True",
              "self.after(1800, self._auto_connect_gto_plus)",
              "def _auto_start_gto_plus(self):",
          )
          for marker in base_required:
              if marker not in main:
                  raise SystemExit("Missing v1.3.81 GTO+ lifecycle behavior: " + marker)

          # Make a real inner viewport. The solver window is sized to the
          # viewport using the complete GTO+ content aspect ratio, not the
          # screenshot's pixel dimensions. The outer Pigeon panels remain.
          old_host_block = (
              '        self.gto_host = tk.Frame(host_col, bg="#080f18", height=570)\n'
              '        self.gto_host.pack(fill="both", expand=True, padx=8, pady=8)\n'
              '        self.gto_host.bind("<Configure>", self._resize_embedded)\n'
          )
          new_host_block = (
              '        self.gto_viewport = tk.Frame(host_col, bg="#080f18")\n'
              '        self.gto_viewport.pack(fill="both", expand=True, padx=8, pady=8)\n'
              '        self.gto_host = tk.Frame(\n'
              '            self.gto_viewport, bg="#080f18", width=1320, height=676,\n'
              '        )\n'
              '        self.gto_host.place(\n'
              '            relx=0.5, rely=0.5, anchor="center", width=1320, height=676,\n'
              '        )\n'
              '        self.gto_viewport.bind("<Configure>", self._resize_embedded)\n'
          )
          main = replace_once(main, old_host_block, new_host_block, "GTO+ inner viewport")

          # Fit the GTO+ child itself into the available host. The 1320:676
          # ratio describes the full GTO+ interface composition; it is not a
          # target monitor/window resolution. No clipping, panel hiding, or
          # fixed-pixel screenshot sizing is used. Scale may exceed 100%.
          old_sync_signature = "    def _sync_embedded_gto_geometry(self, reason: str = \"\") -> bool:\n"
          sync_replacement = """    def _layout_embedded_gto_host(self) -> bool:
                  \"\"\"Fit the complete GTO+ interface inside the live Pigeon viewport.

                  The reference dimensions encode the full interface's content
                  proportions only. The solver child is scaled to the actual
                  available viewport and remains centered without being clipped.
                  \"\"\"
                  try:
                      self.update_idletasks()
                      viewport_width = int(self.gto_viewport.winfo_width())
                      viewport_height = int(self.gto_viewport.winfo_height())
                      if viewport_width < 2 or viewport_height < 2:
                          return False

                      content_width = 1320.0
                      content_height = 676.0
                      scale = min(
                          viewport_width / content_width,
                          viewport_height / content_height,
                      )
                      if scale <= 0:
                          return False

                      # Floor dimensions so rounding can never exceed the
                      # viewport by a pixel and cause an edge to be cut off.
                      target_width = max(
                          2, min(viewport_width, int(content_width * scale))
                      )
                      target_height = max(
                          2, min(viewport_height, int(content_height * scale))
                      )
                      self.gto_host.place_configure(
                          width=target_width, height=target_height,
                      )
                      self._gto_display_scale = scale
                      self._gto_content_scale_percent = int(round(scale * 100))
                      return True
                  except (tk.TclError, ZeroDivisionError, ValueError):
                      return False

              def _sync_embedded_gto_geometry(self, reason: str = "") -> bool:
                  \"\"\"Resize the docked GTO+ child to the fitted inner viewport.\"\"\"
                  if not self.gto_embedded or not getattr(self.integration, "embedder", None):
                      return False
                  try:
                      self.update_idletasks()
                      if not self._layout_embedded_gto_host():
                          raise RuntimeError("GTO+ viewport has no usable client area")
                      self.update_idletasks()
                      host_width = int(self.gto_host.winfo_width())
                      host_height = int(self.gto_host.winfo_height())
                      if host_width < 2 or host_height < 2:
                          raise RuntimeError(
                              f"invalid fitted GTO+ host geometry: {host_width}x{host_height}"
                          )
                      self.integration.resize_docked_window(host_width, host_height)
                      self.update_idletasks()
                      return True
                  except Exception as exc:
                      try:
                          suffix = f" ({reason})" if reason else ""
                          self.status_var.set(
                              f"GTO+表示位置・サイズの再同期に失敗{suffix}: {exc}"
                          )
                      except Exception:
                          pass
                      return False
          """
          main = replace_method(
              main, old_sync_signature, sync_replacement, "GTO+ content-fit geometry"
          )

          schedule_signature = "    def _schedule_embedded_gto_geometry_sync(self, reason: str) -> None:\n"
          schedule_replacement = """    def _schedule_embedded_gto_geometry_sync(self, reason: str) -> None:
                  \"\"\"Fit and resync after the solver processes its native WM_SIZE.\"\"\"
                  if not self.gto_embedded:
                      return
                  self._sync_embedded_gto_geometry(reason)
                  try:
                      self.after_idle(
                          lambda r=reason: self._sync_embedded_gto_geometry(r + "-idle")
                      )
                      self.after(
                          250,
                          lambda r=reason: self._sync_embedded_gto_geometry(r + "-settled")
                      )
                      self.after(
                          900,
                          lambda r=reason: self._sync_embedded_gto_geometry(
                              r + "-native-zoom-settled"
                          )
                      )
                  except tk.TclError:
                      pass
          """
          main = replace_method(
              main, schedule_signature, schedule_replacement, "GTO+ delayed geometry sync"
          )

          resize_signature = "    def _resize_embedded(self, _event=None):\n"
          resize_replacement = """    def _resize_embedded(self, _event=None):
                  self._sync_embedded_gto_geometry("viewport-configure")
          """
          main = replace_method(
              main, resize_signature, resize_replacement, "GTO+ viewport resize callback"
          )

          # A current-version check must not disable the button. It becomes an
          # explicit CHECK AGAIN action. The same behavior applies after a
          # manual update check discovers there is no newer package.
          latest_state = (
              'self.update_button.configure(state="disabled", '
              'style="MutedUpdate.TButton", text="UP TO DATE")'
          )
          if main.count(latest_state) != 2:
              raise SystemExit(
                  "Expected exactly two 'UP TO DATE' disabled states; found "
                  + str(main.count(latest_state))
              )
          check_again_state = (
              'self.update_button.configure(state="normal", '
              'style="Accent.TButton", text="CHECK AGAIN", '
              'command=self._refresh_update_button_state)'
          )
          main = main.replace(latest_state, check_again_state)

          # Add a recurring check without starting overlapping network calls.
          startup_check = "        self.after(1200, self._refresh_update_button_state)\n"
          if main.count(startup_check) != 1:
              raise SystemExit("Could not uniquely locate startup update check.")
          main = main.replace(
              startup_check,
              startup_check + "        self.after(30 * 60 * 1000, self._periodic_update_check)\n",
              1,
          )
          periodic_method = """    def _periodic_update_check(self):
                  \"\"\"Recheck the stable channel every 30 minutes while Pigeon is open.\"\"\"
                  try:
                      if not getattr(self, "_update_check_active", False) and not getattr(
                          self, "_update_in_progress", False
                      ):
                          self._refresh_update_button_state()
                  finally:
                      try:
                          self.after(30 * 60 * 1000, self._periodic_update_check)
                      except tk.TclError:
                          pass

          """
          update_signature = "    def _refresh_update_button_state(self):\n"
          if main.count(update_signature) != 1:
              raise SystemExit("Update checker method is not unique.")
          main = main.replace(update_signature, periodic_method + update_signature, 1)

          # The button is initially disabled only while its first asynchronous
          # check is genuinely in flight. Retry CHECK and CHECK AGAIN remain
          # enabled after completion.
          required_main = (
              "self.gto_viewport = tk.Frame(host_col, bg=\"#080f18\")",
              "self.gto_host.place(",
              "def _layout_embedded_gto_host(self) -> bool:",
              "content_width = 1320.0",
              "content_height = 676.0",
              "scale = min(",
              "self.gto_host.place_configure(",
              "self.integration.resize_docked_window(host_width, host_height)",
              "native-zoom-settled",
              "text=\"CHECK AGAIN\"",
              "command=self._refresh_update_button_state",
              "def _periodic_update_check(self):",
              "self.after(30 * 60 * 1000, self._periodic_update_check)",
              "self.after(1200, self._auto_start_gto_plus)",
              "self._restart_pigeon_elevated_for_gto(int(process.pid))",
              "def _auto_connect_gto_plus(self, attempt: int = 0):",
          )
          for marker in required_main:
              if marker not in main:
                  raise SystemExit("Missing v1.3.82 requirement: " + marker)
          if 'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=320)' not in main:
              raise SystemExit("GTO+ right-side Pigeon control column changed unexpectedly.")
          if "controls_canvas" not in main:
              raise SystemExit("GTO+ control panel scrolling was removed.")
          if "state=\"disabled\", style=\"MutedUpdate.TButton\", text=\"UP TO DATE\"" in main:
              raise SystemExit("A disabled UP TO DATE state remains.")
          if main.count("    def _periodic_update_check(self):") != 1:
              raise SystemExit("Periodic update checker was duplicated.")
          if main.count("    def _layout_embedded_gto_host(self) -> bool:") != 1:
              raise SystemExit("GTO+ content-fit layout method is duplicated.")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + chr(10)).encode("ascii")

          # Syntax-check all shipped Python sources.
          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          # Geometry tests: every full-interface frame stays inside the
          # available viewport, including compact and enlarged workspaces.
          def fit(width: int, height: int):
              scale = min(width / 1320.0, height / 676.0)
              target_width = max(2, min(width, int(1320.0 * scale)))
              target_height = max(2, min(height, int(676.0 * scale)))
              return scale, target_width, target_height

          for vw, vh in ((856, 548), (714, 548), (1320, 676), (1648, 788), (1920, 1000)):
              scale, fitted_width, fitted_height = fit(vw, vh)
              if not (2 <= fitted_width <= vw and 2 <= fitted_height <= vh and scale > 0):
                  raise SystemExit(
                      f"GTO+ viewport fit test failed for {vw}x{vh}: "
                      f"{scale}, {fitted_width}x{fitted_height}"
                  )
              if abs(fitted_width / fitted_height - 1320 / 676) > 0.006:
                  raise SystemExit(
                      f"GTO+ content ratio changed for {vw}x{vh}: "
                      f"{fitted_width}x{fitted_height}"
                  )
          if fit(1920, 1000)[0] <= 1.0:
              raise SystemExit("GTO+ viewport cannot scale above the reference size.")

          # Build the full app update archive.
          output = io.BytesIO()
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final v1.3.82 ZIP CRC validation failed: " + bad)
              if set(archive.namelist()) != EXPECTED_FILES:
                  raise SystemExit("Final v1.3.82 package file list changed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != TARGET_VERSION:
                  raise SystemExit("Final v1.3.82 version marker mismatch.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded_final = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(
              encoded_final, encoding="ascii"
          )
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded_final), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(
                  encoded_final[offset:offset + chunk_size], encoding="ascii"
              )
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + chr(10), encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "GTO+の全表示内容をPigeon側の実際の表示領域に収めるコンテンツフィットを実装。"
              "GTO+の内容比率1320:676に合わせて内側のGTO+ HWNDのみを拡大・縮小し、"
              "領域内中央に配置。Pigeonの右側操作パネル・スクロール・既存機能は維持。"
              "更新確認は起動時と30分ごとに自動実行。最新版でもCHECK AGAINを有効にし、"
              "更新確認ボタンが押せない状態を解消。"
              "v1.3.81のGTO+権限復旧・PID引継ぎ・自動起動/接続とv1.3.69のレンジ本体を維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "gto_content_aspect_ratio": [1320, 676],
              "gto_fit_uses_live_viewport": True,
              "gto_fit_can_scale_above_100_percent": True,
              "all_gto_panels_preserved": True,
              "update_check_on_startup": True,
              "update_check_interval_minutes": 30,
              "up_to_date_button_remains_enabled": True,
              "range_baseline": "1.3.69",
              "gto_permission_recovery": "preserved from v1.3.81",
              "automatic_gto_lifecycle": True,
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )
          (release_dir / "payload.ready").write_text(
              "verified " + TARGET_VERSION + chr(10), encoding="ascii"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )

          # Also expose the decoded application ZIP as a workflow artifact for
          # direct download; the stable updater package uses Base64 transport.
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          artifact_path = dist / f"PigeonPoker_{TARGET_VERSION}_Improved.zip"
          artifact_path.write_bytes(final_payload)
          with zipfile.ZipFile(artifact_path, "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Download artifact ZIP CRC validation failed.")

          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "published_version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "gto_content_aspect_ratio": [1320, 676],
              "gto_fit_samples": {
                  "856x548": fit(856, 548),
                  "714x548": fit(714, 548),
                  "1648x788": fit(1648, 788),
                  "1920x1000": fit(1920, 1000),
              },
              "startup_and_30_minute_update_checks": True,
              "check_again_button_enabled": True,
              "range_baseline_preserved": True,
          }, ensure_ascii=False))
          PY

      - name: Upload the ready-to-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PigeonPoker_1.3.82_Improved
          path: dist/PigeonPoker_1.3.82_Improved.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable v1.3.82 manifest and payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.82/
          git commit -m "Release Pigeon Poker v1.3.82 full GTO+ fit and auto update checks"
          git push
