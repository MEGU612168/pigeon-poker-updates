name: Release Pigeon Poker v1.3.81 restore GTO+ permission recovery

on:
  push:
    paths:
      - "releases/v1.3.81/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the v1.3.69 docking recovery while keeping v1.3.80 layout and auto lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile

          repo = "MEGU612168/pigeon-poker-updates"
          source_version = "1.3.80"
          target_version = "1.3.81"
          source_sha256 = "4169f6a90d6eb916cca848dfffa396cfc978a94bf94a67a4632fcf8f9222a47a"
          source_size = 222074
          source_url = (
              f"https://raw.githubusercontent.com/{repo}/main/releases/v{source_version}/"
              f"payload-updater.zip.b64?v={source_sha256}"
          )
          with urllib.request.urlopen(source_url, timeout=90) as response:
              encoded = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != source_size:
              raise SystemExit("Pinned v1.3.80 package size mismatch.")
          if hashlib.sha256(payload).hexdigest() != source_sha256:
              raise SystemExit("Pinned v1.3.80 package SHA-256 mismatch.")

          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Pinned v1.3.80 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.80 package file set.")
          if files["VERSION.txt"].decode("ascii").strip() != source_version:
              raise SystemExit("Pinned source version marker mismatch.")

          range_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected_blob in range_blobs.items():
              data = files[name]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise SystemExit("v1.3.69 range source changed: " + name)

          main = files["PigeonPoker.pyw"].decode("utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, got {count}.")
              return source.replace(old, new, 1)

          def replace_method(source: str, signature: str, lines: list[str], label: str) -> str:
              if source.count(signature) != 1:
                  raise SystemExit(label + ": method signature is not unique.")
              start = source.find(signature)
              end = source.find("\n    def ", start + len(signature))
              if start < 0 or end < 0:
                  raise SystemExit(label + ": could not find the next method boundary.")
              replacement = "\n".join(lines).rstrip()
              if not replacement.startswith(signature):
                  raise SystemExit(label + ": replacement signature mismatch.")
              return source[:start] + replacement + "\n\n" + source[end + 1:]

          # Verify the integration exception type is already exported/imported.
          if "GTOPlusAutoAnalyzer, WindowPermissionError)" not in main:
              raise SystemExit("WindowPermissionError is not imported by the Pigeon app.")
          if "def _restart_pigeon_elevated_for_gto(" in main:
              raise SystemExit("Unexpected duplicate GTO elevation recovery helper.")

          # Preserve Pigeon-owned process handoff state.
          constructor_state = (
              "        self.gto_owned_process_pid: int | None = None\\n"
              "        self._gto_auto_start_started = False\\n"
              "        self._gto_auto_connect_busy = False\\n"
          )
          constructor_state_replacement = constructor_state + "        self._gto_handoff_in_progress = False\\n"
          main = replace_once(
              main, constructor_state, constructor_state_replacement,
              "GTO process handoff state",
          )

          launch_lines = [
              "    def _launch_gto(self, automatic: bool = False):",
              "        try:",
              "            self._save_connection_config()",
              "            self.update_idletasks()",
              "            host_hwnd = int(self.gto_host.winfo_id())",
              "            hwnd = self.integration.launch_and_dock(host_hwnd, startup_timeout=25)",
              "            process = getattr(self.integration, 'process', None)",
              "            if process is not None:",
              "                try:",
              "                    self.gto_owned_process_pid = int(process.pid)",
              "                except Exception:",
              "                    self.gto_owned_process_pid = None",
              "            self.gto_embedded = True",
              "            self.status_var.set(f'GTO+をPigeon内に表示中 (HWND {hwnd})')",
              "            self._schedule_embedded_gto_geometry_sync('launch')",
              "            if automatic:",
              "                self.after(1800, self._auto_connect_gto_plus)",
              "        except Exception as exc:",
              "            process = getattr(self.integration, 'process', None)",
              "            try:",
              "                still_running = process is not None and process.poll() is None",
              "            except Exception:",
              "                still_running = process is not None",
              "            if still_running:",
              "                try:",
              "                    self.gto_owned_process_pid = int(process.pid)",
              "                except Exception:",
              "                    pass",
              "                self.gto_embedded = False",
              "                if isinstance(exc, WindowPermissionError):",
              "                    # Match v1.3.69: preserve the already-running GTO+ PID,",
              "                    # elevate Pigeon, and reattach rather than launching a copy.",
              "                    self._restart_pigeon_elevated_for_gto(int(process.pid))",
              "                    return",
              "                self.status_var.set(",
              "                    f'GTO+は起動しましたが、Pigeon内表示に失敗: {type(exc).__name__}: {exc}'",
              "                )",
              "            else:",
              "                self.gto_embedded = False",
              "                self.status_var.set(f'GTO+自動起動失敗: {type(exc).__name__}: {exc}')",
              "",
          ]
          main = replace_method(
              main,
              "    def _launch_gto(self, automatic: bool = False):",
              launch_lines,
              "GTO+ launch and permission recovery",
          )

          helper_lines = [
              "    def _restart_pigeon_elevated_for_gto(self, process_id: int):",
              '        """Restart Pigeon at the GTO+ integrity level and transfer the live GTO+ PID.',
              "        The Windows UAC prompt is owned by Windows and cannot be silently bypassed.",
              '        """',
              "        if os.name != 'nt':",
              "            self.status_var.set('GTO+の権限レベルをそろえられません (Windows only)')",
              "            return",
              "        try:",
              "            script = str((ROOT / 'PigeonPoker.pyw').resolve())",
              "            parameters = subprocess.list2cmdline([script, '--dock-gto-pid', str(int(process_id))])",
              "            shell32 = ctypes.WinDLL('shell32', use_last_error=True)",
              "            shell32.ShellExecuteW.argtypes = [",
              "                ctypes.c_void_p, ctypes.c_wchar_p, ctypes.c_wchar_p,",
              "                ctypes.c_wchar_p, ctypes.c_wchar_p, ctypes.c_int,",
              "            ]",
              "            shell32.ShellExecuteW.restype = ctypes.c_void_p",
              "            result = shell32.ShellExecuteW(",
              "                None, 'runas', str(Path(sys.executable).resolve()), parameters,",
              "                str(ROOT), 1,",
              "            )",
              "            if int(result or 0) <= 32:",
              "                error = ctypes.get_last_error()",
              "                self._gto_handoff_in_progress = False",
              "                if int(result or 0) == 1223 or error == 1223:",
              "                    self.status_var.set('Windows UACで昇格がキャンセルされました。GTO+は別ウィンドウで起動中です。')",
              "                else:",
              "                    self.status_var.set(f'Pigeonの管理者再起動に失敗: {ctypes.FormatError(error or int(result or 5))}')",
              "                return",
              "            # Do not kill GTO+ when the old Pigeon closes; the new elevated",
              "            # Pigeon instance will dock this exact PID.",
              "            self._gto_handoff_in_progress = True",
              "            self.status_var.set('Windowsの確認後、Pigeon内へGTO+を再接続します…')",
              "            self.after(500, self._on_close)",
              "        except Exception as exc:",
              "            self._gto_handoff_in_progress = False",
              "            self.status_var.set(f'Pigeonの権限再起動に失敗: {type(exc).__name__}: {exc}')",
              "",
          ]
          attach_signature = "    def _attach_existing_gto(self, process_id: int):"
          if main.count(attach_signature) != 1:
              raise SystemExit("GTO+ attach method signature is not unique.")
          attach_start = main.find(attach_signature)
          main = main[:attach_start] + "\n".join(helper_lines) + "\n\n" + main[attach_start:]

          attach_lines = [
              "    def _attach_existing_gto(self, process_id: int, attempt: int = 0):",
              "        if attempt >= 30:",
              "            self.status_var.set('既存GTO+のPigeon内再接続に失敗しました。')",
              "            return",
              "        try:",
              "            self.update_idletasks()",
              "            if (not self.gto_host.winfo_ismapped()",
              "                    or self.gto_host.winfo_width() < 250",
              "                    or self.gto_host.winfo_height() < 180):",
              "                self.after(250, lambda pid=process_id, n=attempt + 1: self._attach_existing_gto(pid, n))",
              "                return",
              "            hwnd = self.integration.attach_existing_and_dock(",
              "                int(process_id), int(self.gto_host.winfo_id()), startup_timeout=15,",
              "            )",
              "            self.gto_owned_process_pid = int(process_id)",
              "            self.gto_embedded = True",
              "            self.status_var.set(f'GTO+をPigeon内に再接続 (HWND {hwnd})')",
              "            self._schedule_embedded_gto_geometry_sync('attach')",
              "            self.after(1800, self._auto_connect_gto_plus)",
              "        except Exception as exc:",
              "            self.gto_embedded = False",
              "            self.gto_owned_process_pid = int(process_id)",
              "            self.status_var.set(f'既存GTO+の再ドッキングに失敗: {type(exc).__name__}: {exc}')",
              "",
          ]
          main = replace_method(
              main,
              attach_signature,
              attach_lines,
              "existing GTO+ attach and reconnect",
          )

          # Skip normal new-instance autostart when the elevated restart is
          # explicitly asked to attach to an already-running process.
          main = replace_once(
              main,
              "    app = PigeonPokerApp()\n"
              "    if dock_pid is not None and dock_pid > 0:\n"
              "        app.after(900, lambda pid=dock_pid: app._attach_existing_gto(pid))",
              "    app = PigeonPokerApp()\n"
              "    if dock_pid is not None and dock_pid > 0:\n"
              "        app._gto_auto_start_started = True\n"
              "        app.after(900, lambda pid=dock_pid: app._attach_existing_gto(pid))",
              "elevated restart must attach existing PID instead of starting another GTO+",
          )

          # Transfer ownership: the old Pigeon must not terminate the process
          # before the new elevated Pigeon has attached to it.
          main = replace_once(
              main,
              '        if owned_pid > 0 and os.name == "nt":',
              '        if owned_pid > 0 and os.name == "nt" and not self._gto_handoff_in_progress:',
              "do not terminate GTO+ during elevation handoff",
          )

          # Structural assertions: the exact v1.3.69 recovery is present but
          # the Pigeon app no longer asks the user a second yes/no question.
          required = (
              "def _restart_pigeon_elevated_for_gto(self, process_id: int):",
              "if isinstance(exc, WindowPermissionError):",
              "self._restart_pigeon_elevated_for_gto(int(process.pid))",
              "shell32.ShellExecuteW(",
              "None, 'runas', str(Path(sys.executable).resolve()), parameters,",
              "self._gto_handoff_in_progress = True",
              "and not self._gto_handoff_in_progress",
              "app._gto_auto_start_started = True",
              "self.gto_owned_process_pid = int(process_id)",
              "self.after(1800, self._auto_connect_gto_plus)",
              'self.after(1200, self._auto_start_gto_plus)',
              'self.after(1200, self._refresh_update_button_state)',
              'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=320)',
              "width=302, yscrollincrement=24,",
              'text="UP TO DATE"',
              'state="disabled", style="MutedUpdate.TButton"',
          )
          for marker in required:
              if marker not in main:
                  raise SystemExit("Missing v1.3.81 behavior: " + marker)
          if "messagebox.askyesno(" in main[main.find("    def _launch_gto("):main.find("    def _attach_existing_gto(")]:
              raise SystemExit("Pigeon-level GTO permission confirmation remains.")
          if main.count("    def _restart_pigeon_elevated_for_gto(self, process_id: int):") != 1:
              raise SystemExit("GTO elevation recovery helper is missing or duplicated.")
          if main.count("    def _auto_start_gto_plus(self):") != 1:
              raise SystemExit("Automatic GTO+ startup method is missing or duplicated.")
          if main.count("    def _auto_connect_gto_plus(self, attempt: int = 0):") != 1:
              raise SystemExit("Automatic GTO+ connect method is missing or duplicated.")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (target_version + chr(10)).encode("ascii")
          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final v1.3.81 ZIP CRC validation failed.")
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final v1.3.81 package file set changed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != target_version:
                  raise SystemExit("Final v1.3.81 package version marker mismatch.")
              packaged_main = archive.read("PigeonPoker.pyw").decode("utf-8")
              for marker in required:
                  if marker not in packaged_main:
                      raise SystemExit("Final ZIP lost required GTO recovery behavior: " + marker)
              ast.parse(packaged_main, filename="PigeonPoker.pyw")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded_final = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + target_version)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded_final, encoding="ascii")
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded_final), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(encoded_final[offset:offset + chunk_size], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + chr(10), encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "v1.3.80の69ベースWORKSPACE・右320px/Canvas302px・自動起動・自動接続・終了管理を維持。"
              "1.3.69に存在したWindowPermissionError時の復旧を復元。GTO+が昇格済みでWindowsがSetParentを拒否した場合、"
              "Pigeon側のYes/No確認を出さず、既存GTO+ PIDを保持してPigeonをrunas再起動し、同じPIDへ再ドッキング。"
              "Windows UAC確認はOSの仕様により表示され得る。昇格引き継ぎ中は旧PigeonがGTO+ PIDを終了しない。"
              "--dock-gto-pid起動時は通常自動起動を抑止し、既存GTO+だけに接続するため二重起動を防止。"
              "再接続後はソケットへの自動接続を再試行。更新後の通常再起動でも自動起動を維持。"
              "v1.3.69のプリフロップ/HUレンジ本体とv1.3.80のワークスペース配置を維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": source_version,
              "workspace_baseline": "1.3.69",
              "gto_permission_recovery": "restored from 1.3.69",
              "automatic_elevation_handoff": True,
              "uac_may_be_required": True,
              "existing_pid_reattach": True,
              "duplicate_autostart_prevented": True,
              "automatic_connect_after_reattach": True,
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          (release_dir / "payload.ready").write_text(
              "verified " + target_version + chr(10), encoding="ascii"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{repo}/main/releases/v{target_version}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "published_version": target_version,
              "base_version": source_version,
              "permission_recovery": "v1.3.69 fallback restored",
              "Pigeon_yes_no_prompt": False,
              "Windows_UAC_may_appear": True,
              "existing_GTO_PID_transferred": True,
              "duplicate_launch_prevented": True,
              "auto_connect_after_reattach": True,
              "workspace_right_column": 320,
              "workspace_control_canvas": 302,
              "range_sources": "unchanged from v1.3.69 baseline",
              "payload_size": len(final_payload),
              "payload_sha256": digest,
          }, ensure_ascii=False))
          PY
      - name: Publish verified v1.3.81 full package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.81/
          git commit -m "Release Pigeon Poker v1.3.81 restore GTO+ permission recovery"
          git push
