                  w,h=665,570
                  px=bytearray(bytes((255,255,255,0))*(w*h))
                  if dark:
                      for y in range(236,241):
                          for x in range(40,68):
                              i=(y*w+x)*4
                              px[i:i+4]=bytes((15,15,15,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              white_board_bmp(pathlib.Path(td)/"board_blank.bmp",False)
              white_board_bmp(pathlib.Path(td)/"board_text.bmp",True)
              assert _bmp_region_dark_pixel_ratio(pathlib.Path(td)/"board_blank.bmp",(26,233,83,245)) == 0.0
              assert _bmp_region_dark_pixel_ratio(pathlib.Path(td)/"board_text.bmp",(26,233,83,245)) > 0.01
              assert _bmp_region_difference_ratio(pathlib.Path(td)/"base.bmp",pathlib.Path(td)/"same.bmp")["ratio"]==0.0
              assert _bmp_region_difference_ratio(pathlib.Path(td)/"base.bmp",pathlib.Path(td)/"overlay.bmp")["ratio"]>0.05
              def tooltip_bmp(path, rect):
                  w,h=665,570
                  px=bytearray(w*h*4)
                  x0,y0,x1,y1=rect
                  for y in range(y0,y1):
                      for x in range(x0,x1):
                          i=(y*w+x)*4
                          px[i:i+4]=bytes((0x20,0x90,0xE0,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              tooltip_bmp(pathlib.Path(td)/"tooltip_oop.bmp",(106,96,228,126))
              tooltip_bmp(pathlib.Path(td)/"tooltip_ip.bmp",(106,174,228,198))
              assert _bmp_region_difference_ratio(
                  pathlib.Path(td)/"tooltip_oop.bmp",
                  pathlib.Path(td)/"tooltip_ip.bmp",
                  _RANGE_EDITOR_VERIFY_ROI
              )["ratio"] == 0.0
              assert _bmp_region_difference_ratio(
                  pathlib.Path(td)/"base.bmp",
                  pathlib.Path(td)/"overlay.bmp",
                  _RANGE_EDITOR_VERIFY_ROI
              )["ratio"] > 0.05
              def matrix_bmp(path, active_cells=()):
                  w,h=665,570
                  px=bytearray(w*h*4)
                  # AA is a filled green cell; AKs=40% is a narrow blue marker
                  # at the inner-left pixel (32,90), not at the old center (33,91).
                  for x,y,bgr in active_cells:
                      i=(y*w+x)*4
                      px[i:i+4]=bytes((*bgr,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              matrix_bmp(pathlib.Path(td)/"matrix_empty.bmp",())
              matrix_bmp(pathlib.Path(td)/"matrix_aa.bmp",((29,91,(50,160,0)),))
              matrix_bmp(pathlib.Path(td)/"matrix_aa_aks.bmp",((29,91,(50,160,0)),(32,90,(198,122,22))))
              empty_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"matrix_empty.bmp")
              aa_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"matrix_aa.bmp")
              aa_aks_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"matrix_aa_aks.bmp")
              assert _OOP_MATRIX_RECT == (27,89,79,141)
              assert empty_sig["roi"] == [27,89,79,141]
              assert _matrix_signature_is_empty(empty_sig)
              assert _matrix_signature_is_aa_only(aa_sig,empty_sig)
              assert _matrix_signature_matches_selected_cells(aa_aks_sig,empty_sig,[0,1])
              assert not _matrix_signature_matches_selected_cells(aa_sig,empty_sig,[0,1])
              # A 40% AKs marker at x=32 is detected even though old center x=33 is black.
              assert aa_aks_sig["samples"][1] != empty_sig["samples"][1]
              assert aa_aks_sig["sampling"] == "2x2_inner_patch_channel_max"
              def ip_matrix_bmp(path, active_cells=()):
                  w,h=665,570
                  px=bytearray(bytes((80,80,80,0))*(w*h))
                  # Real IP inner sampling patches start at (28,161), then step 4px.
                  # Empty cells are black; active cells carry the GTO+ green/blue markers.
                  colors={index:bgr for index,bgr in active_cells}
                  for row in range(13):
                      for col in range(13):
                          index=row*13+col
                          bgr=colors.get(index,(0,0,0))
                          for dy in range(2):
                              for dx in range(2):
                                  x=28+4*col+dx
                                  y=161+4*row+dy
                                  offset=(y*w+x)*4
                                  px[offset:offset+4]=bytes((*bgr,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              ip_matrix_bmp(pathlib.Path(td)/"ip_matrix_empty.bmp",())
              ip_matrix_bmp(pathlib.Path(td)/"ip_matrix_aa_aks.bmp",((0,(50,160,0)),(1,(198,122,22))))
              ip_empty_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"ip_matrix_empty.bmp",_IP_MATRIX_RECT)
              ip_aa_aks_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"ip_matrix_aa_aks.bmp",_IP_MATRIX_RECT)
              misaligned_ip_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"ip_matrix_empty.bmp",(27,159,82,215))
              assert _IP_MATRIX_RECT == (27,160,79,212)
              assert ip_empty_sig["roi"] == [27,160,79,212]
              assert _matrix_signature_is_empty(ip_empty_sig)
              assert not _matrix_signature_is_empty(misaligned_ip_sig)
              assert _matrix_signature_matches_selected_cells(ip_aa_aks_sig,ip_empty_sig,[0,1])
              assert not _matrix_signature_matches_selected_cells(ip_aa_aks_sig,ip_empty_sig,[0,1,2])
              assert ip_aa_aks_sig["samples"][0] != ip_empty_sig["samples"][0]
              assert ip_aa_aks_sig["samples"][1] != ip_empty_sig["samples"][1]
          assert "def _run_auto_solve_ui_probe" in main
          updater=pathlib.Path("staging/auto_hu_solve_candidate/pigeon_updater.py").read_text(encoding="utf-8")
          ast.parse(updater,filename="pigeon_updater.py")
          data=preflop_candidate.encode("utf-8")
