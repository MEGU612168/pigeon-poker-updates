name: Build and test HU auto-solve candidate

on:
  push:
    branches: ["feature/auto-hu-solve", "main"]
    paths:
      - "staging/live_range_builder.py"
      - "staging/auto_solve_ui.py"
      - "staging/patch_auto_solve_ui_integration.py"
      - "staging/test_live_range_builder.py"
      - "staging/build-auto-hu-solve-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify stable v1.3.41 base
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, urllib.request, zipfile
          m=json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/stable.json",timeout=60).read())
          if m.get("version")!="1.3.41": raise SystemExit("unexpected base version: "+str(m.get("version")))
          b=base64.b64decode(urllib.request.urlopen(m["payload_url"],timeout=90).read(),validate=True)
          if len(b)!=int(m["payload_size"]): raise SystemExit("base payload size mismatch")
          if hashlib.sha256(b).hexdigest()!=m["payload_sha256"]: raise SystemExit("base payload sha256 mismatch")
          out=pathlib.Path("staging/base_v1_3_41.zip");out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(b)
          print("Verified base",m["version"],"bytes",len(b))
          with zipfile.ZipFile(io.BytesIO(b)) as z: print("Base files",z.namelist())
          PY
      - name: Patch live unknown-scenario queue with derived preflop ranges
        run: |
          python - <<'PY'
          import ast, pathlib, shutil, zipfile
          from tempfile import TemporaryDirectory
          base=pathlib.Path("staging/base_v1_3_41.zip")
          module=pathlib.Path("staging/live_range_builder.py").read_text(encoding="utf-8")
          ui_module=pathlib.Path("staging/auto_solve_ui.py").read_text(encoding="utf-8")
          ast.parse(module,filename="live_range_builder.py")
          ast.parse(ui_module,filename="auto_solve_ui.py")
          with TemporaryDirectory() as td:
              root=pathlib.Path(td)
              with zipfile.ZipFile(base) as z:
                  z.extractall(root)
              main_path=root/"PigeonPoker.pyw"
              main=main_path.read_text(encoding="utf-8")
              if "from pigeon_gto_plus.live_range_builder import build_live_hu_solver_setup" not in main:
                  raise SystemExit("Stable base does not contain the HU solver setup integration")
              if 'scenario["solver_setup"] = solver_setup' not in main:
                  raise SystemExit("Stable base does not attach setup data to unknown-spot requests")
              if "def _run_auto_solve_ui_probe" not in main:
                  raise SystemExit("Stable base is missing the GTO+ diagnostic action")
              target=root/"pigeon_gto_plus"/"live_range_builder.py"
              ui_target=root/"pigeon_gto_plus"/"auto_solve_ui.py"
              target.write_text(module,encoding="utf-8",newline="\n")
              ui_target.write_text(ui_module,encoding="utf-8",newline="\n")
              out=pathlib.Path("staging/auto_hu_solve_candidate");shutil.rmtree(out,ignore_errors=True);out.mkdir(parents=True)
              shutil.copy2(main_path,out/"PigeonPoker.pyw")
              shutil.copy2(root/"pigeon_updater.py",out/"pigeon_updater.py")
              shutil.copy2(target,out/"live_range_builder.py")
              shutil.copy2(ui_target,out/"auto_solve_ui.py")
              (out/"VERSION.txt").write_text("1.3.42\n",encoding="ascii")
              print("Patched app queue: range reconstruction result will be attached to every unknown HU request.")
          PY
      - name: Test source and actual embedded chart compatibility
        run: |
          python -m unittest discover -s staging -p "test_live_range_builder.py" -v
          python - <<'PY'
          import ast, base64, io, importlib.util, json, pathlib, sys, tempfile, urllib.request, zipfile
          from types import SimpleNamespace
          main=pathlib.Path("staging/auto_hu_solve_candidate/PigeonPoker.pyw").read_text(encoding="utf-8")
          ast.parse(main,filename="PigeonPoker.pyw")
          with open("staging/auto_hu_solve_candidate/live_range_builder.py",encoding="utf-8") as f: ast.parse(f.read())
          ui_source=pathlib.Path("staging/auto_hu_solve_candidate/auto_solve_ui.py").read_text(encoding="utf-8")
          ast.parse(ui_source,filename="auto_solve_ui.py")
          assert "未知HU局面の自動Solve設定を診断（変更なし）" in main
          assert "_bmp_region_difference_ratio" in ui_source
          assert "close_oop_range_editor" in ui_source
          assert "skipped_no_gto_owned_keyboard_focus" in ui_source
          # Validate visual state verification against synthetic 32-bit BMPs.
          import importlib.util, struct, types
          with tempfile.TemporaryDirectory() as td:
              pkg=pathlib.Path(td)/"probe_pkg";pkg.mkdir()
              (pkg/"__init__.py").write_text("",encoding="utf-8")
              base_zip=pathlib.Path("staging/base_v1_3_41.zip")
              with zipfile.ZipFile(base_zip) as bz:
                  (pkg/"ui_probe.py").write_bytes(bz.read("pigeon_gto_plus/ui_probe.py"))
              (pkg/"auto_solve_ui.py").write_text(ui_source,encoding="utf-8")
              sys.path.insert(0,td)
              from probe_pkg.auto_solve_ui import _bmp_region_difference_ratio
              def bmp(path, change=False):
                  w,h=665,570
                  px=bytearray(w*h*4)
                  if change:
                      for y in range(70,440):
                          for x in range(110,500):
                              i=(y*w+x)*4
                              px[i:i+4]=bytes((0x40,0x80,0xC0,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              bmp(pathlib.Path(td)/"base.bmp",False)
              bmp(pathlib.Path(td)/"same.bmp",False)
              bmp(pathlib.Path(td)/"overlay.bmp",True)
              assert _bmp_region_difference_ratio(pathlib.Path(td)/"base.bmp",pathlib.Path(td)/"same.bmp")["ratio"]==0.0
              assert _bmp_region_difference_ratio(pathlib.Path(td)/"base.bmp",pathlib.Path(td)/"overlay.bmp")["ratio"]>0.05
          assert "def _run_auto_solve_ui_probe" in main
          updater=pathlib.Path("staging/auto_hu_solve_candidate/pigeon_updater.py").read_text(encoding="utf-8")
          ast.parse(updater,filename="pigeon_updater.py")
          m=json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/stable.json").read())
          b=base64.b64decode(urllib.request.urlopen(m["payload_url"]).read(),validate=True)
          with zipfile.ZipFile(io.BytesIO(b)) as z: data=z.read("pigeon_poker/preflop_screenshot_ranges.py")
          with tempfile.TemporaryDirectory() as td:
              pkg=pathlib.Path(td)/"pigeon_poker";pkg.mkdir();(pkg/"__init__.py").write_text("")
              (pkg/"preflop_screenshot_ranges.py").write_bytes(data)
              sys.path.insert(0,td);sys.path.insert(0,"staging")
              from pigeon_poker import preflop_screenshot_ranges
              from live_range_builder import build_live_hu_solver_setup
              chart=preflop_screenshot_ranges._data()
              assert len(chart["nodes"])==20 and len(chart["rows"])==3380
              print("PASS: candidate syntax and live chart compatibility")
          PY
      - name: Archive candidate for next integration stage
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path("staging/auto_hu_solve_candidate")
          out=pathlib.Path("staging/auto_hu_solve_v1.3.42.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.write(root/"PigeonPoker.pyw","PigeonPoker.pyw")
              z.write(root/"pigeon_updater.py","pigeon_updater.py")
              z.write(root/"live_range_builder.py","pigeon_gto_plus/live_range_builder.py")
              z.write(root/"auto_solve_ui.py","pigeon_gto_plus/auto_solve_ui.py")
              z.write(root/"VERSION.txt","VERSION.txt")
          print("Candidate ZIP",out.stat().st_size,"SHA256",hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auto-hu-solve-v1.3.42
          path: staging/auto_hu_solve_v1.3.42.zip

      - name: Queue the verified v1.3.42 stable release (main branch only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, datetime, hashlib, io, json, pathlib, zipfile
          payload_path = pathlib.Path("staging/auto_hu_solve_v1.3.42.zip")
          payload = payload_path.read_bytes()
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              if z.testzip() is not None:
                  raise SystemExit("v1.3.42 update ZIP integrity failed")
              required = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
                          "pigeon_gto_plus/live_range_builder.py",
                          "pigeon_gto_plus/auto_solve_ui.py"}
              if not required.issubset(set(z.namelist())):
                  raise SystemExit("v1.3.42 update ZIP is missing required files")
              if z.read("VERSION.txt").decode("utf-8").strip() != "1.3.42":
                  raise SystemExit("v1.3.42 VERSION.txt mismatch")
              import ast
              ast.parse(z.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")
              ast.parse(z.read("pigeon_gto_plus/live_range_builder.py").decode("utf-8"),
                        filename="pigeon_gto_plus/live_range_builder.py")
              ast.parse(z.read("pigeon_gto_plus/auto_solve_ui.py").decode("utf-8"),
                        filename="pigeon_gto_plus/auto_solve_ui.py")
          release = pathlib.Path("releases/v1.3.42")
          release.mkdir(parents=True, exist_ok=True)
          for old in release.glob("payload.part-*"):
              old.unlink()
          encoded = base64.b64encode(payload).decode("ascii")
          chunks = [encoded[i:i+48000] for i in range(0, len(encoded), 48000)]
          names = []
          for i, chunk in enumerate(chunks):
              name = f"payload.part-{i:03d}"
              (release/name).write_text(chunk, encoding="ascii")
              names.append(name)
          metadata = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": "1.3.42",
              "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat(
                  timespec="seconds").replace("+00:00", "Z"),
              "release_notes": "未知HUポストフロップの解析要求データを維持しつつ、GTO+診断のOOPレンジ編集画面を実測した×ボタンで閉じ、元画面とのピクセル差で閉鎖を検証。Build TreeはOOP画面の閉鎖確認後のみ開き、GTOプロセス自身にキーボードフォーカスがない場合はEscを送らず、手動閉鎖が必要と明示。レンジ/Board/Pot/Stack/RakeやSolver設定は変更しない。",
              "package_mode": "full"
          }
          (release/"release.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          (release/"payload.parts.json").write_text(
              json.dumps({"parts": names}, indent=2) + chr(10), encoding="utf-8")
          (release/"payload.ready").write_text("verified v1.3.42" + chr(10), encoding="ascii")
          # Publish stable.json here; GITHUB_TOKEN pushes do not trigger a second workflow.
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              zip_names = set(z.namelist())
              allowed_roots = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}
              for name in zip_names:
                  parts = pathlib.PurePosixPath(name).parts
                  allowed_module = (len(parts) >= 2 and parts[0] in {"pigeon_poker", "pigeon_gto_plus"}
                                    and pathlib.PurePosixPath(name).suffix.lower() == ".py"
                                    and not any(p.startswith(".") or p == "__pycache__" for p in parts))
                  if name not in allowed_roots and not allowed_module:
                      raise SystemExit("Non-allow-listed update file: " + name)
              if not allowed_roots.issubset(zip_names):
                  raise SystemExit("Missing required root update files")
              if z.read("VERSION.txt").decode("utf-8").strip() != "1.3.42":
                  raise SystemExit("Update VERSION mismatch")
          (release/"payload-updater.zip.b64").write_text(
              base64.b64encode(payload).decode("ascii"), encoding="ascii")
          manifest = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": "1.3.42",
              "published_at": metadata["published_at"],
              "release_notes": metadata["release_notes"],
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": "https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/releases/v1.3.42/payload-updater.zip.b64",
              "payload_sha256": hashlib.sha256(payload).hexdigest(),
              "payload_size": len(payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          print(json.dumps({
              "version": "1.3.42", "payload_size": len(payload),
              "payload_sha256": manifest["payload_sha256"],
              "part_count": len(names), "zip_files": sorted(zip_names)
          }, ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.json releases/v1.3.42/
          git commit -m "Queue verified Pigeon Poker v1.3.42 release"
          git push
