name: Build and test HU auto-solve candidate

on:
  push:
    branches: ["feature/auto-hu-solve", "main"]
    paths:
      - "staging/live_range_builder.py"
      - "staging/auto_solve_ui.py"
      - "staging/patch_auto_solve_ui_integration.py"
      - "staging/test_live_range_builder.py"
      - "staging/build-auto-hu-solve-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify pinned v1.3.52 base
        run: |
          python - <<'PY'
          import base64, io, json, pathlib, urllib.request, zipfile
          base_url="https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/releases/v1.3.52/"
          release=json.loads(urllib.request.urlopen(base_url+"release.json",timeout=60).read())
          if release.get("version")!="1.3.52" or release.get("channel")!="stable" or release.get("package_mode")!="full":
              raise SystemExit("pinned base release metadata is not a full stable v1.3.52 package")
          encoded=urllib.request.urlopen(base_url+"payload-updater.zip.b64",timeout=90).read().strip()
          if len(encoded)!=273880:
              raise SystemExit("pinned v1.3.52 payload encoding size mismatch")
          b=base64.b64decode(encoded,validate=True)
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              if z.testzip() is not None:
                  raise SystemExit("pinned v1.3.52 ZIP integrity failed")
              if z.read("VERSION.txt").decode("utf-8").strip()!="1.3.52":
                  raise SystemExit("pinned base payload VERSION.txt mismatch")
              required={"PigeonPoker.pyw","pigeon_updater.py","VERSION.txt",
                        "pigeon_gto_plus/auto_solve_ui.py","pigeon_gto_plus/ui_probe.py"}
              if not required.issubset(set(z.namelist())):
                  raise SystemExit("pinned v1.3.52 base is missing required integration files")
          out=pathlib.Path("staging/base_v1_3_52.zip");out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(b)
          print("Verified pinned base",release["version"],"bytes",len(b))
          PY
      - name: Patch live unknown-scenario queue with derived preflop ranges
        run: |
          python - <<'PY'
          import ast, base64, io, pathlib, shutil, urllib.request, zipfile
          from tempfile import TemporaryDirectory
          base=pathlib.Path("staging/base_v1_3_52.zip")
          module=pathlib.Path("staging/live_range_builder.py").read_text(encoding="utf-8")
          ui_module=pathlib.Path("staging/auto_solve_ui.py").read_text(encoding="utf-8")
          ast.parse(module,filename="live_range_builder.py")
          ast.parse(ui_module,filename="auto_solve_ui.py")
          with TemporaryDirectory() as td:
              root=pathlib.Path(td)
              with zipfile.ZipFile(base) as z:
                  z.extractall(root)
              main_path=root/"PigeonPoker.pyw"
              main=main_path.read_text(encoding="utf-8")
              geometry_sync_method = (
                  "    def _layout_embedded_gto_host(self) -> bool:" + chr(10)
                  + "        try:" + chr(10)
                  + "            self.update_idletasks()" + chr(10)
                  + "            viewport_width = int(self.gto_viewport.winfo_width())" + chr(10)
                  + "            viewport_height = int(self.gto_viewport.winfo_height())" + chr(10)
                  + "            if viewport_width < 2 or viewport_height < 2:" + chr(10)
                  + "                return False" + chr(10)
                  + "            scale = min(viewport_width / 665.0, viewport_height / 570.0, 1.35)" + chr(10)
                  + "            if scale <= 0:" + chr(10)
                  + "                return False" + chr(10)
                  + "            target_width = max(2, int(round(665 * scale)))" + chr(10)
                  + "            target_height = max(2, int(round(570 * scale)))" + chr(10)
                  + "            current_size = (int(self.gto_host.winfo_width()), int(self.gto_host.winfo_height()))" + chr(10)
                  + "            if current_size != (target_width, target_height):" + chr(10)
                  + "                self.gto_host.place_configure(width=target_width, height=target_height)" + chr(10)
                  + "            self._gto_display_scale = scale" + chr(10)
                  + "            return True" + chr(10)
                  + "        except (tk.TclError, ZeroDivisionError, ValueError):" + chr(10)
                  + "            return False" + chr(10)
                  + chr(10)
                  + "    def _sync_embedded_gto_geometry(self, reason: str = \\"\\") -> bool:" + chr(10)
                  + "        if not self.gto_embedded or not getattr(self.integration, \\"embedder\\", None):" + chr(10)
                  + "            return False" + chr(10)
                  + "        try:" + chr(10)
                  + "            self.update_idletasks()" + chr(10)
                  + "            if not self._layout_embedded_gto_host():" + chr(10)
                  + "                raise RuntimeError(\\"GTO+ viewport has no usable client area\\")" + chr(10)
                  + "            host_width = int(self.gto_host.winfo_width())" + chr(10)
                  + "            host_height = int(self.gto_host.winfo_height())" + chr(10)
                  + "            if host_width < 2 or host_height < 2:" + chr(10)
                  + "                raise RuntimeError(f\\"invalid GTO+ host client geometry: {host_width}x{host_height}\\")" + chr(10)
                  + "            self.integration.resize_docked_window(host_width, host_height)" + chr(10)
                  + "            self.update_idletasks()" + chr(10)
                  + "            return True" + chr(10)
                  + "        except Exception as exc:" + chr(10)
                  + "            try:" + chr(10)
                  + "                suffix = f\\" ({reason})\\" if reason else \\"\\"" + chr(10)
                  + "                self.status_var.set(f\\"GTO+表示位置・サイズの再同期に失敗{suffix}: {exc}\\")" + chr(10)
                  + "            except Exception:" + chr(10)
                  + "                pass" + chr(10)
                  + "            return False" + chr(10)
                  + chr(10)
                  + "    def _schedule_embedded_gto_geometry_sync(self, reason: str) -> None:" + chr(10)
                  + "        if not self.gto_embedded:" + chr(10)
                  + "            return" + chr(10)
                  + "        self._layout_embedded_gto_host()" + chr(10)
                  + "        self._sync_embedded_gto_geometry(reason)" + chr(10)
                  + "        try:" + chr(10)
                  + "            self.after_idle(lambda r=reason: self._sync_embedded_gto_geometry(r + \\"-idle\\"))" + chr(10)
                  + "            self.after(250, lambda r=reason: self._sync_embedded_gto_geometry(r + \\"-settled\\"))" + chr(10)
                  + "        except tk.TclError:" + chr(10)
                  + "            pass" + chr(10)
                  + chr(10)
              )

              workspace_old = (
                  "        self.gto_host = tk.Frame(host_col, bg=\"#080f18\", height=570)" + chr(10)
                  + "        self.gto_host.pack(fill=\"both\", expand=True, padx=8, pady=8)" + chr(10)
                  + "        self.gto_host.bind(\"<Configure>\", self._resize_embedded)" + chr(10)
              )
              workspace_new = (
                  "        self.gto_viewport = tk.Frame(host_col, bg=\"#080f18\")" + chr(10)
                  + "        self.gto_viewport.pack(fill=\"both\", expand=True, padx=8, pady=8)" + chr(10)
                  + "        self.gto_host = tk.Frame(self.gto_viewport, bg=\"#080f18\", width=665, height=570)" + chr(10)
                  + "        self.gto_host.place(relx=.5, rely=.5, anchor=\"center\", width=665, height=570)" + chr(10)
                  + "        self.gto_viewport.bind(\"<Configure>\", self._resize_embedded)" + chr(10)
              )
              if main.count(workspace_old) != 1:
                  raise SystemExit("Could not uniquely locate the GTO+ workspace host block")
              main = main.replace(workspace_old, workspace_new, 1)
              launch_anchor = "    def _launch_gto(self):" + chr(10)
              if main.count(launch_anchor) != 1:
                  raise SystemExit("Could not uniquely locate _launch_gto for geometry-sync patch")
              if "def _sync_embedded_gto_geometry" not in main:
                  main = main.replace(launch_anchor, geometry_sync_method + launch_anchor, 1)
              success_anchor = '            self.gto_embedded = True' + chr(10) + '            self.status_var.set(f"GTO+をPigeon内に表示中 (HWND {hwnd})")'
              if main.count(success_anchor) != 2:
                  raise SystemExit("Expected exactly two GTO+ dock success blocks (launch and attach)")
              success_positions = [i for i in range(len(main)) if main.startswith(success_anchor, i)]
              if len(success_positions) != 2:
                  raise SystemExit("Could not identify the distinct launch and attach success blocks")
              launch_success = success_anchor + chr(10) + '            self._schedule_embedded_gto_geometry_sync("launch")'
              attach_success = success_anchor + chr(10) + '            self._schedule_embedded_gto_geometry_sync("attach")'
              second = success_positions[1]
              main = main[:second] + attach_success + main[second + len(success_anchor):]
              first = success_positions[0]
              main = main[:first] + launch_success + main[first + len(success_anchor):]
              resize_old = (
                  "    def _resize_embedded(self, _event=None):" + chr(10)
                  + "        if self.gto_embedded and self.integration.embedder:" + chr(10)
                  + "            try:" + chr(10)
                  + "                self.integration.resize_docked_window(self.gto_host.winfo_width(), self.gto_host.winfo_height())" + chr(10)
                  + "            except Exception:" + chr(10)
                  + "                pass" + chr(10)
              )
              resize_new = ("    def _resize_embedded(self, _event=None):" + chr(10)
                  + "        self._layout_embedded_gto_host()" + chr(10)
                  + '        self._sync_embedded_gto_geometry("viewport-configure")' + chr(10))
              if main.count(resize_old) != 1:
                  raise SystemExit("Could not uniquely locate the old embedded GTO+ resize callback")
              main = main.replace(resize_old, resize_new, 1)
              if main.count('self._schedule_embedded_gto_geometry_sync("launch")') != 1 or main.count('self._schedule_embedded_gto_geometry_sync("attach")') != 1:
                  raise SystemExit("Dock launch/attach geometry sync hooks were not inserted exactly once")
              if "from pigeon_gto_plus.live_range_builder import build_live_hu_solver_setup" not in main:
                  raise SystemExit("Stable base does not contain the HU solver setup integration")
              if 'scenario["solver_setup"] = solver_setup' not in main:
                  raise SystemExit("Stable base does not attach setup data to unknown-spot requests")
              if "def _run_auto_solve_ui_probe" not in main:
                  raise SystemExit("Stable base is missing the GTO+ diagnostic action")
              # The probe commits OOP=AA,AKs:0.4, confirms GTO+ normalizes the partial AKs weight to [40%]AKs[/40%], then clears and verifies restoration.
              if "import zipfile\n" not in main:
                  main=main.replace("import json\n","import json\nimport zipfile\n",1)
              ui_replacements = [
                  ("Run a reversible OOP=AA range commit/clear test and inspect the setup dialogs.",
                   "Run reversible OOP/IP weighted ranges, a three-card Board test, and inspect the Build Tree dialog."),
                  ("未知HU局面の自動Solve設定を診断（OOP AA可逆テスト）",
                   "未知HU局面の自動Solve設定を診断（OOP/IP/Board/Build Tree/Player2入力復旧）"),
                  ("OOPレンジが空の場合のみAAを一時確定してマトリクス反映を確認し、Clear＋完了で元に戻します。空でない場合は変更せず停止。Board/Pot/Stack/Rake・Tree・Solverは操作しません。",
                    "GTO+ワークスペースを縦横比665:570のまま表示枠へ均等に拡大・縮小し、中央配置。自動診断のクリック座標・Source欄・Board・画像ROI・マトリクス照合も実クライアント倍率に合わせて変換。OOP/IPレンジとBoard欄が空の場合のみテスト値を一時投入し、Player2入力要求の復旧・全テスト設定の復元を検証します。Pot/Stack/Rake変更・Tree確定・Solver実行はしません。"),
                  ("未知局面Solve用のGTO+入力を可逆テスト中…（OOP AAを一時確定して復元）",
                   "GTO+ワークスペース倍率・クリック座標・画像ROIを検査し、Player2入力要求とテスト設定の復元を確認中…"),
                  ("GTO+画面診断完了（OOP AAの反映・復元を確認。Tree/Solver未実行）",
                   "GTO+画面診断完了（Build Tree設定画面の採取・閉鎖・OOP/IPレンジとBoardの完全復元を確認。Tree構築/Solver未実行）"),
                  ("GTO+画面診断は安全停止しました。AAテストの反映・復元状態と手動対応フラグをログで確認してください。",
                   "GTO+画面診断は安全停止しました。ワークスペース倍率・座標補正・Player2 Source欄の特定、OOP/IPレンジ・Boardの復元結果を確認してください。"),
                  ("AAテストの復元に未達の可能性があります。診断ログを確認してください。Tree/Solverは未実行です。",
                   "ワークスペースの縦横比・座標補正、Player2 Source欄の特定、またはテスト設定の復元に未達です。診断JSONと画像を確認してください。Tree/Solverは未実行です。"),
              ]
              for old_text,new_text in ui_replacements:
                  if old_text in main:
                      main=main.replace(old_text,new_text)
                  elif new_text not in main:
                      raise SystemExit("Could not find old or already-patched Pigeon UI text: "+old_text)
              success_old = "success = completed.returncode == 0 and report is not None"
              final_gate = "success = bool(report_safety.get(\"oop_expected_matrix_cells_reflection_verified\") and report_safety.get(\"oop_restore_source_text_accepted\") and report_safety.get(\"oop_test_range_restored\") and report_safety.get(\"oop_weight_display_capture_saved\") and report_safety.get(\"ip_expected_matrix_cells_reflection_verified\") and report_safety.get(\"ip_restore_source_text_accepted\") and report_safety.get(\"ip_test_range_restored\") and report_safety.get(\"ip_weight_display_capture_saved\") and report_safety.get(\"board_test_cards_reflection_verified\") and report_safety.get(\"board_test_restored\") and report_safety.get(\"build_tree_dialog_opened\") and report_safety.get(\"build_tree_dialog_closed_verified\") and report_safety.get(\"build_tree_probe_inputs_restored\") and not report_safety.get(\"build_tree_probe_may_remain_configured\") and not report_safety.get(\"manual_close_required\"))"
              success_new = (
                  success_old + chr(10)
                  + " " * 16 + "if success:" + chr(10)
                  + " " * 20 + "try:" + chr(10)
                  + " " * 24 + "with zipfile.ZipFile(report, " + chr(34) + "r" + chr(34) + ") as report_zip:" + chr(10)
                  + " " * 28 + "report_json_name = next((name for name in report_zip.namelist() if name.endswith(" + chr(34) + ".json" + chr(34) + ")), None)" + chr(10)
                  + " " * 28 + "if report_json_name is None:" + chr(10)
                  + " " * 32 + "success = False" + chr(10)
                  + " " * 28 + "else:" + chr(10)
                  + " " * 32 + "report_json = json.loads(report_zip.read(report_json_name).decode(" + chr(34) + "utf-8" + chr(34) + "))" + chr(10)
                  + " " * 32 + "report_safety = report_json.get(" + chr(34) + "safety" + chr(34) + ", {})" + chr(10)
                  + " " * 32 + final_gate + chr(10)
                  + " " * 32 + "if not success:" + chr(10)
                  + " " * 36 + "detail += " + chr(34) + " [Build Tree可逆テスト] 設定ダイアログの表示・閉鎖、または一時レンジ/Boardの復元に未達です。" + chr(34) + chr(10)
                  + " " * 20 + "except Exception as exc:" + chr(10)
                  + " " * 24 + "success = False" + chr(10)
                  + " " * 24 + "detail += " + chr(34) + " [OOP/IP複数ハンド可逆テスト] 診断JSONの確認に失敗: " + chr(34) + "+str(exc)"
              )
              old_gate_variants = [
                  "success = bool(report_safety.get(\"oop_aa_only_matrix_reflection_verified\") and report_safety.get(\"oop_test_range_restored\") and not report_safety.get(\"manual_close_required\"))",
                  "success = bool(report_safety.get(\"oop_aa_only_matrix_reflection_verified\") and report_safety.get(\"oop_test_range_restored\") and report_safety.get(\"oop_weight_display_capture_saved\") and not report_safety.get(\"manual_close_required\"))",
                  "success = bool(report_safety.get(\"oop_expected_matrix_cells_reflection_verified\") and report_safety.get(\"oop_restore_source_text_accepted\") and report_safety.get(\"oop_test_range_restored\") and report_safety.get(\"oop_weight_display_capture_saved\") and not report_safety.get(\"manual_close_required\"))",
              ]
              for old_gate in old_gate_variants:
                  while old_gate in main:
                      main = main.replace(old_gate, final_gate, 1)
              if final_gate not in main:
                  if success_old in main:
                      main = main.replace(success_old, success_new, 1)
                  else:
                      raise SystemExit("Could not locate the previous Pigeon diagnostic success gate")
              old_errors = [
                  "[AA可逆テスト] OOPのAA反映・復元確認に未達です。診断JSONと画像を確認してください。",
                  "[AA可逆テスト] 診断JSONの確認に失敗: ",
                  "[AA:0.5可逆テスト] OOPのAAセル反映・重み表示保存・復元確認に未達です。診断JSONと画像を確認してください。",
                  "[OOP複数ハンド可逆テスト] AA+AKsの2セル反映・40%正規化・Source読戻し・完全復元に未達です。",
                  "[OOP複数ハンド可逆テスト] 診断JSONの確認に失敗: "
              ]
              new_error = "[Build Tree可逆テスト] 設定ダイアログの表示・閉鎖、または一時レンジ/Boardの復元に未達です。"
              for old_error in old_errors:
                  main = main.replace(old_error, new_error)
              legacy_aa_key = "oop_aa_only_matrix_reflection_verified"
              if legacy_aa_key in main:
                  legacy_pos = main.index(legacy_aa_key)
                  legacy_start = main.rfind("                if success:", 0, legacy_pos)
                  legacy_end = main.find("                self.after(0, lambda: finish(success, report, detail, completed.returncode))", legacy_pos)
                  if legacy_start < 0 or legacy_end < 0:
                      raise SystemExit("Could not bound the legacy AA-only report-validation block")
                  legacy_block = main[legacy_start:legacy_end]
                  if legacy_block.count(legacy_aa_key) != 1 or "report_safety.get(" not in legacy_block:
                      raise SystemExit("Legacy AA key was not inside the expected report-validation block")
                  main = main[:legacy_start] + main[legacy_end:]
              while main.count(final_gate) > 1:
                  gate_positions = [i for i in range(len(main)) if main.startswith(final_gate, i)]
                  gate_position = gate_positions[-1]
                  duplicate_start = main.rfind("                if success:", 0, gate_position)
                  duplicate_end = main.find("                self.after(0, lambda: finish(success, report, detail, completed.returncode))", gate_position)
                  if duplicate_start < 0 or duplicate_end < 0:
                      raise SystemExit("Could not bound a duplicate OOP/IP report-validation block")
                  duplicate_block = main[duplicate_start:duplicate_end]
                  if duplicate_block.count(final_gate) != 1 or "report_safety.get(" not in duplicate_block:
                      raise SystemExit("Duplicate report-validation block was not the expected shape")
                  main = main[:duplicate_start] + main[duplicate_end:]
              if main.count(final_gate) != 1:
                  raise SystemExit("Exactly one OOP/IP multi-hand success gate must remain")
              if legacy_aa_key in main or any(old_gate in main for old_gate in old_gate_variants):
                  raise SystemExit("Legacy AA-only or OOP-only success criteria remain")
              target=root/"pigeon_gto_plus"/"live_range_builder.py"
              ui_target=root/"pigeon_gto_plus"/"auto_solve_ui.py"
              target.write_text(module,encoding="utf-8",newline="\n")
              ui_target.write_text(ui_module,encoding="utf-8",newline="\n")
              probe_target=root/"pigeon_gto_plus"/"ui_probe.py"
              old_payload_b64=urllib.request.urlopen("https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/releases/v1.3.40/payload-updater.zip.b64",timeout=90).read()
              old_payload=base64.b64decode(old_payload_b64,validate=True)
              with zipfile.ZipFile(io.BytesIO(old_payload)) as old_zip:
                  probe_source=old_zip.read("pigeon_gto_plus/ui_probe.py").decode("utf-8")
                  preflop_source=old_zip.read("pigeon_poker/preflop_screenshot_ranges.py").decode("utf-8")
              ast.parse(probe_source,filename="pigeon_gto_plus/ui_probe.py")
              ast.parse(preflop_source,filename="pigeon_poker/preflop_screenshot_ranges.py")
              preflop_target=root/"pigeon_poker"/"preflop_screenshot_ranges.py"
              preflop_target.parent.mkdir(parents=True,exist_ok=True)
              preflop_target.write_text(preflop_source,encoding="utf-8")
              probe_target.write_text(probe_source,encoding="utf-8")
              out=pathlib.Path("staging/auto_hu_solve_candidate");shutil.rmtree(out,ignore_errors=True);out.mkdir(parents=True)
              main_path.write_text(main,encoding="utf-8",newline="\n")
              shutil.copy2(main_path,out/"PigeonPoker.pyw")
              shutil.copy2(root/"pigeon_updater.py",out/"pigeon_updater.py")
              shutil.copy2(target,out/"live_range_builder.py")
              shutil.copy2(ui_target,out/"auto_solve_ui.py")
              shutil.copy2(probe_target,out/"ui_probe.py")
              shutil.copy2(preflop_target,out/"preflop_screenshot_ranges.py")
              (out/"VERSION.txt").write_text("1.3.70\n",encoding="ascii")
              print("Patched app queue: range reconstruction result will be attached to every unknown HU request.")
          PY
      - name: Test source and actual embedded chart compatibility
        run: |
          python -m unittest discover -s staging -p "test_live_range_builder.py" -v
          python - <<'PY'
          import ast, base64, io, importlib.util, json, pathlib, sys, tempfile, urllib.request, zipfile
          from types import SimpleNamespace
          main=pathlib.Path("staging/auto_hu_solve_candidate/PigeonPoker.pyw").read_text(encoding="utf-8")
          ast.parse(main,filename="PigeonPoker.pyw")
          method_sources = {}
          for node in ast.walk(ast.parse(main,filename="PigeonPoker.pyw")):
              if isinstance(node, ast.FunctionDef) and node.name in {"_launch_gto", "_attach_existing_gto", "_resize_embedded", "_layout_embedded_gto_host"}:
                  method_sources[node.name] = ast.get_source_segment(main, node) or ""
          assert set(method_sources) == {"_launch_gto", "_attach_existing_gto", "_resize_embedded", "_layout_embedded_gto_host"}
          assert "self._layout_embedded_gto_host()" in method_sources["_resize_embedded"]
          assert "place_configure(width=target_width, height=target_height)" in method_sources["_layout_embedded_gto_host"]
          assert method_sources["_launch_gto"].count('_schedule_embedded_gto_geometry_sync("launch")') == 1
          assert '_schedule_embedded_gto_geometry_sync("attach")' not in method_sources["_launch_gto"]
