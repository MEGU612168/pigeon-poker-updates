name: Build and test HU auto-solve candidate

on:
  push:
    branches: ["feature/auto-hu-solve", "main"]
    paths:
      - "staging/live_range_builder.py"
      - "staging/auto_solve_ui.py"
      - "staging/patch_auto_solve_ui_integration.py"
      - "staging/test_live_range_builder.py"
      - "staging/build-auto-hu-solve-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify stable v1.3.51 base
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, urllib.request, zipfile
          m=json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/stable.json",timeout=60).read())
          if m.get("version")!="1.3.51": raise SystemExit("unexpected base version: "+str(m.get("version")))
          b=base64.b64decode(urllib.request.urlopen(m["payload_url"],timeout=90).read(),validate=True)
          if len(b)!=int(m["payload_size"]): raise SystemExit("base payload size mismatch")
          if hashlib.sha256(b).hexdigest()!=m["payload_sha256"]: raise SystemExit("base payload sha256 mismatch")
          out=pathlib.Path("staging/base_v1_3_51.zip");out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(b)
          print("Verified base",m["version"],"bytes",len(b))
          with zipfile.ZipFile(io.BytesIO(b)) as z: print("Base files",z.namelist())
          PY
      - name: Patch live unknown-scenario queue with derived preflop ranges
        run: |
          python - <<'PY'
          import ast, base64, io, pathlib, shutil, urllib.request, zipfile
          from tempfile import TemporaryDirectory
          base=pathlib.Path("staging/base_v1_3_51.zip")
          module=pathlib.Path("staging/live_range_builder.py").read_text(encoding="utf-8")
          ui_module=pathlib.Path("staging/auto_solve_ui.py").read_text(encoding="utf-8")
          ast.parse(module,filename="live_range_builder.py")
          ast.parse(ui_module,filename="auto_solve_ui.py")
          with TemporaryDirectory() as td:
              root=pathlib.Path(td)
              with zipfile.ZipFile(base) as z:
                  z.extractall(root)
              main_path=root/"PigeonPoker.pyw"
              main=main_path.read_text(encoding="utf-8")
              if "from pigeon_gto_plus.live_range_builder import build_live_hu_solver_setup" not in main:
                  raise SystemExit("Stable base does not contain the HU solver setup integration")
              if 'scenario["solver_setup"] = solver_setup' not in main:
                  raise SystemExit("Stable base does not attach setup data to unknown-spot requests")
              if "def _run_auto_solve_ui_probe" not in main:
                  raise SystemExit("Stable base is missing the GTO+ diagnostic action")
              # The probe now commits a temporary OOP=AA test, then clears and verifies restoration.
              if "import zipfile\n" not in main:
                  main=main.replace("import json\n","import json\nimport zipfile\n",1)
              ui_replacements = [
                  ("Read-only calibration of the exact embedded GTO+ range/Build Tree dialogs.",
                   "Run a reversible OOP=AA range commit/clear test and inspect the setup dialogs."),
                  ("未知HU局面の自動Solve設定を診断（変更なし）",
                   "未知HU局面の自動Solve設定を診断（OOP AA可逆テスト）"),
                  ("GTO+のOOPレンジ編集画面とBuild Tree設定画面を開いて撮影し、Escapeで閉じます。文字入力・レンジ確定・Board/Pot/Stack/Rake変更・Tree構築・Solver実行は行いません。",
                   "OOPレンジが空の場合のみAAを一時確定してマトリクス反映を確認し、Clear＋完了で元に戻します。空でない場合は変更せず停止。Board/Pot/Stack/Rake・Tree・Solverは操作しません。"),
                  ("未知局面Solve用のGTO+画面を安全確認中…（レンジ・設定は変更しません）",
                   "未知局面Solve用のGTO+入力を可逆テスト中…（OOP AAを一時確定して復元）"),
                  ("GTO+画面診断完了（設定変更・Tree構築・Solver実行なし）",
                   "GTO+画面診断完了（OOP AAの反映・復元を確認。Tree/Solver未実行）"),
                  ("GTO+画面診断は安全停止しました。設定やレンジは変更していません。",
                   "GTO+画面診断は安全停止しました。AAテストの反映・復元状態と手動対応フラグをログで確認してください。"),
                  ("GTO+の設定変更やSolver実行はしていません。",
                   "AAテストの復元に未達の可能性があります。診断ログを確認してください。Tree/Solverは未実行です。"),
              ]
              for old_text,new_text in ui_replacements:
                  if old_text in main:
                      main=main.replace(old_text,new_text)
                  elif new_text not in main:
                      raise SystemExit("Could not find old or already-patched Pigeon UI text: "+old_text)
              success_old = "success = completed.returncode == 0 and report is not None"
              success_new = (
                  "success = completed.returncode == 0 and report is not None" + chr(10)
                  + " " * 16 + "if success:" + chr(10)
                  + " " * 20 + "try:" + chr(10)
                  + " " * 24 + "with zipfile.ZipFile(report, \"r\") as report_zip:" + chr(10)
                  + " " * 28 + "report_json_name = next((name for name in report_zip.namelist() if name.endswith(\".json\")), None)" + chr(10)
                  + " " * 28 + "if report_json_name is None:" + chr(10)
                  + " " * 32 + "success = False" + chr(10)
                  + " " * 28 + "else:" + chr(10)
                  + " " * 32 + "report_json = json.loads(report_zip.read(report_json_name).decode(\"utf-8\"))" + chr(10)
                  + " " * 32 + "report_safety = report_json.get(\"safety\", {})" + chr(10)
                  + " " * 32 + "success = bool(report_safety.get(\"oop_aa_only_matrix_reflection_verified\") and report_safety.get(\"oop_test_range_restored\") and not report_safety.get(\"manual_close_required\"))" + chr(10)
                  + " " * 32 + "if not success:" + chr(10)
                  + " " * 36 + "detail += \" [AA可逆テスト] OOPのAA反映・復元確認に未達です。診断JSONと画像を確認してください。\"" + chr(10)
                  + " " * 20 + "except Exception as exc:" + chr(10)
                  + " " * 24 + "success = False" + chr(10)
                  + " " * 24 + "detail += \" [AA可逆テスト] 診断JSONの確認に失敗: \"+str(exc)"
              )
              if success_old in main:
                  main=main.replace(success_old,success_new,1)
              elif "report_safety.get(\"oop_aa_only_matrix_reflection_verified\")" not in main:
                  raise SystemExit("Could not locate Pigeon diagnostic success gate or its already-patched version")
              target=root/"pigeon_gto_plus"/"live_range_builder.py"
              ui_target=root/"pigeon_gto_plus"/"auto_solve_ui.py"
              target.write_text(module,encoding="utf-8",newline="\n")
              ui_target.write_text(ui_module,encoding="utf-8",newline="\n")
              probe_target=root/"pigeon_gto_plus"/"ui_probe.py"
              old_payload_b64=urllib.request.urlopen("https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/releases/v1.3.40/payload-updater.zip.b64",timeout=90).read()
              old_payload=base64.b64decode(old_payload_b64,validate=True)
              with zipfile.ZipFile(io.BytesIO(old_payload)) as old_zip:
                  probe_source=old_zip.read("pigeon_gto_plus/ui_probe.py").decode("utf-8")
                  preflop_source=old_zip.read("pigeon_poker/preflop_screenshot_ranges.py").decode("utf-8")
              ast.parse(probe_source,filename="pigeon_gto_plus/ui_probe.py")
              ast.parse(preflop_source,filename="pigeon_poker/preflop_screenshot_ranges.py")
              preflop_target=root/"pigeon_poker"/"preflop_screenshot_ranges.py"
              preflop_target.parent.mkdir(parents=True,exist_ok=True)
              preflop_target.write_text(preflop_source,encoding="utf-8")
              probe_target.write_text(probe_source,encoding="utf-8")
              out=pathlib.Path("staging/auto_hu_solve_candidate");shutil.rmtree(out,ignore_errors=True);out.mkdir(parents=True)
              main_path.write_text(main,encoding="utf-8",newline="\n")
              shutil.copy2(main_path,out/"PigeonPoker.pyw")
              shutil.copy2(root/"pigeon_updater.py",out/"pigeon_updater.py")
              shutil.copy2(target,out/"live_range_builder.py")
              shutil.copy2(ui_target,out/"auto_solve_ui.py")
              shutil.copy2(probe_target,out/"ui_probe.py")
              shutil.copy2(preflop_target,out/"preflop_screenshot_ranges.py")
              (out/"VERSION.txt").write_text("1.3.52\n",encoding="ascii")
              print("Patched app queue: range reconstruction result will be attached to every unknown HU request.")
          PY
      - name: Test source and actual embedded chart compatibility
        run: |
          python -m unittest discover -s staging -p "test_live_range_builder.py" -v
          python - <<'PY'
          import ast, base64, io, importlib.util, json, pathlib, sys, tempfile, urllib.request, zipfile
          from types import SimpleNamespace
          main=pathlib.Path("staging/auto_hu_solve_candidate/PigeonPoker.pyw").read_text(encoding="utf-8")
          ast.parse(main,filename="PigeonPoker.pyw")
          with open("staging/auto_hu_solve_candidate/live_range_builder.py",encoding="utf-8") as f: ast.parse(f.read())
          ui_source=pathlib.Path("staging/auto_hu_solve_candidate/auto_solve_ui.py").read_text(encoding="utf-8")
          ast.parse(ui_source,filename="auto_solve_ui.py")
          assert "未知HU局面の自動Solve設定を診断（OOP AA可逆テスト）" in main
          assert "AAを一時確定してマトリクス反映を確認" in main
          assert "oop_aa_only_matrix_reflection_verified" in main
          assert '"schema_version": 11' in ui_source
          assert '"original_text_restore_readback_required": True' in ui_source
          assert '"range_committed": False' in ui_source
          assert '"done_button_clicked_for_oop_aa_test": bool(oop_roundtrip.get("range_committed_temporarily"))' in ui_source
          assert '"oop_aa_only_matrix_reflection_verified"' in ui_source
          assert "_bmp_region_difference_ratio" in ui_source
          assert "_build_tree_dialog_is_visible" in ui_source
          assert '"stage": "ip_range_editor"' in ui_source
          assert '"stage": "board_input"' in ui_source
          assert "source_field_test_incomplete" in ui_source
          assert "_probe_source_field_readback_restore" in ui_source
          assert "WindowFromPoint" in ui_source
          assert "_window_is_related_to_embedded_target" in ui_source
          assert "_source_field_underlay_is_verified_edit" in ui_source
          assert "source_field_occluded_by_foreign_window" in ui_source
          assert "_run_oop_aa_commit_roundtrip" in ui_source
          assert "_bmp_matrix_center_signature" in ui_source
          assert "_matrix_signature_is_empty" in ui_source
          assert "_matrix_signature_is_aa_only" in ui_source
          assert 'label="clear_range_editor"' in ui_source
          assert 'label="commit_range_editor_done"' in ui_source
          assert 'label="close_board_selector"' in ui_source
          assert "_BOARD_CLOSE_CENTER" in ui_source
          assert "manual_close_required = (not oop_closed_ok" in ui_source
          assert "or not ip_closed_ok" in ui_source
          assert "_temporary_source_field_window_adjustment" in ui_source
          assert "_source_field_occlusion_shift" in ui_source
          assert '"probe": "verified_gto_plus_oop_aa_commit_roundtrip_and_clear_restore_v11_cell_centers"' in ui_source
          assert "_source_field_underlay_is_verified_gto_view" in ui_source
          assert "_click_verified_gto_hit_target" in ui_source
          assert "WM_LBUTTONDOWN" in ui_source
          assert "baseline_difference_after_native_close" in ui_source
          assert "gto_view_focused_no_unique_native_edit_created" in ui_source
          assert '"focus_only_click_allowed_on_verified_gto_view": True' in ui_source
          assert '"no_keyboard_input_without_unique_native_edit": True' in ui_source
          assert "ScreenToClient" in ui_source
          assert "original_parent_client_xy" in ui_source
          assert "window_position_restore_verified" in ui_source
          assert "close_oop_range_editor" in ui_source
          assert "to_gto_plus_range_text" in pathlib.Path("staging/auto_hu_solve_candidate/live_range_builder.py").read_text(encoding="utf-8")
          assert "skipped_no_gto_owned_keyboard_focus" in ui_source
          probe_source=pathlib.Path("staging/auto_hu_solve_candidate/ui_probe.py").read_text(encoding="utf-8")
          ast.parse(probe_source,filename="ui_probe.py")
          preflop_candidate=pathlib.Path("staging/auto_hu_solve_candidate/preflop_screenshot_ranges.py").read_text(encoding="utf-8")
          ast.parse(preflop_candidate,filename="preflop_screenshot_ranges.py")
          # Validate visual state verification against synthetic 32-bit BMPs.
          import importlib.util, struct, types
          with tempfile.TemporaryDirectory() as td:
              pkg=pathlib.Path(td)/"probe_pkg";pkg.mkdir()
              (pkg/"__init__.py").write_text("",encoding="utf-8")
              base_zip=pathlib.Path("staging/base_v1_3_51.zip")
              # ui_probe.py is explicitly included in this candidate, so test that exact bundled source.
              (pkg/"ui_probe.py").write_text(probe_source,encoding="utf-8")
              (pkg/"auto_solve_ui.py").write_text(ui_source,encoding="utf-8")
              sys.path.insert(0,td)
              from probe_pkg.auto_solve_ui import (_bmp_region_difference_ratio,
                  _OOP_MATRIX_RECT, _bmp_matrix_center_signature, _matrix_signature_is_empty,
                  _matrix_signature_is_aa_only, _build_tree_dialog_is_visible, _source_field_occlusion_shift,
                  _source_field_underlay_is_verified_gto_view,
                  _source_field_underlay_is_verified_edit,
                  _source_field_occlusion_shift)
              assert _source_field_occlusion_shift([331,673,631,695],[271,672,497,720],5)==28
              assert _source_field_occlusion_shift([331,640,631,662],[271,672,497,720],5)==0
              good_view={"pid":9984,"class":"AfxFrameOrView140su","control_id":59648,
                  "related_to_exact_host":True,"visible":True,"enabled":True,
                  "rect_screen":[219,218,884,763]}
              assert _source_field_underlay_is_verified_gto_view(good_view,9984,(481,656))
              assert not _source_field_underlay_is_verified_gto_view(good_view,9528,(481,656))
              good_edit={"pid":9984,"class":"Edit","related_to_exact_host":True,
                  "visible":True,"enabled":True,"rect_screen":[331,645,631,667]}
              assert _source_field_underlay_is_verified_edit(good_edit,9984)
              root_only = [{"is_embedded_root": True}]
              root_and_popup = [{"is_embedded_root": True}, {"is_embedded_root": False}]
              assert not _build_tree_dialog_is_visible({"ratio": 0.0}, root_only)
              assert _build_tree_dialog_is_visible({"ratio": 0.02}, root_only)
              assert _build_tree_dialog_is_visible({"ratio": 0.0}, root_and_popup)
              def bmp(path, change=False):
                  w,h=665,570
                  px=bytearray(w*h*4)
                  if change:
                      for y in range(70,440):
                          for x in range(110,500):
                              i=(y*w+x)*4
                              px[i:i+4]=bytes((0x40,0x80,0xC0,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              bmp(pathlib.Path(td)/"base.bmp",False)
              bmp(pathlib.Path(td)/"same.bmp",False)
              bmp(pathlib.Path(td)/"overlay.bmp",True)
              assert _bmp_region_difference_ratio(pathlib.Path(td)/"base.bmp",pathlib.Path(td)/"same.bmp")["ratio"]==0.0
              assert _bmp_region_difference_ratio(pathlib.Path(td)/"base.bmp",pathlib.Path(td)/"overlay.bmp")["ratio"]>0.05
              def matrix_bmp(path, active_aa=False):
                  w,h=665,570
                  px=bytearray(w*h*4)
                  if active_aa:
                      # AA matrix-cell sample point is (29, 91) in the 665x570 client.
                      i=(91*w+29)*4
                      px[i:i+4]=bytes((0x20,0x80,0xE0,0))
                  header=b"BM"+struct.pack("<IHHI",54+len(px),0,0,54)
                  dib=struct.pack("<IiiHHIIiiII",40,w,-h,1,32,0,len(px),0,0,0,0)
                  pathlib.Path(path).write_bytes(header+dib+px)
              matrix_bmp(pathlib.Path(td)/"matrix_empty.bmp",False)
              matrix_bmp(pathlib.Path(td)/"matrix_aa.bmp",True)
              empty_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"matrix_empty.bmp")
              aa_sig=_bmp_matrix_center_signature(pathlib.Path(td)/"matrix_aa.bmp")
              assert _OOP_MATRIX_RECT == (27,89,79,141)
              assert empty_sig["roi"] == [27,89,79,141]
              assert _matrix_signature_is_empty(empty_sig)
              assert _matrix_signature_is_aa_only(aa_sig,empty_sig)
          assert "def _run_auto_solve_ui_probe" in main
          updater=pathlib.Path("staging/auto_hu_solve_candidate/pigeon_updater.py").read_text(encoding="utf-8")
          ast.parse(updater,filename="pigeon_updater.py")
          data=preflop_candidate.encode("utf-8")
          with tempfile.TemporaryDirectory() as td:
              pkg=pathlib.Path(td)/"pigeon_poker";pkg.mkdir();(pkg/"__init__.py").write_text("")
              (pkg/"preflop_screenshot_ranges.py").write_bytes(data)
              sys.path.insert(0,td);sys.path.insert(0,"staging")
              from pigeon_poker import preflop_screenshot_ranges
              from live_range_builder import build_live_hu_solver_setup
              chart=preflop_screenshot_ranges._data()
              assert len(chart["nodes"])==20 and len(chart["rows"])==3380
              print("PASS: candidate syntax and live chart compatibility")
          PY
      - name: Archive candidate for next integration stage
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path("staging/auto_hu_solve_candidate")
          out=pathlib.Path("staging/auto_hu_solve_v1.3.52.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.write(root/"PigeonPoker.pyw","PigeonPoker.pyw")
              z.write(root/"pigeon_updater.py","pigeon_updater.py")
              z.write(root/"live_range_builder.py","pigeon_gto_plus/live_range_builder.py")
              z.write(root/"auto_solve_ui.py","pigeon_gto_plus/auto_solve_ui.py")
              z.write(root/"ui_probe.py","pigeon_gto_plus/ui_probe.py")
              z.write(root/"preflop_screenshot_ranges.py","pigeon_poker/preflop_screenshot_ranges.py")
              z.write(root/"VERSION.txt","VERSION.txt")
          print("Candidate ZIP",out.stat().st_size,"SHA256",hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auto-hu-solve-v1.3.52
          path: staging/auto_hu_solve_v1.3.52.zip

      - name: Queue the verified v1.3.52 stable release (main branch only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, datetime, hashlib, io, json, pathlib, zipfile
          payload_path = pathlib.Path("staging/auto_hu_solve_v1.3.52.zip")
          payload = payload_path.read_bytes()
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              if z.testzip() is not None:
                  raise SystemExit("v1.3.51 update ZIP integrity failed")
              required = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
                          "pigeon_gto_plus/live_range_builder.py",
                          "pigeon_gto_plus/auto_solve_ui.py",
                          "pigeon_gto_plus/ui_probe.py",
                          "pigeon_poker/preflop_screenshot_ranges.py"}
              if not required.issubset(set(z.namelist())):
                  raise SystemExit("v1.3.51 update ZIP is missing required files")
              if z.read("VERSION.txt").decode("utf-8").strip() != "1.3.52":
                  raise SystemExit("v1.3.51 VERSION.txt mismatch")
              import ast
              ast.parse(z.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")
              ast.parse(z.read("pigeon_gto_plus/live_range_builder.py").decode("utf-8"),
                        filename="pigeon_gto_plus/live_range_builder.py")
              ast.parse(z.read("pigeon_gto_plus/auto_solve_ui.py").decode("utf-8"),
                        filename="pigeon_gto_plus/auto_solve_ui.py")
              ast.parse(z.read("pigeon_gto_plus/ui_probe.py").decode("utf-8"),
                        filename="pigeon_gto_plus/ui_probe.py")
              ast.parse(z.read("pigeon_poker/preflop_screenshot_ranges.py").decode("utf-8"),
                        filename="pigeon_poker/preflop_screenshot_ranges.py")
          release = pathlib.Path("releases/v1.3.52")
          release.mkdir(parents=True, exist_ok=True)
          for old in release.glob("payload.part-*"):
              old.unlink()
          encoded = base64.b64encode(payload).decode("ascii")
          chunks = [encoded[i:i+48000] for i in range(0, len(encoded), 48000)]
          names = []
          for i, chunk in enumerate(chunks):
              name = f"payload.part-{i:03d}"
              (release/name).write_text(chunk, encoding="ascii")
              names.append(name)
          metadata = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": "1.3.52",
              "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat(
                  timespec="seconds").replace("+00:00", "Z"),
              "release_notes": "GTO+ 1.9.1の重み付きレンジを公式HAND:WEIGHT形式へ変換。OOPの13x13マトリクスは罫線を避けた各セル中心を4px間隔でサンプリングし、空状態を判定。空の場合だけAAを一時確定し、一セルだけの反映を画像確認後、Clear＋完了で元の状態へ戻して検証。初期レンジが空でない場合は変更せず停止。Build Tree・Solver実行なし。",
              "package_mode": "full"
          }
          (release/"release.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          (release/"payload.parts.json").write_text(
              json.dumps({"parts": names}, indent=2) + chr(10), encoding="utf-8")
          (release/"payload.ready").write_text("verified v1.3.52" + chr(10), encoding="ascii")
          # Publish stable.json here; GITHUB_TOKEN pushes do not trigger a second workflow.
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              zip_names = set(z.namelist())
              allowed_roots = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}
              for name in zip_names:
                  parts = pathlib.PurePosixPath(name).parts
