name: Verify Pigeon Poker advanced range and multiway EV model

on:
  push:
    paths:
      - "staging/source_1_3_101/pigeon_poker/poker_reasoning.py"
      - "staging/test_poker_reasoning.py"
      - ".github/workflows/verify-poker-reasoning.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source syntax
        run: python -m py_compile staging/source_1_3_101/pigeon_poker/poker_reasoning.py
      - name: Run randomized rank, draw, multiway and decision tests
        run: python staging/test_poker_reasoning.py
      - name: Run immutable preflop chart regression
        run: |
          cp staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py staging/preflop_screenshot_ranges_75.py
          python staging/test_preflop_ranges_75.py
