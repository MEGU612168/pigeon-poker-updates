name: Release Pigeon Poker v1.3.85 live stable update sync

on:
  push:
    paths:
      - "releases/v1.3.85/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from verified v1.3.84 stable package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.84"
          TARGET_VERSION = "1.3.85"
          SOURCE_SHA256 = "e8b4e39bb4504f4cd38edbb70b0e83aca6690cd09cb7585946fe31ba0104fcae"
          SOURCE_SIZE = 224083
          SOURCE_URL = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )

          with urllib.request.urlopen(SOURCE_URL, timeout=90) as response:
              source_transport = response.read().decode("ascii").strip()
          source_payload = base64.b64decode(source_transport, validate=True)
          if len(source_payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.84 package size mismatch.")
          if hashlib.sha256(source_payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.84 package SHA-256 mismatch.")

          EXPECTED_FILES = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(source_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Pinned v1.3.84 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != EXPECTED_FILES:
              raise SystemExit("Unexpected v1.3.84 package file set.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned v1.3.84 version marker mismatch.")

          # Keep the validated range implementation and data byte-for-byte.
          range_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected_blob in range_blobs.items():
              data = files[name]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise SystemExit("Range baseline changed: " + name)

          updater = files["pigeon_updater.py"].decode("utf-8")
          main = files["PigeonPoker.pyw"].decode("utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, got {count}.")
              return source.replace(old, new, 1)

          # The app already talks to the repository's stable.json. Make that
          # connection explicitly cache-bypassing, so a newly published stable
          # manifest is seen on the next polling cycle rather than a CDN copy.
          updater = replace_once(
              updater,
              'PRODUCT = "pigeon-poker"\nCHANNEL = "stable"\n',
              'PRODUCT = "pigeon-poker"\nCHANNEL = "stable"\n'
              'UPDATE_CHECK_INTERVAL_MS = 60 * 1000\n',
              "define shared live update polling interval",
          )
          updater = replace_once(
              updater,
              'headers={"User-Agent": "PigeonPoker-Updater/1.0", "Accept": "application/json, application/zip, */*"},',
              'headers={\n'
              '            "User-Agent": "PigeonPoker-Updater/1.0",\n'
              '            "Accept": "application/json, application/zip, */*",\n'
              '            "Cache-Control": "no-cache, no-store, max-age=0",\n'
              '            "Pragma": "no-cache",\n'
              '        },',
              "set no-cache headers on updater requests",
          )
          updater = replace_once(
              updater,
              'def _fetch_manifest() -> dict[str, Any]:\n'
              '    raw = _https_get(MANIFEST_URL, max_bytes=64 * 1024, timeout=15)\n',
              'def _fetch_manifest() -> dict[str, Any]:\n'
              '    # Bypass GitHub raw/CDN caches and read the current stable manifest.\n'
              '    cache_buster = str(time.time_ns())\n'
              '    separator = "&" if "?" in MANIFEST_URL else "?"\n'
              '    manifest_url = f"{MANIFEST_URL}{separator}_pigeon_sync={cache_buster}"\n'
              '    raw = _https_get(manifest_url, max_bytes=64 * 1024, timeout=15)\n',
              "fetch current stable manifest without stale cache",
          )

          # The one normal updater object polls stable.json at startup, then
          # every 60 seconds. It does not download the ZIP unless a newer
          # version is present. Latest version remains disabled; only UPDATE NOW
          # appears when the manifest version exceeds the installed version.
          main = replace_once(
              main,
              'from pigeon_updater import start_update_check, start_update_availability_check',
              'from pigeon_updater import (\n'
              '    start_update_check, start_update_availability_check,\n'
              '    UPDATE_CHECK_INTERVAL_MS,\n'
              ')',
              "wire main app to the updater's shared polling interval",
          )
          old_poll = "30 * 60 * 1000"
          if main.count(old_poll) != 2:
              raise SystemExit(
                  "Expected startup and recurring 30-minute timers; found "
                  + str(main.count(old_poll))
              )
          main = main.replace(old_poll, "UPDATE_CHECK_INTERVAL_MS")

          # Confirm the updater's existing single-flight gate and version
          # comparison remain unchanged. Do not add manual check buttons.
          for marker in (
              "if getattr(self, \"_update_check_active\", False) or getattr(self, \"_update_in_progress\", False):",
              'text="UPDATE NOW"',
              'text="UP TO DATE"',
              "start_update_availability_check(ROOT, on_result, on_error)",
              "self.after(UPDATE_CHECK_INTERVAL_MS, self._periodic_update_check)",
          ):
              if marker not in main:
                  raise SystemExit("Missing live-sync app behavior: " + marker)
          if "CHECK AGAIN" in main or "RETRY CHECK" in main:
              raise SystemExit("Manual update check controls were reintroduced.")

          for marker in (
              "UPDATE_CHECK_INTERVAL_MS = 60 * 1000",
              '"Cache-Control": "no-cache, no-store, max-age=0"',
              '"Pragma": "no-cache"',
              "cache_buster = str(time.time_ns())",
              'manifest_url = f"{MANIFEST_URL}{separator}_pigeon_sync={cache_buster}"',
              "available = _version_tuple(candidate) > _version_tuple(current)",
          ):
              if marker not in updater:
                  raise SystemExit("Missing stable manifest live-sync behavior: " + marker)
          if "raw = _https_get(MANIFEST_URL," in updater:
              raise SystemExit("Manifest fetch still permits a cached stable.json response.")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["pigeon_updater.py"] = updater.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + chr(10)).encode("ascii")

          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          # Unit checks for installed-version comparison and polling cadence.
          def has_update(installed: str, remote: str) -> bool:
              return tuple(map(int, remote.split("."))) > tuple(map(int, installed.split(".")))
          if has_update("1.3.85", "1.3.85"):
              raise SystemExit("Current-version comparison incorrectly reports an update.")
          if not has_update("1.3.84", "1.3.85"):
              raise SystemExit("New stable version was not detected.")
          if "UPDATE_CHECK_INTERVAL_MS = 60 * 1000" not in updater:
              raise SystemExit("Automatic polling interval is not one minute.")

          output = io.BytesIO()
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final v1.3.85 ZIP CRC failure: " + bad)
              if set(archive.namelist()) != EXPECTED_FILES:
                  raise SystemExit("Final v1.3.85 package file set changed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != TARGET_VERSION:
                  raise SystemExit("Final v1.3.85 version marker mismatch.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")
              ast.parse(archive.read("pigeon_updater.py").decode("utf-8"), filename="pigeon_updater.py")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded_final = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(
              encoded_final, encoding="ascii"
          )

          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded_final), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(
                  encoded_final[offset:offset + chunk_size], encoding="ascii"
              )
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + chr(10), encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "Pigeon Pokerの既存UpdaterをGitHub stable.jsonへ直接連動。"
              "起動時に即時確認し、起動中は60秒ごとに最新Stable manifestを自動取得。"
              "Cache-Control/Pragma no-cacheと毎回固有のcache-busterを使用し、"
              "CDNの古いmanifestではなく公開済みStableの最新バージョンを確認。"
              "更新候補の確認だけではZIPをダウンロードせず、バージョン差がある場合だけUPDATE NOWを有効化。"
              "最新版では更新ボタンを無効のまま維持し、CHECK AGAIN/RETRY CHECKは設けない。"
              "v1.3.84のGTO+固定画面・ドロワー・下端補正、GTO+権限復旧・自動接続、"
              "v1.3.69のレンジ本体を維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "stable_manifest_direct_link": True,
              "manifest_cache_bypass": True,
              "automatic_update_check_on_startup": True,
              "automatic_update_check_interval_seconds": 60,
              "check_only_until_update_found": True,
              "up_to_date_button_disabled": True,
              "manual_check_buttons_removed": True,
              "range_baseline": "1.3.69",
              "gto_workspace_baseline": "1.3.84",
              "gto_permission_recovery": "preserved",
              "automatic_gto_lifecycle": True,
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )
          (release_dir / "payload.ready").write_text(
              "verified " + TARGET_VERSION + chr(10), encoding="ascii"
          )

          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )

          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          artifact = dist / f"PigeonPoker_{TARGET_VERSION}_Improved.zip"
          artifact.write_bytes(final_payload)
          with zipfile.ZipFile(artifact, "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Download artifact ZIP CRC validation failed.")

          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "published_version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "stable_json_direct": True,
              "manifest_no_cache": True,
              "poll_interval_seconds": 60,
              "startup_check": True,
              "update_button_only_for_newer_version": True,
              "manual_check_buttons": False,
              "range_baseline_preserved": True,
              "gto_workspace_preserved": True,
          }, ensure_ascii=False))
          PY

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PigeonPoker_1.3.85_Improved
          path: dist/PigeonPoker_1.3.85_Improved.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable v1.3.85 manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.85/
          git commit -m "Release Pigeon Poker v1.3.85 live stable update sync"
          git push
