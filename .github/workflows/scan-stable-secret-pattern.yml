name: Diagnose protected secret pattern in current stable package

on:
  push:
    paths:
      - "secret-scan.request"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect decoded release files without printing credential values
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, re, urllib.request, zipfile
          repo = "MEGU612168/pigeon-poker-updates"
          manifest = json.loads(pathlib.Path("stable.json").read_text(encoding="utf-8"))
          print("stable version:", manifest.get("version"))
          url = str(manifest["payload_url"])
          request = urllib.request.Request(url, headers={"Cache-Control":"no-cache"})
          raw = urllib.request.urlopen(request, timeout=120).read()
          payload = base64.b64decode(raw, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          if digest != manifest["payload_sha256"]:
              raise SystemExit("stable checksum mismatch")
          patterns = {
              "tencent_secret_id": re.compile(rb"AKID[A-Za-z0-9]{24,48}"),
              "tencent_secret_id_labeled": re.compile(rb"(?i)(?:secret[_ -]?id|secretid)\s*[:=]\s*['\"]?([A-Za-z0-9]{24,80})"),
          }
          matches = []
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for name in archive.namelist():
                  content = archive.read(name)
                  for label, pattern in patterns.items():
                      for match in pattern.finditer(content):
                          value = match.group(0)
                          matches.append({
                              "file": name,
                              "pattern": label,
                              "offset": match.start(),
                              "matched_length": len(value),
                              "fingerprint": hashlib.sha256(value).hexdigest()[:12],
                          })
          print(json.dumps({"matching_occurrences": matches}, indent=2))
          PY
