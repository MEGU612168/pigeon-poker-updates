name: Release Pigeon Poker v1.3.91 strict six-dealt-seat preflop gate

on:
  push:
    paths:
      - "releases/v1.3.91/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify strategy module and all 75 preflop nodes
        shell: bash
        run: |
          set -euo pipefail
          python staging/test_preflop_ranges_75.py

      - name: Build and publish Stable package from verified v1.3.89
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import importlib.util
          import io
          import json
          import pathlib
          import sys
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.90"
          TARGET_VERSION = "1.3.91"
          SOURCE_SHA256 = "092c809552f76684ff8935a6fb5b66896c3c38c003d11605a416a8c2df22cd70"
          SOURCE_SIZE = 264686
          SOURCE_URL = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )
          request = urllib.request.Request(
              SOURCE_URL,
              headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              transport = response.read().decode("ascii").strip()
          payload = base64.b64decode(transport, validate=True)
          if len(payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.90 package size mismatch.")
          if hashlib.sha256(payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.90 package SHA-256 mismatch.")

          EXPECTED_FILES = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("v1.3.90 package ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != EXPECTED_FILES:
              raise SystemExit("Unexpected v1.3.90 package file set.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("v1.3.90 version marker mismatch.")

          main = files["PigeonPoker.pyw"].decode("utf-8")
          if main.count("from pigeon_poker.preflop_screenshot_ranges import choose_preflop_action") != 1:
              raise SystemExit("Existing live CPU import point missing.")
          if main.count("range_decision = choose_preflop_action(") != 1:
              raise SystemExit("Existing live CPU decision hook missing.")

          module_path = "pigeon_poker/preflop_screenshot_ranges.py"
          source_path = pathlib.Path("staging/preflop_screenshot_ranges_75.py")
          test_path = pathlib.Path("staging/test_preflop_ranges_75.py")
          source = source_path.read_text(encoding="utf-8")
          ast.parse(source, filename=module_path)
          ast.parse(test_path.read_text(encoding="utf-8"), filename="test_preflop_ranges_75.py")

          spec = importlib.util.spec_from_file_location("preflop75_release_check", source_path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          summary = module.coverage_summary()
          if summary["node_count"] != 75 or summary["hand_classes_per_node"] != 169:
              raise SystemExit("The packaged preflop strategy is not exactly 75 x 169.")
          data = module._data()
          if summary["hand_rows"] != 12675:
              raise SystemExit("Expected 12,675 node/hand-class rows.")
          raise_nodes = sum(
              1 for node in data["nodes"]
              if any(a["action"] == "raise" and float(a["frequency"]) > 0
                     for actions in node["hands"].values() for a in actions)
          )
          allin_nodes = sum(
              1 for node in data["nodes"]
              if any(a["action"] == "allin" and float(a["frequency"]) > 0
                     for actions in node["hands"].values() for a in actions)
          )
          if raise_nodes != 50 or allin_nodes != 20:
              raise SystemExit(f"Unexpected raise/all-in coverage: {raise_nodes}/{allin_nodes}")

          files[module_path] = source.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")
          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final package ZIP CRC validation failed.")
              if set(archive.namelist()) != EXPECTED_FILES:
                  raise SystemExit("Final package file set changed unexpectedly.")
              if archive.read("VERSION.txt").decode("ascii").strip() != TARGET_VERSION:
                  raise SystemExit("Final package version marker mismatch.")
              ast.parse(archive.read(module_path).decode("utf-8"), filename=module_path)

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(encoded[offset:offset + chunk_size], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "ユーザー提供のGTOWizardスクリーンショットから構成した6-maxプリフロップ75局面をCPU判断へ統合。"
              "各局面169ハンドクラス、合計12,675行。全履歴を照合し、50局面のレイズ先額と20局面の"
              "オールイン分岐を実装。画像の色面積と画面表示アクション比率から推定した重みであり、"
              "ソルバーの生コンボ頻度そのものではない。6席すべて（フォールド済み席も含む）に実際に2枚配られ、100BB開始スタックと確認できない場合は既存CPUへフォールバック。対応履歴では相手の観測済みプリフロップアクションから169クラスの推定レンジを算出し、未対応履歴は未推定として返すAPIを追加。これはスクリーンショット由来の近似レンジで、ソルバーの生コンボ頻度ではない。既存CPUレベル別フォールバックとアプリ内Stable更新を維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "preflop_node_count": summary["node_count"],
              "hand_classes_per_node": summary["hand_classes_per_node"],
              "preflop_hand_rows": summary["hand_rows"],
              "nodes_with_raise_actions": raise_nodes,
              "nodes_with_allin_actions": allin_nodes,
              "source_file": "Pigeon_Preflop_GTOplus_Pio_Import_FULL.zip",
              "frequency_method": summary["method"],
              "source_image_notes": {
                  "uploaded_screenshot_count": 76,
                  "distinct_decision_nodes": 75,
                  "duplicate_screenshot": "Screenshot (53) duplicates Screenshot (51)",
                  "missing_screenshot": "Screenshot (52) was not supplied",
              },
              "runtime_tests": "14 tests passed, including all 12,675 rows, screenshot-total calibration, 100BB gating, six dealt-in seats, and opponent range inference in GitHub Actions",
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (release_dir / "payload.ready").write_text("verified " + TARGET_VERSION + "\n", encoding="ascii")

          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          artifact = dist / f"PigeonPoker_{TARGET_VERSION}_Improved.zip"
          artifact.write_bytes(final_payload)
          with zipfile.ZipFile(artifact, "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Installable ZIP CRC validation failed.")
          (release_dir / "build.request").unlink(missing_ok=True)

          print(json.dumps({
              "published_version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "preflop_nodes": summary["node_count"],
              "hand_classes_per_node": summary["hand_classes_per_node"],
              "hand_rows": summary["hand_rows"],
              "raise_nodes": raise_nodes,
              "allin_nodes": allin_nodes,
              "test_suite": "passed",
          }, ensure_ascii=False))
          PY

      - name: Upload installable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PigeonPoker_1.3.91_SixDealtSeat_Preflop
          path: dist/PigeonPoker_1.3.91_Improved.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish Stable v1.3.91
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.91/
          git commit -m "Release Pigeon Poker v1.3.91 strict six-dealt-seat preflop gate"
          git push
