name: Verify live Pigeon Poker v1.3.80 package and v69 GTO integration

on:
  push:
    paths:
      - "update-diagnostics/v1.3.80.request"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download v1.3.80 using the installed v1.3.79 updater and verify the full package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import io
          import json
          import pathlib
          import sys
          import tempfile
          import zipfile

          updater_path = pathlib.Path("staging/source_1_3_79/pigeon_updater.py")
          if not updater_path.is_file():
              raise SystemExit("The shipped v1.3.79 updater source is missing.")
          sys.path.insert(0, str(updater_path.parent))
          import pigeon_updater as updater

          manifest = updater._fetch_manifest()
          if manifest["version"] != "1.3.80":
              raise SystemExit(f"Stable manifest is {manifest['version']!r}, expected 1.3.80.")
          if updater._version_tuple(manifest["version"]) <= updater._version_tuple("1.3.79"):
              raise SystemExit("The installed v1.3.79 updater does not recognize 1.3.80 as newer.")

          transport_limit = (
              updater.MAX_COMPRESSED_BYTES * 2
              if manifest.get("payload_encoding") == "base64"
              else updater.MAX_COMPRESSED_BYTES
          )
          downloaded = updater._https_get(
              str(manifest["payload_url"]),
              max_bytes=transport_limit,
              timeout=60,
          )
          payload = updater._decode_downloaded_payload(downloaded, manifest)
          if len(payload) != int(manifest["payload_size"]):
              raise SystemExit("Decoded payload size does not match stable.json.")
          digest = hashlib.sha256(payload).hexdigest()
          if digest != manifest["payload_sha256"]:
              raise SystemExit("Decoded payload SHA-256 does not match stable.json.")

          with tempfile.TemporaryDirectory() as td:
              destination = pathlib.Path(td) / "staged"
              extracted = updater._validate_and_extract(payload, manifest, destination)
              if (destination / "VERSION.txt").read_text(encoding="ascii").strip() != "1.3.80":
                  raise SystemExit("Extracted version marker is not 1.3.80.")
              if not {"PigeonPoker.pyw", "pigeon_updater.py"}.issubset(set(extracted)):
                  raise SystemExit("Required root files were not extracted.")

          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("ZIP CRC validation failed.")
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Unexpected full-package file list.")
              files = {name: archive.read(name) for name in archive.namelist()}

          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          main = files["PigeonPoker.pyw"].decode("utf-8")
          required = (
              'self.show_page("gto")',
              "self.after(1200, self._auto_start_gto_plus)",
              'self.gto_host = tk.Frame(host_col, bg="#080f18", height=570)',
              'self.gto_host.pack(fill="both", expand=True, padx=8, pady=8)',
              'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=320)',
              "width=302, yscrollincrement=24,",
              "def _auto_start_gto_plus(self):",
              "self.integration.enable_socket_connection()",
              "self._launch_gto(automatic=True)",
              "def _auto_connect_gto_plus(self, attempt: int = 0):",
              "def _launch_gto(self, automatic: bool = False):",
              "self.integration.launch_and_dock(host_hwnd, startup_timeout=25)",
              "self.integration.connect(timeout=10.0)",
              'elif kind == "auto_gto_connect_retry":',
              '["taskkill", "/PID", str(owned_pid), "/T", "/F"]',
              'text="UP TO DATE"',
          )
          for marker in required:
              if marker not in main:
                  raise SystemExit("Published PigeonPoker.pyw is missing: " + marker)

          # Confirm v1.3.69's three unchanged range/data sources remain byte-identical.
          range_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected in range_blobs.items():
              data = files[name]
              actual = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual != expected:
                  raise SystemExit("v1.3.69 data source changed: " + name)

          probe = files["pigeon_gto_plus/auto_solve_ui.py"].decode("utf-8")
          for marker in (
              "_REFERENCE_SIZE = (695, 570)",
              "_OOP_CLOSE_CENTER = (511, 75)",
              "_RANGE_SOURCE_FIELD_CENTER = (277, 438)",
              "_RANGE_EDITOR_DONE_CENTER = (475, 434)",
          ):
              if marker not in probe:
                  raise SystemExit("GTO+ UI probe calibration is missing: " + marker)

          updater_text = files["pigeon_updater.py"].decode("utf-8")
          if 'subprocess.Popen([executable, str(app_root / "PigeonPoker.pyw")], **kwargs)' not in updater_text:
              raise SystemExit("The update helper does not relaunch the updated Pigeon app.")
          if "while _pid_is_running(parent_pid)" not in updater_text:
              raise SystemExit("The update helper does not wait for the previous Pigeon process.")

          print(json.dumps({
              "installed_updater_version": "1.3.79",
              "stable_version": manifest["version"],
              "download_transport_bytes": len(downloaded),
              "decoded_payload_bytes": len(payload),
              "sha256": digest,
              "updater_download_hash_extract": "passed",
              "zip_crc_and_python_syntax": "passed",
              "v1_3_69_range_sources": "byte-identical",
              "embedded_gto_layout": "v1.3.69 native host retained",
              "connection_column": 320,
              "connection_canvas": 302,
              "auto_start_connect_retry_shutdown": "all source markers present",
              "update_restart_reopens_app": True,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Record verified v1.3.80 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          printf '%s\n' "v1.3.80 passed the shipped v1.3.79 updater download, hash, extraction, syntax, range and GTO lifecycle source checks." > update-diagnostics/v1.3.80.verified
          git add update-diagnostics/v1.3.80.verified
          git commit -m "Verify live Pigeon Poker v1.3.80 package"
          git push
