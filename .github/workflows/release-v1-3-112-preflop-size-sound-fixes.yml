name: Release Pigeon Poker v1.3.112 preflop situation-size restoration

on:
  push:
    paths:
      - "releases/v1.3.112/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run all application, wallet and poker tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile staging/source_1_3_101/PigeonPoker.pyw
          python -m py_compile staging/source_1_3_101/pigeon_updater.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/poker_reasoning.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/cpu_learning.py
          python staging/test_postflop_controls.py
          python staging/test_preflop_user_actions.py
          python staging/test_wallet_bonus.py
          python staging/test_sound_volume_settings.py
          python staging/test_settings_scroll.py
          python staging/test_updater_package_requirements.py
          cp staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py staging/preflop_screenshot_ranges_75.py
          python staging/test_preflop_ranges_75.py
          python staging/test_poker_reasoning.py
          python staging/test_cpu_learning.py

      - name: Build and validate complete updater-compatible Stable v1.3.112 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import importlib.util
          import io
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.111"
          TARGET_VERSION = "1.3.112"

          current_manifest = json.loads(pathlib.Path("stable.json").read_text(encoding="utf-8"))
          if current_manifest.get("version") != SOURCE_VERSION:
              raise SystemExit(
                  f"Expected Stable {SOURCE_VERSION}; found {current_manifest.get('version')}"
              )

          source = pathlib.Path("staging/source_1_3_101")
          app_path = source / "PigeonPoker.pyw"
          updater_path = source / "pigeon_updater.py"
          reasoning_path = source / "pigeon_poker" / "poker_reasoning.py"
          ranges_path = source / "pigeon_poker" / "preflop_screenshot_ranges.py"
          learning_path = source / "pigeon_poker" / "cpu_learning.py"
          for required_path in (app_path, updater_path, reasoning_path, ranges_path, learning_path):
              if not required_path.is_file():
                  raise SystemExit("Missing release source: " + str(required_path))

          app_bytes = app_path.read_bytes()
          updater_bytes = updater_path.read_bytes()
          reasoning_bytes = reasoning_path.read_bytes()
          ranges_bytes = ranges_path.read_bytes()
          learning_bytes = learning_path.read_bytes()
          app_source = app_bytes.decode("utf-8")
          reasoning_source = reasoning_bytes.decode("utf-8")
          ranges_source = ranges_bytes.decode("utf-8")
          learning_source = learning_bytes.decode("utf-8")

          for name, content in (
              ("PigeonPoker.pyw", app_source),
              ("pigeon_updater.py", updater_bytes.decode("utf-8")),
              ("poker_reasoning.py", reasoning_source),
              ("preflop_screenshot_ranges.py", ranges_source),
              ("cpu_learning.py", learning_source),
          ):
              ast.parse(content, filename=name)

          required_app_markers = (
              "_preflop_initial_raise_target",
              "self._preflop_initial_raise_target(",
              "_apply_one_time_10_dollar_bonus",
              "pigeon_poker_v1_3_106_bonus_10_usd",
              "legal = hand.legal_actions(\"hero\")",
              "効果音音量 / EFFECT VOLUME",
              "_preview_master_sound_volume",
              "self._floating_table_bet_action(tid, var)",
              "CPULearningStore",
              "self.cpu_learning_store.record_hand(",
              "opponent_learning=opponent_learning",
              "_apply_preflop_chart_size",
              "preflop_situation_size(table, hand, actor_id)",
              "preflop_situation_size(table, hand, \"hero\")",
              "SIZE = POSITION + PREFLOP RAISE HISTORY (NOT YOUR HAND)",
              "situation_actions = tk.Frame(action_outer",
              'situation_frame, "CHART SIZE"',
              "SIZE = POSITION + PREFLOP RAISE HISTORY (NOT YOUR HAND)",
              "current_hand_key,",
              "preflop_guardrail_used",
              "self._apply_preflop_chart_size(tid)",
              "_attenuated_wav_file",
              "volume_set == 0",
              "0.45 if key not in",
              "CHART SIZE ERROR",
              "$sp=New-Object System.Speech.Synthesis.SpeechSynthesizer",
              "$sp.SpeakAsync($p[1])",
              "$sp.add_SpeakCompleted(",
              "left_canvas = tk.Canvas(",
              "left_canvas.create_window(",
              "self.nested_page_scroll_canvases.add(left_canvas)",
              "left_canvas.configure(scrollregion=left_canvas.bbox(\"all\"))"
          )
          for marker in required_app_markers:
              if marker not in app_source:
                  raise SystemExit("Required app behavior missing: " + marker)
          forbidden_app_markers = (
              "_fixed_preflop_raise_target",
              "PREFLOP CHART ACTIONS ONLY",
              "YOUR TURN • PREFLOP RAISE SIZE FIXED",
              "PREFLOP CHART LINE NOT COVERED",
          )
          for marker in forbidden_app_markers:
              if marker in app_source:
                  raise SystemExit("Forbidden user-action restriction remains: " + marker)

          required_reasoning_markers = (
              "_blocker_removal_metrics",
              "_thin_value_threshold",
              "simulation_multiplier=0.40",
              "calling_station",
              "underbluffer",
              "opponent_range.learned_stats",
              "postflop_call_rate",
              "fold_to_cbet_opportunities",
              "_postflop_board_role_context",
              "_postflop_aggression_gates",
              "_preflop_range_advantage_profile",
              "_range_board_strength_profile",
              "preflop_range_disadvantage",
              "donk_lead",
              "chart-range-top-adv",
              "raise_floor"
          )
          for marker in required_reasoning_markers:
              if marker not in reasoning_source:
                  raise SystemExit("Required bot performance behavior missing: " + marker)
          if "def preflop_situation_size(" not in ranges_source or "def _node_for_situation_size(" not in ranges_source:
              raise SystemExit("Missing position/history-only preflop sizing resolver")
          if "node_id = _node_for_situation_size(table, hand, str(actor_id))" not in ranges_source:
              raise SystemExit("Human size helper must bypass only the BOT 100-BB stack gate")
          if 'if frequency <= 0.0 or action != "raise":' not in ranges_source:
              raise SystemExit("Situation-size presets must exclude all-in actions")
          for marker in (
              "unblocked_hand_class_probabilities",
              "opponent_profiles",
              "opponent_learning",
              "learned_behavior",
              "learned_archetype",
              "three_bet_rate",
              "learned_archetype_basis",
          ):
              if marker not in ranges_source:
                  raise SystemExit("Required opponent-range information missing: " + marker)

          files = {
              "PigeonPoker.pyw": app_bytes,
              "pigeon_updater.py": updater_bytes,
              "VERSION.txt": (TARGET_VERSION + "\n").encode("ascii"),
              "pigeon_poker/poker_reasoning.py": reasoning_bytes,
              "pigeon_poker/preflop_screenshot_ranges.py": ranges_bytes,
              "pigeon_poker/cpu_learning.py": learning_bytes,
          }

          output = io.BytesIO()
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          payload = output.getvalue()
          digest = hashlib.sha256(payload).hexdigest()

          # Run the exact installed updater's member validation/extraction
          # against this five-file package, including both allowed Python modules.
          spec = importlib.util.spec_from_file_location(
              "pigeon_updater_v1_3_106_validation", updater_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load the shipped updater for validation.")
          updater = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = updater
          spec.loader.exec_module(updater)
          validator_manifest = {
              "version": TARGET_VERSION,
              "payload_size": len(payload),
              "payload_sha256": digest,
              "package_mode": "full",
          }
          with tempfile.TemporaryDirectory() as tmp:
              extracted = updater._validate_and_extract(
                  payload, validator_manifest, pathlib.Path(tmp) / "stage"
              )
          if set(extracted) != set(files):
              raise SystemExit("Updater extracted a different file set: " + repr(extracted))

          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final package CRC failure.")
              if set(archive.namelist()) != set(files):
                  raise SystemExit("Unexpected archive members.")
              for name, expected in files.items():
                  if archive.read(name) != expected:
                      raise SystemExit("Package content mismatch: " + name)

          encoded = base64.b64encode(payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          (release_dir / "payload.part-000").write_text(encoded, encoding="ascii")
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": ["payload.part-000"]}, indent=2) + "\n",
              encoding="utf-8",
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "ポストフロップの操作欄を全ストリート共通の合法アクションUIへ統一し、"
              "CHECK/CALL/FOLD、BET/RAISE、金額入力、スライダー、ポット割合プリセットを復旧。"
              "プリフロップではアクションもレイズ額も一切固定せず、局面に対応した75ノード表の"
              "レイズサイズを入力欄・スライダーの初期値として提案するだけに変更。"
              "初期値はユーザーが自由に上書き可能。ポット履歴の送信金額は上書きしない。"
              "共有ウォレットへ一度だけ10ドルを加算し、SQLite取引履歴と重複防止マーカーを"
              "同一トランザクションで記録。効果音音量の自動保存と試聴も維持。"
              "BOTは相手別アーキタイプ、アクション履歴によるレンジ更新、ブロッカーで"
              "除去されるバリュー/ブラフコンボ、コールオッズ、マルチウェイEV、薄いバリュー"
              "ベット、相手別コール傾向、ベットサイズのEV比較を改善。候補サイズ計算の"
              "シミュレーション予算を分離して処理負荷を抑制。さらにフロップでは相手別の"
              "CBETに対するフォールド率を一般的な対ベット率と標本数でブレンドし、"
              "CBET局面の継続率へ反映。十分な3ベット/4ベット機会がある相手はその実測率も"
              "攻撃的な相手の識別に使う。プリフロップの固定チャート自体は変更しない。"
              "さらにCPU個体別にVPIP、PFR、"
              "3ベット/4ベット傾向、対ベットフォールド率、ポストフロップ攻撃/コール率、"
              "CBET関連頻度をレート別SQLiteへ永続保存し、十分な標本数で性格判定と"
              "アクションレンジ/コール反応確率へ反映。二重計上防止と低標本時の平滑化を追加。"
              "プリフロップ75局面・"
              "12,675行・頻度・BBサイズ表は変更なし。"
              "ユーザーがプリフロップでチャート外のサイズを選択した後は、"
              "未対応履歴を一般的なレンジ推論へ流さず、明示的な保守ガードレールへ固定。"
              "プリフロップのBET/RAISE入力欄に、その局面のチャートサイズを再入力する"
              "CHART SIZEボタンを追加。押下時にハンド履歴と合法額を再検証し、"
              "ユーザーのアクションや金額を拘束しない。新しいハンドごとにチャート初期値を再読込。"
              "Windowsのアクション音声は発話ごとに独立したSpeechSynthesizerを生成し、"
              "読み上げ中の次のアクション音声を重ねて再生可能にする。"
              "ポストフロップではプリフロップ最終レイザーとフロップのボード構造を使い、"
              "ローコネクテッド/ウェットボードでのレンジ不利を判定。レンジ不利時の薄いレイズ"
              "は、コールされた場合のエクイティ要求値を引き上げて抑制し、セミブラフレイズは"
              "実際の強いドローがある場合に限定。相手のプリフロップレイザーが未行動で後ろに"
              "残るフロップのドンクベットは、HUでは2ペア以上または強いコンボドロー、"
              "マルチウェイではセット以上または例外的な強いドローに限定。"
              "チャート対応局面では各プレイヤーの75局面プリフロップレンジを復元し、"
              "ボード上の平均強度・上位10%強度・ツーペア以上密度を比較してレンジ不利を判定。"
              "ユーザーのカスタムサイズ等でチャート履歴が対応しない場合のみ、"
              "プリフロップ最終レイザーとボード構造による保守的ヒューリスティックへフォールバック。"
              "このローカルEVモデルはソルバー完全再現ではない。"
              "プリフロップのCHART SIZEボタンを独立した専用行へ移し、"
              "対応するレイズ局面では必ず表示。サイズはハンドクラスを参照せず、"
              "ポジションとプリフロップの全アクション/レイズサイズ履歴から一致する"
              "75ノードを特定し、そのノード全体の物理コンボ加重の最頻サイズを選択。"
              "ユーザーの手札・アクション・入力金額は変更/固定しない。"
              "この操作補助はユーザー本人の手動入力専用であり、BOTの判断には適用しない。"
              "BOTは従来どおり各自のハンドクラスと75ノードのレンジ別アクション頻度に従う。"
              "オールインは通常レイズサイズの候補へ混ぜず、独立した戦略アクションとして維持。"
              "チャート外の局面では入力金額を変更せず、非対応を画面に表示。"
              "設定画面の左カラムに専用スクロール領域を追加し、マスター音量と個別音量"
              "スライダーまでマウスホイールで確実にスクロール可能にする。"
          )
          notes += (" v1.3.112: The manual CHART SIZE lookup now resolves solely from position and preflop action/raise history; it no longer rejects a valid line just because the current stacks are not exactly 100 BB. BOT strategy retains its separate 100-BB chart gate. The button now reports applied size, unsupported history, illegal size, or an actual error instead of silently doing nothing. Fresh-install master effects default to 50%, ordinary effects are trimmed, and card-deal/card-land cues receive a stronger trim. The winsound fallback now plays a PCM-attenuated WAV at the requested volume, and the MCI path only plays the original clip after its per-stream volume command succeeds.")
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(payload),
              "source_version": SOURCE_VERSION,
              "files": sorted(files),
              "updater_contract_validated_with_installed_code": True,
              "updater_actual_extract_validation": "passed",
              "additional_allowed_poker_modules": True,
              "postflop_shared_action_ui_restored": True,
              "preflop_actions_unrestricted": True,
              "preflop_raise_size_editable_initial_suggestion_only": True,
              "preflop_chart_size_button_preflop_only": True,
              "preflop_chart_size_button_revalidates_live_context": True,
              "preflop_size_lookup_position_history_only": True,
              "preflop_size_lookup_stack_gate_separate_from_bot": True,
              "preflop_size_button_reports_outcomes": True,
              "card_deal_effect_default_trimmed": True,
              "windows_winsound_fallback_attenuates_pcm": True,
              "preflop_new_hand_reloads_chart_initial_size": True,
              "preflop_unmapped_history_uses_guardrail_not_range_policy": True,
              "windows_action_voice_uses_overlapping_speech_instances": True,
              "bot_postflop_range_disadvantage_guard": True,
              "bot_postflop_raise_requires_stronger_called_equity": True,
              "bot_postflop_donk_leads_restricted_to_strong_value_or_draws": True,
              "bot_postflop_uses_chart_derived_preflop_range_advantage": True,
              "bot_postflop_uses_texture_fallback_for_unmatched_lines": True,
              "settings_sound_controls_nested_scrollable": True,
              "settings_sound_volume_scroll_tests": "passed",
              "preflop_chart_policy_data_immutable": True,
              "preflop_75_node_policy_immutable": True,
              "preflop_12675_hand_rows_immutable": True,
              "preflop_chart_frequencies_immutable": True,
              "preflop_chart_bb_sizes_immutable": True,
              "wallet_bonus_cents": 1000,
              "wallet_bonus_exactly_once": True,
              "wallet_bonus_transaction_audited": True,
              "effect_volume_settings_preserved": True,
              "bot_opponent_archetypes": True,
              "bot_action_conditioned_ranges": True,
              "bot_blocker_removal_metrics": True,
              "bot_multiway_range_equity": True,
              "bot_thin_value_thresholds": True,
              "bot_bet_sizing_ev_comparison": True,
              "bot_candidate_simulation_budget_control": True,
              "bot_persistent_per_cpu_learning": True,
              "bot_behavior_rates_smoothed_by_sample_size": True,
              "cpu_learning_store_tests": "passed",
              "bot_flop_fold_to_cbet_adaptation": True,
              "bot_three_bet_rate_style_classification": True,
              "bot_cbet_and_three_bet_profile_tests": "passed",
              "postflop_ui_regression_tests": "passed",
              "preflop_user_action_tests": "passed",
              "wallet_bonus_exact_once_tests": "passed",
              "sound_volume_ui_regression_tests": "passed",
              "updater_package_contract_tests": "passed",
              "preflop_75_node_regression_tests": "passed",
              "range_and_blocker_reasoning_tests": "passed",
              "package_ast_sha_crc": "passed",
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", "stable.json", str(release_dir)], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.112 action UI and advanced policy"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "files": sorted(files),
              "payload_sha256": digest,
              "updater_actual_validator": "passed",
              "preflop_user_actions_restricted": False,
              "preflop_raise_size_is_initial_suggestion_only": True,
              "postflop_shared_action_ui": True,
              "wallet_bonus_once_cents": 1000,
              "bot_blocker_and_value_upgrades": True,
              "preflop_chart_modified": False,
          }, ensure_ascii=False, indent=2))
          PY
