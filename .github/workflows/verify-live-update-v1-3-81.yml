name: Verify live Pigeon Poker v1.3.81 permission recovery package

on:
  push:
    paths:
      - "update-diagnostics/v1.3.81.request"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify v1.3.81 using the shipped v1.3.80 updater
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import sys
          import tempfile
          import zipfile

          updater_path = pathlib.Path("staging/source_1_3_80/pigeon_updater.py")
          if not updater_path.is_file():
              raise SystemExit("The exact shipped v1.3.80 updater source is missing.")
          sys.path.insert(0, str(updater_path.parent))
          import pigeon_updater as updater

          manifest = updater._fetch_manifest()
          if manifest["version"] != "1.3.81":
              raise SystemExit(f"stable.json reports {manifest['version']!r}, not 1.3.81.")
          if updater._version_tuple(manifest["version"]) <= updater._version_tuple("1.3.80"):
              raise SystemExit("The shipped v1.3.80 updater does not treat v1.3.81 as newer.")

          limit = (
              updater.MAX_COMPRESSED_BYTES * 2
              if manifest.get("payload_encoding") == "base64"
              else updater.MAX_COMPRESSED_BYTES
          )
          downloaded = updater._https_get(
              str(manifest["payload_url"]), max_bytes=limit, timeout=60,
          )
          payload = updater._decode_downloaded_payload(downloaded, manifest)
          if len(payload) != int(manifest["payload_size"]):
              raise SystemExit("Decoded payload size differs from stable.json.")
          digest = hashlib.sha256(payload).hexdigest()
          if digest != manifest["payload_sha256"]:
              raise SystemExit("Payload SHA-256 differs from stable.json.")

          with tempfile.TemporaryDirectory() as td:
              destination = pathlib.Path(td) / "staged"
              extracted = updater._validate_and_extract(payload, manifest, destination)
              if (destination / "VERSION.txt").read_text(encoding="ascii").strip() != "1.3.81":
                  raise SystemExit("The extracted version marker is not 1.3.81.")
              if not {"PigeonPoker.pyw", "pigeon_updater.py"}.issubset(set(extracted)):
                  raise SystemExit("The updater did not extract the required root files.")

          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("ZIP CRC verification failed.")
              expected_files = {
                  "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
                  "pigeon_gto_plus/auto_solve_ui.py",
                  "pigeon_gto_plus/live_range_builder.py",
                  "pigeon_gto_plus/ui_probe.py",
                  "pigeon_poker/preflop_screenshot_ranges.py",
              }
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Unexpected v1.3.81 package file set.")

              main = archive.read("PigeonPoker.pyw").decode("utf-8")
              required = (
                  "from pigeon_gto_plus import (PigeonGTOPlusIntegration, StrategyStore, GTOPlusIntegrationError,",
                  "if isinstance(exc, WindowPermissionError):",
                  "self._restart_pigeon_elevated_for_gto(int(process.pid))",
                  "def _restart_pigeon_elevated_for_gto(self, process_id: int):",
                  "shell32.ShellExecuteW(",
                  "None, 'runas', str(Path(sys.executable).resolve()), parameters,",
                  "self._gto_handoff_in_progress = True",
                  "and not self._gto_handoff_in_progress",
                  "app._gto_auto_start_started = True",
                  "self.integration.attach_existing_and_dock(",
                  "self.gto_owned_process_pid = int(process_id)",
                  "self.after(1800, self._auto_connect_gto_plus)",
                  "self.after(1200, self._auto_start_gto_plus)",
                  'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=320)',
                  "width=302, yscrollincrement=24,",
                  'text="UP TO DATE"',
              )
              for marker in required:
                  if marker not in main:
                      raise SystemExit("PigeonPoker.pyw is missing required recovery marker: " + marker)

              launch_start = main.find("    def _launch_gto(self, automatic: bool = False):")
              attach_start = main.find("    def _restart_pigeon_elevated_for_gto(", launch_start)
              if launch_start < 0 or attach_start < 0:
                  raise SystemExit("Could not isolate the GTO launch handler.")
              launch_block = main[launch_start:attach_start]
              if "messagebox.askyesno(" in launch_block:
                  raise SystemExit("An app-generated GTO yes/no permission prompt remains.")

              range_files = {
                  "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
                  "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
                  "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
              }
              for name, expected_blob in range_files.items():
                  data = archive.read(name)
                  actual_blob = hashlib.sha1(
                      b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
                  ).hexdigest()
                  if actual_blob != expected_blob:
                      raise SystemExit("The v1.3.69 range baseline changed: " + name)

              for name in expected_files:
                  if name.endswith(".py") or name.endswith(".pyw"):
                      compile(archive.read(name), name, "exec")

              app_updater = archive.read("pigeon_updater.py").decode("utf-8")
              if 'subprocess.Popen([executable, str(app_root / "PigeonPoker.pyw")], **kwargs)' not in app_updater:
                  raise SystemExit("The updater does not restart the updated Pigeon application.")
              if "while _pid_is_running(parent_pid)" not in app_updater:
                  raise SystemExit("The updater does not wait for the previous Pigeon process.")

          print(json.dumps({
              "installed_version": "1.3.80",
              "stable_version": manifest["version"],
              "transport_bytes": len(downloaded),
              "decoded_package_bytes": len(payload),
              "sha256": digest,
              "download_decode_hash_extract": "passed",
              "zip_crc_python_syntax": "passed",
              "v1_3_69_permission_recovery": "restored",
              "pigeon_yes_no_prompt": False,
              "windows_uac_may_be_required": True,
              "same_gto_pid_handoff": True,
              "duplicate_autostart_prevented": True,
              "auto_connect_after_reattach": True,
              "v1_3_69_range_files": "byte-identical",
              "workspace_right_column": 320,
              "workspace_canvas": 302,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Record live v1.3.81 package verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          printf '%s\n' "v1.3.81 passed v1.3.80 updater download, hash, ZIP, syntax, GTO permission-recovery, PID handoff and range checks." > update-diagnostics/v1.3.81.verified
          git add update-diagnostics/v1.3.81.verified
          git commit -m "Verify live Pigeon Poker v1.3.81 permission recovery"
          git push
