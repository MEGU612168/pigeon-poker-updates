name: Release Pigeon Poker v1.3.95 strict chart-only preflop runtime

on:
  push:
    paths:
      - "releases/v1.3.95/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify chart-only preflop policy
        shell: bash
        run: |
          set -euo pipefail
          python staging/test_preflop_ranges_75.py
          python - <<'PY'
          import ast
          from pathlib import Path
          module = Path("staging/preflop_screenshot_ranges_75.py").read_text(encoding="utf-8")
          tests = Path("staging/test_preflop_ranges_75.py").read_text(encoding="utf-8")
          ast.parse(module, filename="preflop_screenshot_ranges_75.py")
          tree = ast.parse(tests, filename="test_preflop_ranges_75.py")
          count = sum(1 for n in tree.body if isinstance(n, ast.FunctionDef) and n.name.startswith("test_"))
          if count < 21:
              raise SystemExit(f"Expected >=21 preflop regression tests, found {count}")
          if "DEVIATION_BY_LEVEL" in module or "cpu.level" in module:
              raise SystemExit("CPU-level preflop deviation remains.")
          chooser = module[module.index("def choose_preflop_action"):module.index("def coverage_summary")]
          if "_choose_preflop_action_from_chart(table, hand, actor_id, cpu, None)" not in chooser:
              raise SystemExit("Public preflop chooser is not chart-only.")
          print(f"Mechanical preflop module PASS; {count} tests.")
          PY

      - name: Build Stable v1.3.95 from exact v1.3.94
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import subprocess
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.94"
          TARGET_VERSION = "1.3.95"
          SOURCE_SHA256 = "e9461f28b6552e89821ae6f48378707cc1bda9e43e286ed92a312684819102ba"
          SOURCE_SIZE = 265661
          url = (
              f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/"
              f"payload-updater.zip.b64?v={SOURCE_SHA256}"
          )
          request = urllib.request.Request(
              url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              transport = response.read().decode("ascii").strip()
          source_payload = base64.b64decode(transport, validate=True)
          if len(source_payload) != SOURCE_SIZE:
              raise SystemExit("Pinned v1.3.94 package size mismatch.")
          if hashlib.sha256(source_payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.94 package SHA-256 mismatch.")

          expected_files = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(source_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("v1.3.94 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.94 package file layout.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned source VERSION.txt mismatch.")

          main = files["PigeonPoker.pyw"].decode("utf-8")
          old_block = (
              "                    fallback_decision = None\n"
              "                    if not (session is not None and session.hand_token == id(hand) and session.context is not None):\n"
              "                        fallback_decision = cpu.choose_action(hand, pid)\n"
              "                        if hand.street == \"preflop\":\n"
              "                            try:\n"
              "                                range_decision = choose_preflop_action(\n"
              "                                    table, hand, pid, cpu, fallback_decision)\n"
              "                                if range_decision is not None:\n"
              "                                    fallback_decision = range_decision\n"
              "                            except Exception as range_exc:\n"
              "                                self.jobs.put((\"cash_cpu_range_warning\", {\n"
              "                                    \"table_id\": table_id, \"error\": str(range_exc)}))\n"
          )
          new_block = (
              "                    fallback_decision = None\n"
              "                    if hand.street == \"preflop\":\n"
              "                        # Preflop is a mechanical chart lookup. CPU level is not consulted.\n"
              "                        # Never fall back to an untrained legacy action such as a limp.\n"
              "                        try:\n"
              "                            range_decision = choose_preflop_action(table, hand, pid, cpu, None)\n"
              "                        except Exception as range_exc:\n"
              "                            raise RuntimeError(\n"
              "                                \"Preflop chart failed; legacy CPU fallback is disabled: \" + str(range_exc)\n"
              "                            ) from range_exc\n"
              "                        if range_decision is None:\n"
              "                            raise RuntimeError(\n"
              "                                f\"Preflop chart coverage missing for {actor_name} ({pid}); \"\n"
              "                                \"refusing to invent a non-chart action.\"\n"
              "                            )\n"
              "                        fallback_decision = range_decision\n"
              "                    elif not (session is not None and session.hand_token == id(hand) and session.context is not None):\n"
              "                        # Postflop retains the CPU-level policy.\n"
              "                        fallback_decision = cpu.choose_action(hand, pid)\n"
          )
          if main.count(old_block) != 1:
              raise SystemExit(
                  "Expected exactly one live CPU decision block in v1.3.94; "
                  f"found {main.count(old_block)}. Do not patch an unrecognised runtime."
              )
          main = main.replace(old_block, new_block, 1)
          if main.count("range_decision = choose_preflop_action(") != 1:
              raise SystemExit("Expected one chart decision hook after runtime patch.")
          if main.count("fallback_decision = cpu.choose_action(hand, pid)") != 1:
              raise SystemExit("Expected one remaining CPU-level decision site for postflop only.")
          if "Preflop chart coverage missing" not in main:
              raise SystemExit("Strict preflop fail-closed guard missing.")
          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")

          module_path = "pigeon_poker/preflop_screenshot_ranges.py"
          module_source = pathlib.Path("staging/preflop_screenshot_ranges_75.py").read_text(encoding="utf-8")
          ast.parse(module_source, filename=module_path)
          if "DEVIATION_BY_LEVEL" in module_source:
              raise SystemExit("Preflop module still has level-based deviation.")
          files[module_path] = module_source.encode("utf-8")

          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final ZIP CRC failure: " + bad)
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final package file set mismatch.")
              packaged_main = archive.read("PigeonPoker.pyw").decode("utf-8")
              packaged_module = archive.read(module_path).decode("utf-8")
              ast.parse(packaged_main, filename="PigeonPoker.pyw")
              ast.parse(packaged_module, filename=module_path)
              if "Preflop chart coverage missing" not in packaged_main:
                  raise SystemExit("Fail-closed preflop runtime patch missing from package.")
              if "DEVIATION_BY_LEVEL" in packaged_module:
                  raise SystemExit("Preflop deviation logic found in final package.")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          parts = []
          for index, offset in enumerate(range(0, len(encoded), 48000)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(encoded[offset:offset + 48000], encoding="ascii")
              parts.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": parts}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "プリフロップは全CPUレベル共通で、スクリーンショット由来の75局面・12,675ハンドクラスを機械的に実行。"
              "プリフロップでは旧CPUの判断・レベル別逸脱を一切使用せず、対応局面が見つからない場合も未学習の行動を実行せず停止。"
              "CPUレベルの差はポストフロップのみ。50局面のレイズ先額、20局面のオールイン分岐、"
              "100BB・6人配札ガード、ブロッカー補正付き相手レンジ推定、GTO+ ENGINEを通常利用経路から外した状態を維持。"
              "スクリーンショットの頻度は169ハンドクラスの近似であり、ソルバー生コンボ頻度ではない。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "preflop_node_count": 75,
              "hand_classes_per_node": 169,
              "preflop_hand_rows": 12675,
              "nodes_with_raise_actions": 50,
              "nodes_with_allin_actions": 20,
              "preflop_mechanical_all_cpu_levels": True,
              "legacy_cpu_preflop_fallback": False,
              "preflop_uncovered_spot_behavior": "stop_without_executing_an_untrained_action",
              "cpu_level_differences_apply_to": ["postflop"],
              "opponent_range_blocker_adjustment": True,
              "gto_plus_engine_removed_from_runtime": True,
              "regression_test_count": 21,
              "regression_tests": "Passed in GitHub Actions; package AST/CRC and live runtime patch checks",
              "frequency_method": "screenshot-colour-area estimated hand-class frequencies calibrated to displayed action totals; not solver-exact combo frequencies",
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          pathlib.Path("dist").mkdir(exist_ok=True)
          artifact = pathlib.Path("dist") / f"PigeonPoker_{TARGET_VERSION}.zip"
          artifact.write_bytes(final_payload)
          with zipfile.ZipFile(artifact, "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Installable ZIP validation failed.")
          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", "stable.json", str(release_dir)], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.95 strict chart-only preflop runtime"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "sha256": digest,
              "size": len(final_payload),
              "chart_only_preflop": True,
              "no_legacy_preflop_fallback": True,
              "postflop_cpu_levels_preserved": True,
          }, ensure_ascii=False, indent=2))
          PY
