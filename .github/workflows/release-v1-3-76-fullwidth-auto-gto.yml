name: Release Pigeon Poker v1.3.76 full-width GTO+ and automatic lifecycle

on:
  push:
    paths:
      - "releases/v1.3.76/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch the v1.3.69 baseline with only the requested workspace and lifecycle fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile

          repo = "MEGU612168/pigeon-poker-updates"
          source_version = "1.3.75"
          target_version = "1.3.76"
          source_sha256 = "d6cdaa1cad24949f3a81938b96e6b7ba87199d3a85b22fc4240afc50b1757ce1"
          source_size = 221684
          source_url = (
              f"https://raw.githubusercontent.com/{repo}/main/releases/v{source_version}/"
              f"payload-updater.zip.b64?v={source_sha256}"
          )
          with urllib.request.urlopen(source_url, timeout=90) as response:
              encoded = response.read().decode("ascii").strip()
          source_payload = base64.b64decode(encoded, validate=True)
          if len(source_payload) != source_size:
              raise SystemExit("Pinned v1.3.75 package size mismatch.")
          if hashlib.sha256(source_payload).hexdigest() != source_sha256:
              raise SystemExit("Pinned v1.3.75 package SHA-256 mismatch.")

          with zipfile.ZipFile(io.BytesIO(source_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Pinned v1.3.75 ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.75 package file set.")
          if files["VERSION.txt"].decode("ascii").strip() != source_version:
              raise SystemExit("Pinned v1.3.75 VERSION.txt mismatch.")

          # Preserve the three v1.3.69 range sources byte-for-byte.
          range_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected_blob in range_blobs.items():
              data = files[name]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise SystemExit("v1.3.69 range baseline mismatch: " + name)

          main = files["PigeonPoker.pyw"].decode("utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}.")
              return source.replace(old, new, 1)

          # Use the full content width for the native GTO+ child. Keep all
          # existing controls available, but collapse them below the workspace.
          old_layout = (
              '        row = tk.Frame(page, bg=COLORS["bg"])\n'
              '        row.pack(fill="both", expand=True, padx=22, pady=(0, 20))\n'
              '        host_col = tk.Frame(row, bg=COLORS["panel"], highlightbackground=COLORS["border"], highlightthickness=1)\n'
              '        host_col.pack(side="left", fill="both", expand=True)\n'
          )
          new_layout = (
              '        row = tk.Frame(page, bg=COLORS["bg"])\n'
              '        row.pack(fill="both", expand=True, padx=22, pady=(0, 8))\n'
              '        host_col = tk.Frame(row, bg=COLORS["panel"], highlightbackground=COLORS["border"], highlightthickness=1)\n'
              '        host_col.pack(fill="both", expand=True)\n'
          )
          main = replace_once(main, old_layout, new_layout, "full-width GTO+ host layout")

          old_controls_outer = (
              '        controls_outer = tk.Frame(row, bg=COLORS["bg"], width=350)\n'
              '        controls_outer.pack(side="right", fill="y", padx=(12, 0))\n'
              '        controls_outer.pack_propagate(False)\n'
              '        controls_canvas = tk.Canvas(\n'
              '            controls_outer, bg=COLORS["bg"], highlightthickness=0,\n'
              '            width=332, yscrollincrement=24,\n'
              '        )\n'
          )
          new_controls_outer = (
              '        controls_outer = tk.Frame(page, bg=COLORS["bg"], height=300)\n'
              '        controls_outer.pack_propagate(False)\n'
              '        controls_toggle = ttk.Button(page, text="GTO+操作パネルを表示")\n'
              '        controls_toggle.pack(fill="x", padx=22, pady=(0, 6), before=row)\n'
              '        controls_canvas = tk.Canvas(\n'
              '            controls_outer, bg=COLORS["bg"], highlightthickness=0,\n'
              '            height=280, yscrollincrement=24,\n'
              '        )\n'
          )
          main = replace_once(main, old_controls_outer, new_controls_outer, "collapsible GTO+ controls panel")

          old_page_end = (
              '        ttk.Button(db, text="Pigeon Pokerテーブルへ戻る", command=lambda: self.show_page("table")).pack(fill="x", pady=(10, 0))\n'
              '\n'
              '    def _build_placeholder_pages(self):\n'
          )
          new_page_end = (
              '        ttk.Button(db, text="Pigeon Pokerテーブルへ戻る", command=lambda: self.show_page("table")).pack(fill="x", pady=(10, 0))\n'
              '\n'
              '        def _toggle_gto_controls():\n'
              '            if controls_outer.winfo_manager():\n'
              '                controls_outer.pack_forget()\n'
              '                controls_toggle.configure(text="GTO+操作パネルを表示")\n'
              '            else:\n'
              '                controls_outer.pack(fill="x", padx=22, pady=(0, 16))\n'
              '                controls_toggle.configure(text="GTO+操作パネルを閉じる")\n'
              '            self.after_idle(lambda: self._sync_embedded_gto_geometry("controls-toggle"))\n'
              '\n'
              '        controls_toggle.configure(command=_toggle_gto_controls)\n'
              '\n'
              '    def _build_placeholder_pages(self):\n'
          )
          main = replace_once(main, old_page_end, new_page_end, "collapsible controls toggle wiring")

          # Record explicit ownership so Pigeon can close the exact GTO+ process
          # it started, including the one left behind by the previous 1.3.75 app.
          old_gto_state = '        self.gto_embedded = False\\n'
          new_gto_state = (
              '        self.gto_embedded = False\\n'
              '        self.gto_launched_by_pigeon = False\\n'
              '        self.gto_owned_pid: int | None = None\\n'
              '        self._gto_auto_start_finished = False\\n'
              '        self._gto_auto_connect_inflight = False\\n'
          )
          main = replace_once(main, old_gto_state, new_gto_state, "GTO+ ownership state")

          startup_old = (
              '        self._build_pokercraft_page()\\n'
              '        self.show_page("lobby")\\n'
              '        self.protocol("WM_DELETE_WINDOW", self._on_close)\\n'
          )
          startup_new = (
              '        self._build_pokercraft_page()\\n'
              '        self.show_page("gto")\\n'
              '        self.after(350, self._auto_start_gto_plus)\\n'
              '        self.protocol("WM_DELETE_WINDOW", self._on_close)\\n'
          )
          main = replace_once(main, startup_old, startup_new, "automatic GTO+ startup page")

          # Remove the old app-generated UAC/elevation approval prompt. GTO+
          # starts at the same privilege level as Pigeon; if Windows itself
          # blocks native docking, show a passive status instead of prompting.
          launch_start = main.find("    def _launch_gto(self):\\n")
          connect_start = main.find("    def _connect_gto(self):\\n", launch_start)
          if launch_start < 0 or connect_start < 0:
              raise SystemExit("Could not locate the GTO+ launch/attach methods.")
          if main.count("    def _launch_gto(self):\\n") != 1:
              raise SystemExit("GTO+ launch method is not unique.")

          lifecycle_methods = "    def _find_existing_gto_process_id(self) -> int | None:\n        \"\"\"Find one exact configured GTO+ process so an update cannot create a duplicate.\"\"\"\n        if os.name != \"nt\":\n            return None\n        expected = Path(self.executable_var.get().strip()).expanduser().resolve()\n        if not expected.is_file():\n            raise FileNotFoundError(f\"GTO+ executable not found: {expected}\")\n        listed = subprocess.run(\n            [\"tasklist\", \"/FI\", f\"IMAGENAME eq {expected.name}\", \"/FO\", \"CSV\", \"/NH\"],\n            check=False, capture_output=True, text=True, encoding=\"utf-8\",\n            errors=\"replace\", timeout=10,\n            creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0),\n        )\n        candidate_pids: set[int] = set()\n        for line in (listed.stdout or \"\").splitlines():\n            fields = line.strip().strip('\"').split('\",\" '.strip())\n            if len(fields) >= 2 and fields[1].isdigit():\n            fields = line.strip().strip('\"').split('\",\" '.strip())\n        if not candidate_pids:\n            return None\n        kernel32 = ctypes.WinDLL(\"kernel32\", use_last_error=True)\n        open_process = kernel32.OpenProcess\n        open_process.argtypes = [ctypes.c_uint32, ctypes.c_int, ctypes.c_uint32]\n        open_process.restype = ctypes.c_void_p\n        query_image = kernel32.QueryFullProcessImageNameW\n        query_image.argtypes = [ctypes.c_void_p, ctypes.c_uint32, ctypes.POINTER(ctypes.c_wchar), ctypes.POINTER(ctypes.c_uint32)]\n        query_image.restype = ctypes.c_int\n        close_handle = kernel32.CloseHandle\n        close_handle.argtypes = [ctypes.c_void_p]\n        close_handle.restype = ctypes.c_int\n        expected_key = os.path.normcase(str(expected))\n        matches: list[int] = []\n        unverified: list[int] = []\n        for pid in sorted(candidate_pids):\n            handle = open_process(0x1000, 0, int(pid))\n            if not handle:\n                unverified.append(pid)\n                continue\n            try:\n                image_path = ctypes.create_unicode_buffer(32768)\n                image_size = ctypes.c_uint32(len(image_path))\n                if not query_image(handle, 0, image_path, ctypes.byref(image_size)):\n                    unverified.append(pid)\n                    continue\n                actual_key = os.path.normcase(str(Path(image_path.value).resolve()))\n                if actual_key == expected_key:\n                    matches.append(pid)\n            except (OSError, ValueError):\n                unverified.append(pid)\n            finally:\n                close_handle(handle)\n        if len(matches) > 1:\n            raise RuntimeError(\"同じGTO+実行ファイルが複数起動しています。重複起動を防ぐため自動接続を停止しました。\")\n        if unverified:\n            raise RuntimeError(\"既存GTO+の実行ファイルを確認できません。重複起動を防ぐため自動起動を停止しました。\")\n        return matches[0] if matches else None\n\n    def _auto_start_gto_plus(self):\n        \"\"\"Start or reattach GTO+ after the full-width native host is mapped.\"\"\"\n        if self._gto_auto_start_finished:\n            return\n        try:\n            self.update_idletasks()\n            if (not self.gto_host.winfo_ismapped()\n                    or self.gto_host.winfo_width() < 250\n                    or self.gto_host.winfo_height() < 180):\n                self.after(250, self._auto_start_gto_plus)\n                return\n            self._save_connection_config()\n            try:\n                self.integration.enable_socket_connection()\n            except Exception as socket_exc:\n                self.status_var.set(f\"GTO+ソケット自動設定: {socket_exc}\")\n            existing_pid = self._find_existing_gto_process_id()\n            self._gto_auto_start_finished = True\n            if existing_pid is not None:\n                self._attach_existing_gto(existing_pid, automatic=True)\n            else:\n                self._launch_gto(automatic=True)\n        except Exception as exc:\n            self.status_var.set(f\"GTO+自動起動準備失敗: {type(exc).__name__}: {exc}\")\n\n    def _launch_gto(self, automatic: bool = False):\n        try:\n            self._save_connection_config()\n            self.update_idletasks()\n            host_hwnd = int(self.gto_host.winfo_id())\n            hwnd = self.integration.launch_and_dock(host_hwnd, startup_timeout=25)\n            process = getattr(self.integration, \"process\", None)\n            if process is not None:\n                try:\n                    self.gto_owned_pid = int(process.pid)\n                    self.gto_launched_by_pigeon = True\n                except Exception:\n                    self.gto_owned_pid = None\n            self.gto_embedded = True\n            self.status_var.set(f\"GTO+をPigeon内に表示中 (HWND {hwnd})\")\n            self._schedule_embedded_gto_geometry_sync(\"launch\")\n            self.after(1800, lambda: self._connect_gto(automatic=True))\n        except Exception as exc:\n            process = getattr(self.integration, \"process\", None)\n            try:\n                still_running = process is not None and process.poll() is None\n            except Exception:\n                still_running = process is not None\n            if still_running:\n                try:\n                    self.gto_owned_pid = int(process.pid)\n                    self.gto_launched_by_pigeon = True\n                except Exception:\n                    pass\n                self.gto_embedded = False\n                self.status_var.set(f\"GTO+は起動しましたが、Pigeon内への表示に失敗: {exc}\")\n            else:\n                self.status_var.set(f\"GTO+自動起動失敗: {type(exc).__name__}: {exc}\")\n\n    def _attach_existing_gto(self, process_id: int, automatic: bool = False):\n        try:\n            self.update_idletasks()\n            hwnd = self.integration.attach_existing_and_dock(\n                int(process_id), int(self.gto_host.winfo_id()), startup_timeout=15,\n            )\n            self.gto_owned_pid = int(process_id)\n            self.gto_launched_by_pigeon = True\n            self.gto_embedded = True\n            self.status_var.set(f\"GTO+をPigeon内に再接続 (HWND {hwnd})\")\n            self._schedule_embedded_gto_geometry_sync(\"attach\")\n            self.after(1800, lambda: self._connect_gto(automatic=True))\n        except Exception as exc:\n            self.gto_embedded = False\n            self.gto_owned_pid = int(process_id)\n            self.gto_launched_by_pigeon = True\n            self.status_var.set(f\"既存GTO+の再接続失敗: {type(exc).__name__}: {exc}\")\n\n"
          main = main[:launch_start] + lifecycle_methods + main[connect_start:]

          connect_start = main.find("    def _connect_gto(self):\\n")
          load_tree_start = main.find("    def _load_tree(self):\\n", connect_start)
          if connect_start < 0 or load_tree_start < 0:
              raise SystemExit("Could not locate the GTO+ connection method.")
          connect_method = "    def _connect_gto(self, automatic: bool = False, attempt: int = 0):\n        if automatic and self._gto_auto_connect_inflight:\n            return\n        if self.integration.connected:\n            self._gto_auto_connect_inflight = False\n            return\n        try:\n            self._save_connection_config()\n        except Exception as exc:\n            self._gto_auto_connect_inflight = False\n            if automatic:\n                self.status_var.set(f\"GTO+自動接続設定失敗: {exc}\")\n            else:\n                messagebox.showerror(\"GTO+ settings\", str(exc))\n            return\n        preferred_tree = self.tree_file if self.tree_file and self.tree_file.is_file() else None\n        if automatic:\n            self._gto_auto_connect_inflight = True\n        def work():\n            try:\n                greeting = self.integration.connect(timeout=10.0)\n                loaded_tree = None\n                tree_error = None\n                if preferred_tree is not None:\n                    try:\n                        self.integration.open_solved_tree(preferred_tree)\n                        loaded_tree = str(preferred_tree)\n                    except Exception as exc:\n                        tree_error = str(exc)\n                self.jobs.put((\"connect_ok\", {\n                    \"greeting\": greeting, \"loaded_tree\": loaded_tree,\n                    \"tree_error\": tree_error, \"library_count\": len(self.tree_files),\n                }))\n            except Exception as exc:\n                if automatic:\n                    self.jobs.put((\"gto_auto_connect_retry\", {\n                        \"error\": str(exc), \"attempt\": int(attempt),\n                    }))\n                else:\n                    self.jobs.put((\"error\", f\"GTO+接続失敗: {exc}\\\\nGTO+のソケット設定と起動状態を確認してください。\"))\n        threading.Thread(target=work, daemon=True, name=\"PigeonGTOPlusConnect\").start()\n        self.status_var.set(\"GTO+へ自動接続中…\" if automatic else \"GTO+へ接続中…\")\n\n"
          main = main[:connect_start] + connect_method + main[load_tree_start:]

          # Remove the former app-generated elevation approval pathway entirely.
          if "messagebox.askyesno(" in main and "Windows permissions required" in main:
              raise SystemExit("Old GTO+ elevation approval prompt remains in the patched source.")
          if "ShellExecuteW(" in main and '"runas"' in main:
              raise SystemExit("Old GTO+ runas elevation pathway remains in the patched source.")

          connect_ok_anchor = '                elif kind == "connect_ok":\n'
          if main.count(connect_ok_anchor) != 1:
              raise SystemExit("Could not uniquely locate the successful GTO+ connection event.")
          main = main.replace(
              connect_ok_anchor,
              connect_ok_anchor + '                    self._gto_auto_connect_inflight = False\n',
              1,
          )

          retry_event = "                elif kind == \"gto_auto_connect_retry\":\n                    self._gto_auto_connect_inflight = False\n                    details = payload if isinstance(payload, dict) else {}\n                    attempt = int(details.get(\"attempt\", 0))\n                    error = str(details.get(\"error\", \"GTO+ socket is not ready\"))\n                    if attempt < 9:\n                        self.status_var.set(f\"GTO+接続待機中… ({attempt + 1}/10)\")\n                        self.after(1800, lambda n=attempt + 1: self._connect_gto(automatic=True, attempt=n))\n                    else:\n                        self.status_var.set(f\"GTO+自動接続失敗: {error}\")\n\n"
          tree_loaded_anchor = '                elif kind == "tree_loaded":\n'
          if main.count(tree_loaded_anchor) != 1:
              raise SystemExit("Could not uniquely locate the tree-loaded event.")
          main = main.replace(tree_loaded_anchor, retry_event + tree_loaded_anchor, 1)

          close_old = (
              '        try:\n'
              '            self.integration.stop(detach=True, terminate=False)\n'
              '        except Exception:\n'
              '            pass\n'
              '        self.destroy()\n'
          )
          close_new = (
              '        try:\n'
              '            self.integration.stop(detach=True, terminate=False)\n'
              '        except Exception:\n'
              '            pass\n'
              '        if self.gto_launched_by_pigeon and self.gto_owned_pid and os.name == "nt":\n'
              '            try:\n'
              '                subprocess.run(\n'
              '                    ["taskkill", "/PID", str(self.gto_owned_pid), "/T", "/F"],\n'
              '                    check=False, capture_output=True, timeout=8,\n'
              '                    creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),\n'
              '                )\n'
              '            except Exception:\n'
              '                pass\n'
              '        self.destroy()\n'
          )
          main = replace_once(main, close_old, close_new, "close owned GTO+ with Pigeon")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (target_version + chr(10)).encode("ascii")
          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          # Focused structural assertions: no right sidebar, GTO starts on app
          # launch, auto socket setup/connect, no app-owned UAC prompt, and owned PID exit.
          assertions = (
              'self.show_page("gto")',
              'self.after(350, self._auto_start_gto_plus)',
              'def _auto_start_gto_plus(self):',
              'self.integration.enable_socket_connection()',
              'self.integration.launch_and_dock(host_hwnd, startup_timeout=25)',
              'self._attach_existing_gto(existing_pid, automatic=True)',
              'self._connect_gto(automatic=True)',
              'def _connect_gto(self, automatic: bool = False, attempt: int = 0):',
              'elif kind == "gto_auto_connect_retry":',
              '["taskkill", "/PID", str(self.gto_owned_pid), "/T", "/F"]',
              'controls_outer = tk.Frame(page, bg=COLORS["bg"], height=300)',
              'controls_toggle.pack(fill="x", padx=22, pady=(0, 6), before=row)',
              'controls_outer.pack(fill="x", padx=22, pady=(0, 16))',
          )
          for item in assertions:
              if item not in main:
                  raise SystemExit("Missing required v1.3.76 behavior: " + item)
          if 'controls_outer.pack(side="right"' in main:
              raise SystemExit("GTO+ still loses workspace width to a right sidebar.")
          if "messagebox.askyesno(" in main or ('ShellExecuteW(' in main and '"runas"' in main):
              raise SystemExit("An app-generated GTO+ permission/elevation prompt remains.")
          for name, expected_blob in range_blobs.items():
              data = files[name]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise SystemExit("Range source changed in v1.3.76: " + name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final v1.3.76 ZIP CRC check failed.")
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final v1.3.76 package file set changed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != target_version:
                  raise SystemExit("Final v1.3.76 version marker mismatch.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded_payload = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + target_version)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded_payload, encoding="ascii")
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded_payload), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(encoded_payload[offset:offset + chunk_size], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + chr(10), encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "GTO+ WORKSPACEをサイドバーと横並びにせず、ページの全幅で表示。通常時は操作パネルを折りたたみ、"
              "インポート済みレンジツリーを含むGTO+本体の右端を切らずに表示する。"
              "Pigeon起動時にGTO+ Engineを開き、Socket設定・既存GTO+の再接続または新規起動・自動接続を実行。"
              "Pigeonが管理するGTO+プロセスはPigeon終了・更新時に同時終了。"
              "GTO+のWindows権限昇格を要求するアプリ内ダイアログは撤去。v1.3.69のレンジデータと生成ロジックは維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
