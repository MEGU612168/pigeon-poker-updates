name: Fix v1.3.39 preflop action-event mapping

on:
  push:
    paths:
      - "releases/v1.3.40/build.request"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and test the existing 20-node preflop connection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, base64, datetime, hashlib, importlib.util, io, json, pathlib
          import random, sys, urllib.request, zipfile

          root = pathlib.Path(".")
          manifest = json.loads(urllib.request.urlopen(
              "https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/stable.json",
              timeout=60).read().decode("utf-8"))
          if manifest.get("version") != "1.3.39":
              raise SystemExit("Expected v1.3.39 base; found " + str(manifest.get("version")))
          encoded = urllib.request.urlopen(manifest["payload_url"], timeout=90).read()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != int(manifest["payload_size"]):
              raise SystemExit("Base package size mismatch")
          if hashlib.sha256(payload).hexdigest() != manifest["payload_sha256"]:
              raise SystemExit("Base package SHA-256 mismatch")

          with zipfile.ZipFile(io.BytesIO(payload), "r") as src:
              if src.testzip() is not None:
                  raise SystemExit("Base ZIP integrity failure")
              files = {i.filename: src.read(i.filename) for i in src.infolist() if not i.is_dir()}

          required = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
                      "pigeon_poker/preflop_screenshot_ranges.py"}
          if not required.issubset(files):
              raise SystemExit("v1.3.39 package is missing required files")

          module_path = "pigeon_poker/preflop_screenshot_ranges.py"
          source = files[module_path].decode("utf-8")
          old = 'player_id = str(event.get("player_id", ""))'
          new = 'player_id = str(event.get("player_id") or event.get("player") or "")'
          if source.count(old) != 1:
              raise SystemExit("Expected one event-player lookup; refusing unsafe patch")
          source = source.replace(old, new, 1)
          ast.parse(source, filename=module_path)
          files[module_path] = source.encode("utf-8")

          # Verify that all 20 nodes resolve using the actual engine event shape:
          # action events store the acting seat under "player", not "player_id".
          temp = pathlib.Path("range_module_test.py")
          temp.write_text(source, encoding="utf-8")
          spec = importlib.util.spec_from_file_location("range_module_test", temp)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          data = module._data()
          if len(data["nodes"]) != 20:
              raise SystemExit("Expected 20 range nodes")
          if len(data["rows"]) != 3380:
              raise SystemExit("Expected 3,380 hand-class rows")

          positions = ("BTN", "SB", "BB", "UTG", "HJ", "CO")
          order = ("UTG", "HJ", "CO", "BTN", "SB", "BB")
          open_nodes = {"UTG":"01_UTG_OPEN", "HJ":"02_HJ_OPEN", "CO":"03_CO_OPEN",
                        "BTN":"04_BTN_OPEN", "SB":"05_SB_OPEN"}
          defense = {
              ("UTG","HJ"):"06_HJ_VS_UTG", ("UTG","CO"):"07_CO_VS_UTG",
              ("UTG","BTN"):"08_BTN_VS_UTG", ("UTG","SB"):"09_SB_VS_UTG",
              ("UTG","BB"):"10_BB_VS_UTG", ("HJ","CO"):"11_CO_VS_HJ",
              ("HJ","BTN"):"12_BTN_VS_HJ", ("HJ","SB"):"13_SB_VS_HJ",
              ("HJ","BB"):"14_BB_VS_HJ", ("CO","BTN"):"15_BTN_VS_CO",
              ("CO","SB"):"16_SB_VS_CO", ("CO","BB"):"17_BB_VS_CO",
              ("BTN","SB"):"18_SB_VS_BTN", ("BTN","BB"):"19_BB_VS_BTN",
              ("SB","BB"):"20_BB_VS_SB"
          }

          class Player:
              def __init__(self, pid, cards=()):
                  self.player_id, self.name = pid, pid
                  self.hole_cards = list(cards)
          class Hand:
              def __init__(self, actor, opener=None):
                  self.players = [Player("p"+str(i), ["As","Ah"] if positions[i] == actor else ())
                                  for i in range(6)]
                  self.dealer_index, self.big_blind, self.street = 0, 1000, "preflop"
                  self.seat_by_id = {"p"+str(i):i for i in range(6)}
                  self.events = []
                  self.board = []
                  self.next_to_act = "p"+str(positions.index(actor))
                  self.events = []
                  if opener is None:
                      for pos in order[:order.index(actor)]:
                          self.events.append({"type":"action","street":"preflop",
                                              "player":"p"+str(positions.index(pos)),"action":"fold"})
                  else:
                      for pos in order[:order.index(opener)]:
                          self.events.append({"type":"action","street":"preflop",
                                              "player":"p"+str(positions.index(pos)),"action":"fold"})
                      self.events.append({"type":"action","street":"preflop",
                                          "player":"p"+str(positions.index(opener)),"action":"raise"})
                      for pos in order[order.index(opener)+1:order.index(actor)]:
                          self.events.append({"type":"action","street":"preflop",
                                              "player":"p"+str(positions.index(pos)),"action":"fold"})
              def player(self, pid):
                  return self.players[self.seat_by_id[pid]]
              def legal_actions(self, pid):
                  return {"actions":["raise","call","fold"],"min_target":2000,"max_target":100000}

          cases = [(node, pos, None) for pos,node in open_nodes.items()]
          cases += [(node, actor, opener) for (opener,actor),node in defense.items()]
          table = type("Table", (), {"dealer_index":0})()
          for expected, actor, opener in cases:
              hand = Hand(actor, opener)
              actor_id = hand.next_to_act
              actual = module._node_for_actor(table, hand, actor_id)
              if actual != expected:
                  raise SystemExit(f"Node mapping failed: {expected} -> {actual}")
              cpu = type("CPU", (), {"level":5,"rng":random.Random(123)})()
              decision = module.choose_preflop_action(table, hand, actor_id, cpu)
              if decision is None or decision.node_id != expected:
                  raise SystemExit(f"Strategy sampling failed at {expected}")
          print("PASS: 20/20 nodes, 3,380 hand rows, engine 'player' event field")

          files["VERSION.txt"] = b"1.3.40\n"
          out = io.BytesIO()
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(files):
                  z.writestr(name, files[name])
          payload = out.getvalue()
          if not payload or len(payload) > 18*1024*1024:
              raise SystemExit("Invalid update payload size")

          release = root / "releases" / "v1.3.40"
          release.mkdir(parents=True, exist_ok=True)
          encoded = base64.b64encode(payload).decode("ascii")
          chunks = [encoded[i:i+48000] for i in range(0,len(encoded),48000)]
          names = []
          for i, chunk in enumerate(chunks):
              name = f"payload.part-{i:03d}"
              (release/name).write_text(chunk, encoding="ascii")
              names.append(name)
          (release/"payload.parts.json").write_text(
              json.dumps({"parts":names},indent=2)+"\n",encoding="utf-8")
          metadata = {
              "schema_version":1, "product":"pigeon-poker", "channel":"stable",
              "version":"1.3.40",
              "published_at":datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "release_notes":"v1.3.39のプリフロップ20ノード接続を修正。エンジンの実際のアクション履歴キー「player」を読み取り、UTG/HJ/CO/BTN/SB/BBのオープン・対オープン15局面をCPUが頻度参照。20ノード・3,380行を自動検証。",
              "package_mode":"full"
          }
          (release/"release.json").write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (release/"payload.ready").write_text("verified\n",encoding="utf-8")
          print(json.dumps({"version":"1.3.40","payload_size":len(payload),"parts":len(chunks)}))
          PY
      - name: Commit v1.3.40 build inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v1.3.40/
          git commit -m "Build verified v1.3.40 preflop event mapping fix"
          git push
