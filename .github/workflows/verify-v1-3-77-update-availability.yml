name: Verify v1.3.77 startup update availability behavior

on:
  push:
    paths:
      - "update-diagnostics/v1.3.77.request"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the exact v1.3.77 availability helper against the published stable manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import tempfile
          import threading
          import sys

          source = pathlib.Path("staging/source_1_3_77/pigeon_updater.py")
          if not source.is_file():
              raise SystemExit("The published v1.3.77 updater source is missing.")
          sys.path.insert(0, str(source.parent))
          import pigeon_updater as updater

          manifest = updater._fetch_manifest()
          stable = str(manifest["version"])
          if stable != "1.3.77":
              raise SystemExit(f"Stable manifest unexpectedly reports {stable!r}.")

          real_thread = threading.Thread

          class ImmediateThread:
              def __init__(self, target, **kwargs):
                  self._target = target
              def start(self):
                  self._target()

          updater.threading.Thread = ImmediateThread
          results = []
          errors = []
          try:
              with tempfile.TemporaryDirectory() as td:
                  root = pathlib.Path(td)
                  version_file = root / "VERSION.txt"

                  version_file.write_text("1.3.77\n", encoding="ascii")
                  updater.start_update_availability_check(
                      root, lambda *args: results.append(args), errors.append
                  )
                  if results != [(False, "1.3.77", "1.3.77")]:
                      raise SystemExit(f"No-update case did not disable update action: {results!r}")
                  if errors:
                      raise SystemExit(f"No-update case returned an error: {errors!r}")

                  results.clear()
                  version_file.write_text("1.3.76\n", encoding="ascii")
                  updater.start_update_availability_check(
                      root, lambda *args: results.append(args), errors.append
                  )
                  if results != [(True, "1.3.76", "1.3.77")]:
                      raise SystemExit(f"Update-available case did not enable update action: {results!r}")

                  results.clear()
                  version_file.write_text("1.3.78\n", encoding="ascii")
                  updater.start_update_availability_check(
                      root, lambda *args: results.append(args), errors.append
                  )
                  if results != [(False, "1.3.78", "1.3.77")]:
                      raise SystemExit(f"Newer-local-version case was not treated as current: {results!r}")
          finally:
              updater.threading.Thread = real_thread

          app = pathlib.Path("staging/source_1_3_77/PigeonPoker.pyw").read_text(encoding="utf-8")
          required = (
              'text="UP TO DATE"',
              'state="disabled", style="MutedUpdate.TButton"',
              'text="UPDATE NOW"',
              'state="normal", style="Accent.TButton"',
              'text="RETRY CHECK"',
              'self.after(1200, self._refresh_update_button_state)',
          )
          for item in required:
              if item not in app:
                  raise SystemExit("Update button UI state is missing: " + item)

          print(json.dumps({
              "stable_version": stable,
              "same_version_disables_update": True,
              "older_version_enables_update": True,
              "newer_local_version_disables_update": True,
              "manifest_only_check": True,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Record verified update-button behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          printf '%s\n' "v1.3.77 availability helper verified: disabled when current, enabled only for newer stable version." > update-diagnostics/v1.3.77.verified
          git add update-diagnostics/v1.3.77.verified
          git commit -m "Verify v1.3.77 update availability button behavior"
          git push
