name: Build Pigeon Poker v1.3.74 startup and v1.3.69 range baseline

on:
  push:
    paths:
      - "releases/v1.3.74/build.request"

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore v1.3.69 range baseline and auto-start GTO+ on app launch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile

          root = pathlib.Path(".")
          repo = "MEGU612168/pigeon-poker-updates"
          source_version = "1.3.73"
          target_version = "1.3.74"
          source_sha256 = "6f65e9870c6015e5b8f9a3e73891765bec7c49e86568888783499697d4f3f04a"
          source_size = 224845
          source_url = (
              f"https://raw.githubusercontent.com/{repo}/main/releases/v{source_version}/"
              f"payload-updater.zip.b64?v={source_sha256}"
          )
          with urllib.request.urlopen(source_url, timeout=90) as response:
              encoded = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != source_size or hashlib.sha256(payload).hexdigest() != source_sha256:
              raise SystemExit("Pinned v1.3.73 payload size or SHA-256 mismatch.")

          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Pinned v1.3.73 package ZIP integrity failure.")
              files = {name: archive.read(name) for name in archive.namelist()}
          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          if set(files) != expected_files:
              raise SystemExit("Unexpected v1.3.73 package file set.")
          if files["VERSION.txt"].decode("ascii").strip() != source_version:
              raise SystemExit("Pinned source VERSION.txt mismatch.")

          # These three range-engine sources were compared directly between
          # v1.3.69 and v1.3.73 and are identical Git blobs. Verify them again.
          expected_v69_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected_blob in expected_v69_blobs.items():
              data = files[name]
              git_blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\\0" + data).hexdigest()
              if git_blob != expected_blob:
                  raise SystemExit(f"{name} no longer matches the v1.3.69 range baseline.")
          if any(blob not in expected_v69_blobs.values() for blob in []):
              raise SystemExit("Unexpected range baseline.")

          main = files["PigeonPoker.pyw"].decode("utf-8")
          old_start = '        self.show_page("lobby")\\n'
          new_start = '        self.show_page("gto")\\n'
          if main.count(old_start) != 1:
              raise SystemExit("Could not uniquely locate the initial Pigeon startup page.")
          main = main.replace(old_start, new_start, 1)

          # GTO+ startup is invoked by show_page("gto") after the page is
          # actually mapped, rather than by a timer while its parent is hidden.
          checks = (
              '        if key == "gto":\\n',
              '            self.after(300, self._auto_start_gto_plus)\\n',
              '        if self._gto_attach_requested or self._active_page_key != "gto":\\n',
              '                self.gto_viewport.winfo_ismapped()\\n',
              '                and self.gto_host.winfo_ismapped()\\n',
              '        self._launch_gto()\\n',
              '        self._connect_gto()\\n',
              '    def _find_existing_gto_process_id(self) -> int | None:\\n',
              '    def _hide_gto_placeholder(self):\\n',
              '        self.gto_owned_process_pid',
          )
          for item in checks:
              if item not in main:
                  raise SystemExit("Missing startup/lifecycle source requirement: " + repr(item))
          if '        self.show_page("gto")\\n' not in main:
              raise SystemExit("Pigeon does not open on the GTO+ Engine page.")
          if '        self.show_page("lobby")\\n' in main:
              raise SystemExit("The old Lobby-first startup remains.")
          if main.count('            self.after(300, self._auto_start_gto_plus)\\n') != 1:
              raise SystemExit("GTO+ auto-start trigger must exist exactly once.")
          if 'def _reference_scale_for_size(' not in files["pigeon_gto_plus/auto_solve_ui.py"].decode("utf-8"):
              raise SystemExit("Responsive GTO+ range-editor coordinate scaling was lost.")
          ast.parse(main, filename="PigeonPoker.pyw")
          for name, data in files.items():
              if name.endswith(".pyw") or name.endswith(".py"):
                  ast.parse(data.decode("utf-8"), filename=name)

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (target_version + "\\n").encode("ascii")

          out = io.BytesIO()
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = out.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final v1.3.74 ZIP integrity failure.")
              if archive.read("VERSION.txt").decode("ascii").strip() != target_version:
                  raise SystemExit("Final package version marker mismatch.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"), filename="PigeonPoker.pyw")

          digest = hashlib.sha256(final_payload).hexdigest()
          final_b64 = base64.b64encode(final_payload).decode("ascii")
          release_dir = root / "releases" / ("v" + target_version)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(final_b64, encoding="ascii")
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(final_b64), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(final_b64[offset:offset + chunk_size], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + "\\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "Pigeon Poker起動時の初期画面をGTO+ Engineに変更。起動後、GTO+表示先が実際に表示された状態で自動起動・自動接続し、②③の手動操作を不要にする。"
              "HUのライブレンジ生成・スクリーンショット由来プリフロップレンジ・GTO+ UI Probeはv1.3.69の内容と同一。"
              "倍率補正を含むGTO+座標診断とv1.3.73の既存プロセス再接続・終了管理を維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": source_version,
              "range_baseline": "1.3.69",
              "auto_start_on_app_launch": True,
              "auto_connect_on_app_launch": True,
              "responsive_gto_workspace": True,
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          (release_dir / "payload.ready").write_text("verified " + target_version + "\\n", encoding="ascii")
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{repo}/main/releases/v{target_version}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          (root / "stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "published_version": target_version,
              "source_version": source_version,
              "range_baseline": "1.3.69",
              "range_sources_verified_unchanged": sorted(expected_v69_blobs),
              "startup_page": "gto",
              "automatic_gto_start": True,
              "automatic_gto_connect": True,
              "payload_size": len(final_payload),
              "payload_sha256": digest,
          }, ensure_ascii=False))
          PY
      - name: Publish v1.3.74 stable package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.74/
          git commit -m "Release Pigeon Poker v1.3.74 restore v1.3.69 ranges and auto-start GTO+"
          git push
