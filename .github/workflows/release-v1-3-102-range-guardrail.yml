name: Release Pigeon Poker v1.3.102 postflop action controls restored

on:
  push:
    paths:
      - "releases/v1.3.102/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify postflop controls and preflop-only chart gate
        run: |
          set -euo pipefail
          python -m py_compile staging/source_1_3_101/PigeonPoker.pyw
          python staging/test_postflop_controls.py
          cp staging/source_1_3_101/pigeon_poker/preflop_screenshot_ranges.py staging/preflop_screenshot_ranges_75.py
          python staging/test_preflop_ranges_75.py
          python staging/test_poker_reasoning.py

      - name: Build minimal in-app Stable update v1.3.102
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import re
          import subprocess
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.101"
          TARGET_VERSION = "1.3.102"

          request = urllib.request.Request(
              f"https://raw.githubusercontent.com/{REPO}/main/stable.json",
              headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              stable_before = json.loads(response.read().decode("utf-8"))
          if stable_before.get("version") != SOURCE_VERSION:
              raise SystemExit(
                  f"Expected Stable {SOURCE_VERSION}; found {stable_before.get('version')}"
              )

          staged = pathlib.Path("staging/source_1_3_101")
          main_path = staged / "PigeonPoker.pyw"
          if not main_path.is_file():
              raise SystemExit("Patched main application source is missing.")
          main = main_path.read_bytes()
          ast.parse(main.decode("utf-8"), filename="PigeonPoker.pyw")
          text = main.decode("utf-8")

          # Ensure this release fixes only the postflop UI routing and retains
          # the immutable preflop chart enforcement and all existing CPU logic.
          required = (
              "The fixed screenshot chart applies only before the flop.",
              "legal = hand.legal_actions(\"hero\")",
              "preflop_chart_options",
              "from pigeon_poker.poker_reasoning import choose_range_aware_action",
          )
          for item in required:
              if item not in text:
                  raise SystemExit("Required application behavior is missing: " + item)

          # Minimal delta: current Stable already has the 75-node chart module,
          # range engine, updater and all supporting modules. Do not repackage
          # unrelated files or modify any preflop chart data.
          files = {
              "PigeonPoker.pyw": main,
              "VERSION.txt": (TARGET_VERSION + "\n").encode("ascii"),
          }
          output = io.BytesIO()
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Update ZIP CRC failure: " + bad)
              if set(archive.namelist()) != set(files):
                  raise SystemExit("Unexpected update package contents.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"))

          digest = hashlib.sha256(payload).hexdigest()
          encoded = base64.b64encode(payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          part_name = "payload.part-000"
          (release_dir / part_name).write_text(encoded, encoding="ascii")
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": [part_name]}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "ポストフロップの操作UIを修復。HEROの手番ではCHECKまたはCALL、"
              "FOLD、BETまたはRAISEボタンを再表示し、金額入力、サイズスライダー、"
              "ポット割合プリセット、実行ボタンも通常どおり使用可能。"
              "固定チャートによる制約はプリフロップだけに限定し、ポストフロップの"
              "アクションはその時点の合法アクションから生成。プリフロップ75局面・"
              "12,675行・頻度・固定BBサイズ、レンジ推定エンジン、更新機能、"
              "ウォレットと履歴データには変更なし。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(payload),
              "source_version": SOURCE_VERSION,
              "files": sorted(files),
              "preflop_75_node_policy_immutable": True,
              "preflop_12675_hand_rows_immutable": True,
              "preflop_chart_frequencies_immutable": True,
              "preflop_chart_bb_sizes_immutable": True,
              "postflop_controls_restored": True,
              "postflop_check_call_fold_controls": True,
              "postflop_bet_raise_slider_entry_presets": True,
              "postflop_uses_live_legal_actions": True,
              "postflop_ui_regression_tests": "passed",
              "preflop_regression_tests": "passed",
              "package_ast_and_zip_crc": "passed",
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", "stable.json", str(release_dir)], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.102 postflop controls"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "files": sorted(files),
              "payload_sha256": digest,
              "preflop_chart_modified": False,
              "postflop_controls_restored": True,
              "tests": "passed",
          }, ensure_ascii=False, indent=2))
          PY
