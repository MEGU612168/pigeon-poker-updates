name: Release Pigeon Poker v1.3.101 range-aware preflop and postflop CPU

on:
  push:
    paths:
      - "releases/v1.3.101/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fixed 75-node preflop regression suite
        shell: bash
        run: |
          set -euo pipefail
          cp staging/source_1_3_100/pigeon_poker/preflop_screenshot_ranges.py staging/preflop_screenshot_ranges_75.py
          python staging/test_preflop_ranges_75.py

      - name: Run multiway and postflop range-reasoning tests
        run: python staging/test_poker_reasoning.py

      - name: Build and validate Stable v1.3.101
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import re
          import subprocess
          import time
          import urllib.request
          import zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.100"
          TARGET_VERSION = "1.3.101"

          manifest_url = f"https://raw.githubusercontent.com/{REPO}/main/stable.json"
          request = urllib.request.Request(
              manifest_url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              manifest = json.loads(response.read().decode("utf-8"))
          if manifest.get("version") != SOURCE_VERSION:
              raise SystemExit(
                  f"Expected pinned Stable {SOURCE_VERSION}, found {manifest.get('version')}"
              )
          source_url = str(manifest["payload_url"])
          separator = "&" if "?" in source_url else "?"
          source_url += separator + "v=" + str(manifest["payload_sha256"])
          request = urllib.request.Request(
              source_url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"}
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              encoded = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != int(manifest["payload_size"]):
              raise SystemExit("Pinned v1.3.100 payload size mismatch.")
          if hashlib.sha256(payload).hexdigest() != manifest["payload_sha256"]:
              raise SystemExit("Pinned v1.3.100 payload SHA-256 mismatch.")

          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Pinned source ZIP CRC failure: " + bad)
              files = {name: archive.read(name) for name in archive.namelist()}
          if set(files) != expected_files:
              raise SystemExit("Unexpected pinned source package layout.")
          if files["VERSION.txt"].decode("ascii").strip() != SOURCE_VERSION:
              raise SystemExit("Pinned source VERSION.txt mismatch.")

          staged = pathlib.Path("staging/source_1_3_100")
          replacements = {
              "PigeonPoker.pyw": staged / "PigeonPoker.pyw",
              "pigeon_poker/preflop_screenshot_ranges.py":
                  staged / "pigeon_poker" / "preflop_screenshot_ranges.py",
              "pigeon_poker/poker_reasoning.py":
                  staged / "pigeon_poker" / "poker_reasoning.py",
          }
          original_policy = re.search(
              rb'_FULL_POLICY_B64 = "([^"]+)"',
              files["pigeon_poker/preflop_screenshot_ranges.py"]
          )
          if not original_policy:
              raise SystemExit("Pinned screenshot policy payload is missing.")
          for package_path, staged_path in replacements.items():
              if not staged_path.is_file():
                  raise SystemExit("Required staged source is missing: " + str(staged_path))
              files[package_path] = staged_path.read_bytes()

          packaged_preflop = files["pigeon_poker/preflop_screenshot_ranges.py"]
          updated_policy = re.search(rb'_FULL_POLICY_B64 = "([^"]+)"', packaged_preflop)
          if not updated_policy or updated_policy.group(1) != original_policy.group(1):
              raise SystemExit("The immutable 75-node chart data changed.")
          if b'Decimal("0.05")' not in packaged_preflop:
              raise SystemExit("Five-percent history-size tolerance is missing.")
          main = files["PigeonPoker.pyw"].decode("utf-8")
          if "from pigeon_poker.poker_reasoning import choose_range_aware_action" not in main:
              raise SystemExit("Range-aware CPU integration import is missing.")
          if "range_estimator=estimate_preflop_opponent_ranges" not in main:
              raise SystemExit("Chart range-estimator bridge is missing.")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")

          for name, content in files.items():
              if name.endswith((".py", ".pyw")):
                  ast.parse(content.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Final payload ZIP CRC failure: " + bad)
              package_names = set(archive.namelist())
              if "pigeon_poker/poker_reasoning.py" not in package_names:
                  raise SystemExit("Range-aware policy module is absent from payload.")
              if "pigeon_poker/preflop_autonomous.py" in package_names:
                  raise SystemExit("Unused prototype policy must not ship.")
              ast.parse(archive.read("PigeonPoker.pyw").decode("utf-8"))
              ast.parse(archive.read("pigeon_poker/poker_reasoning.py").decode("utf-8"))

          digest = hashlib.sha256(final_payload).hexdigest()
          final_encoded = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(
              final_encoded, encoding="ascii"
          )
          parts = []
          for index, offset in enumerate(range(0, len(final_encoded), 48000)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(
                  final_encoded[offset:offset + 48000], encoding="ascii"
              )
              parts.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": parts}, indent=2) + "\n", encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "プリフロップ75局面・12,675行のチャート、アクション頻度、固定BBサイズは不変。"
              "相手の履歴をチャート局面へ照合するサイズ許容幅を5%に設定。"
              "チャート外のプリフロップ分岐（3way/マルチウェイを含む）は停止せず、"
              "参加済み相手ごとのレンジ、未行動プレイヤーの参加確率、レンジ加重Monte Carlo"
              "エクイティとCPUレベルに基づく独立判断へ移行。"
              "ポストフロップも相手のプリフロップ履歴に加え、各ストリートのチェック、コール、"
              "ベット、レイズとサイズでレンジを逐次更新。必要コール勝率、純ブラフ必要成功率、"
              "推定フォールド確率、概算EVを判断ログに記録。これはレンジ推定型の近似ポリシーで、"
              "ソルバーの完全一致解とは区別。更新ボタン常時クリック可能、60秒ごとの自動確認、"
              "出金残高の再入金、ポストフロップ操作UIを維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_version": SOURCE_VERSION,
              "preflop_75_node_policy_immutable": True,
              "preflop_12675_hand_rows_immutable": True,
              "preflop_chart_frequencies_immutable": True,
              "preflop_chart_bb_sizes_immutable": True,
              "preflop_history_size_matching_tolerance": 0.05,
              "uncovered_preflop_uses_range_aware_policy": True,
              "multiway_equity_uses_conditional_participation": True,
              "postflop_ranges_update_from_action_and_size": True,
              "range_weighted_monte_carlo_equity": True,
              "required_call_equity_calculated": True,
              "pure_bluff_break_even_fold_rate_calculated": True,
              "ev_is_approximate_not_solver_exact": True,
              "legacy_random_equity_fallback_removed_from_cash_cpu_turns": True,
              "update_button_always_clickable": True,
              "automatic_update_check_interval_ms": 60000,
              "postflop_ui_preserved": True,
              "withdrawable_redeposit_preserved": True,
              "package_ast_and_zip_crc": "passed",
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": TARGET_VERSION,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{REPO}/main/releases/v{TARGET_VERSION}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("dist").mkdir(exist_ok=True)
          (pathlib.Path("dist") / f"PigeonPoker_{TARGET_VERSION}.zip").write_bytes(
              final_payload
          )

          (release_dir / "build.request").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", "stable.json", str(release_dir)], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Release Pigeon Poker v1.3.101 range-aware CPU"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)
          print(json.dumps({
              "version": TARGET_VERSION,
              "source_version": SOURCE_VERSION,
              "sha256": digest,
              "payload_size": len(final_payload),
              "preflop_policy_immutable": True,
              "preflop_history_tolerance": "5%",
              "multiway_range_reasoning": True,
              "postflop_action_range_updates": True,
              "required_call_and_bluff_success_rates": True,
              "tests": "passed",
          }, ensure_ascii=False, indent=2))
          PY
