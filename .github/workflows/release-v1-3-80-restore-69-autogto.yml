name: Release Pigeon Poker v1.3.80 - v69 base, slightly wider GTO workspace, auto GTO lifecycle

on:
  push:
    paths:
      - "releases/v1.3.80/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild from v1.3.69 and apply only requested width and GTO lifecycle changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import time
          import zipfile

          repo = "MEGU612168/pigeon-poker-updates"
          source_version = "1.3.69"
          target_version = "1.3.80"
          base = pathlib.Path("staging/source_1_3_69")
          updater_base = pathlib.Path("staging/source_1_3_77")

          package_names = {
              "PigeonPoker.pyw",
              "pigeon_updater.py",
              "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          files = {}
          for name in package_names:
              source = updater_base / name if name == "pigeon_updater.py" else base / name
              if not source.is_file():
                  raise SystemExit("Missing pinned source file: " + str(source))
              files[name] = source.read_bytes()

          if files["VERSION.txt"].decode("ascii").strip() != source_version:
              raise SystemExit("The Pigeon Poker baseline is not v1.3.69.")

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()

          pinned_blobs = {
              "PigeonPoker.pyw": "4df674b79400ea4809c22a25901fb44c0d4c673e",
              "pigeon_gto_plus/auto_solve_ui.py": "7cdfbcc257e1a246d1ae291cdda22b263407d7b0",
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
              "pigeon_updater.py": "3e74d0dbb86c439a2f6fa13bcef9751d4b093108",
          }
          for name, expected in pinned_blobs.items():
              actual = git_blob_sha(files[name])
              if actual != expected:
                  raise SystemExit(f"Pinned source changed: {name}; expected {expected}, got {actual}")

          main = files["PigeonPoker.pyw"].decode("utf-8")
          probe = files["pigeon_gto_plus/auto_solve_ui.py"].decode("utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one source match, found {count}.")
              return source.replace(old, new, 1)

          def replace_method(source: str, signature: str, replacement_lines: list[str], label: str) -> str:
              if source.count(signature) != 1:
                  raise SystemExit(f"{label}: method signature must occur exactly once.")
              start = source.find(signature)
              end = source.find("\n    def ", start + len(signature))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: could not find the next method boundary.")
              replacement = "\n".join(replacement_lines).rstrip()
              if not replacement.startswith("    def "):
                  raise SystemExit(f"{label}: replacement is not a class method.")
              return source[:start] + replacement + source[end:]

          # 1) Keep v1.3.69's original embedded-child layout. Only narrow the
          # right control column by 30px so the left GTO+ WORKSPACE gains 30px.
          gto_start = main.find("    def _build_gto_page(self):")
          gto_end = main.find("\n    def ", gto_start + 5)
          if gto_start < 0 or gto_end < 0:
              raise SystemExit("Could not isolate the v1.3.69 GTO+ page builder.")
          gto_page = main[gto_start:gto_end]
          gto_page = replace_once(
              gto_page,
              'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=350)',
              'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=320)',
              "right control column width",
          )
          gto_page = replace_once(
              gto_page,
              'width=332, yscrollincrement=24,',
              'width=302, yscrollincrement=24,',
              "right control canvas width",
          )
          gto_page = gto_page.replace("wraplength=300", "wraplength=270")
          gto_page = replace_once(
              gto_page,
              "① ソケット接続を有効化（初回）",
              "① ソケット設定（手動/初回）",
              "short socket button label",
          )
          gto_page = replace_once(
              gto_page,
              "② GTO+をPigeon内で起動",
              "② GTO+起動",
              "short GTO launch button label",
          )
          gto_page = replace_once(
              gto_page,
              "③ GTO+に接続",
              "③ GTO+接続",
              "short GTO connect button label",
          )
          gto_page = gto_page.replace(
              "解析済みツリーを追加・ロード（複数選択可）",
              "解析済みツリーを追加・ロード",
          )
          gto_page = gto_page.replace(
              "未知HU局面の自動Solve設定を診断（OOP/IP/Board/Build Tree/Player2入力復旧）",
              "未知HU局面の自動Solve設定を診断",
          )
          main = main[:gto_start] + gto_page + main[gto_end:]

          # 2) Make the GTO+ Engine page the first page so the native child host
          # is visible before automatic launch. Keep the v1.3.69 host itself.
          startup_old = (
              '        self._build_pokercraft_page()\n'
              '        self.show_page("lobby")\n'
              '        self.protocol("WM_DELETE_WINDOW", self._on_close)\n'
          )
          startup_new = (
              '        self._build_pokercraft_page()\n'
              '        self.show_page("gto")\n'
              '        self.protocol("WM_DELETE_WINDOW", self._on_close)\n'
          )
          main = replace_once(main, startup_old, startup_new, "startup GTO+ page")

          # Track only the exact GTO+ PID launched or adopted by this Pigeon.
          state_old = (
              "        self.gto_embedded = False\n"
              '        self.cpu_last_action = tk.StringVar(value="CPUはまだGTO+の戦略を使っていません")\n'
          )
          state_new = (
              "        self.gto_embedded = False\n"
              "        self.gto_owned_process_pid: int | None = None\n"
              "        self._gto_auto_start_started = False\n"
              "        self._gto_auto_connect_busy = False\n"
              '        self.cpu_last_action = tk.StringVar(value="CPUはまだGTO+の戦略を使っていません")\n'
          )
          main = replace_once(main, state_old, state_new, "GTO+ lifecycle state")

          # 3) Auto-start after the page has been built/mapped. The updater
          # launches the new PigeonPoker.pyw after every successful update, so
          # this same constructor hook also runs after updates.
          timer_old = (
              "        self._job_drain_after_id = self.after(120, self._drain_jobs)\n"
              "        self._study_cashier_refresh_id = self.after(2500, self._study_cashier_live_refresh)\n"
          )
          timer_new = (
              "        self._job_drain_after_id = self.after(120, self._drain_jobs)\n"
              "        self._study_cashier_refresh_id = self.after(2500, self._study_cashier_live_refresh)\n"
              "        self.after(1200, self._auto_start_gto_plus)\n"
              "        self.after(1200, self._refresh_update_button_state)\n"
          )
          main = replace_once(main, timer_old, timer_new, "GTO+ and update startup timers")

          auto_start_lines = [
              "    def _auto_start_gto_plus(self):",
              '        """Start GTO+ inside Pigeon at app launch and after update restart."""',
              "        if self._gto_auto_start_started:",
              "            return",
              "        try:",
              "            self.update_idletasks()",
              "            if (not self.gto_host.winfo_ismapped()",
              "                    or self.gto_host.winfo_width() < 250",
              "                    or self.gto_host.winfo_height() < 180):",
              "                self.after(250, self._auto_start_gto_plus)",
              "                return",
              "            self._save_connection_config()",
              "            self._gto_auto_start_started = True",
              "            try:",
              "                self.integration.enable_socket_connection()",
              "            except Exception as socket_exc:",
              '                self.status_var.set(f"GTO+ソケット設定: {socket_exc}")',
              "            self._launch_gto(automatic=True)",
              "        except Exception as exc:",
              '            self.status_var.set(f"GTO+自動起動準備失敗: {type(exc).__name__}: {exc}")',
              "",
          ]

          auto_connect_lines = [
              "    def _auto_connect_gto_plus(self, attempt: int = 0):",
              '        """Connect to the local GTO+ socket with bounded retries; never block the UI."""',
              "        if not self.gto_embedded:",
              "            return",
              "        if self.integration.connected:",
              "            self._gto_auto_connect_busy = False",
              "            return",
              "        if self._gto_auto_connect_busy:",
              "            return",
              "        if attempt >= 10:",
              '            self.status_var.set("GTO+自動接続に失敗しました。接続設定を確認してください。")',
              "            return",
              "        self._gto_auto_connect_busy = True",
              "        preferred_tree = self.tree_file if self.tree_file and self.tree_file.is_file() else None",
              "        def work():",
              "            try:",
              "                greeting = self.integration.connect(timeout=10.0)",
              "                loaded_tree = None",
              "                tree_error = None",
              "                if preferred_tree is not None:",
              "                    try:",
              "                        self.integration.open_solved_tree(preferred_tree)",
              "                        loaded_tree = str(preferred_tree)",
              "                    except Exception as exc:",
              "                        tree_error = str(exc)",
              '                self.jobs.put(("connect_ok", {',
              '                    "greeting": greeting, "loaded_tree": loaded_tree,',
              '                    "tree_error": tree_error, "library_count": len(self.tree_files),',
              "                }))",
              "            except Exception as exc:",
              '                self.jobs.put(("auto_gto_connect_retry", {',
              '                    "error": str(exc), "attempt": int(attempt),',
              "                }))",
              '        threading.Thread(target=work, daemon=True, name="PigeonGTOPlusAutoConnect").start()',
              '        self.status_var.set(f"GTO+自動接続中… ({attempt + 1}/10)")',
          ]

          attach_lines = [
              "    def _attach_existing_gto(self, process_id: int, automatic: bool = False):",
              "        try:",
              "            self.update_idletasks()",
              "            hwnd = self.integration.attach_existing_and_dock(",
              "                int(process_id), int(self.gto_host.winfo_id()), startup_timeout=15,",
              "            )",
              "            self.gto_owned_process_pid = int(process_id)",
              "            self.gto_embedded = True",
              '            self.status_var.set(f"GTO+をPigeon内に表示中 (HWND {hwnd})")',
              '            self._schedule_embedded_gto_geometry_sync("attach")',
              "            self.after(1800, self._auto_connect_gto_plus)",
              "        except Exception as exc:",
              "            self.gto_owned_process_pid = int(process_id)",
              "            self.gto_embedded = False",
              '            self.status_var.set(f"既存GTO+の埋め込み失敗: {type(exc).__name__}: {exc}")',
          ]

          launch_lines = [
              "    def _launch_gto(self, automatic: bool = False):",
              "        try:",
              "            self._save_connection_config()",
              "            self.update_idletasks()",
              "            host_hwnd = int(self.gto_host.winfo_id())",
              "            hwnd = self.integration.launch_and_dock(host_hwnd, startup_timeout=25)",
              "            process = getattr(self.integration, \"process\", None)",
              "            if process is not None:",
              "                try:",
              "                    self.gto_owned_process_pid = int(process.pid)",
              "                except Exception:",
              "                    self.gto_owned_process_pid = None",
              "            self.gto_embedded = True",
              '            self.status_var.set(f"GTO+をPigeon内に表示中 (HWND {hwnd})")',
              '            self._schedule_embedded_gto_geometry_sync("launch")',
              "            if automatic:",
              "                self.after(1800, self._auto_connect_gto_plus)",
              "        except Exception as exc:",
              '            process = getattr(self.integration, "process", None)',
              "            try:",
              "                still_running = process is not None and process.poll() is None",
              "            except Exception:",
              "                still_running = process is not None",
              "            if still_running:",
              "                try:",
              "                    self.gto_owned_process_pid = int(process.pid)",
              "                except Exception:",
              "                    pass",
              "                self.gto_embedded = False",
              '                self.status_var.set(f"GTO+は起動しましたが、Pigeon内表示に失敗: {type(exc).__name__}: {exc}")',
              "            else:",
              "                self.gto_embedded = False",
              '                self.status_var.set(f"GTO+自動起動失敗: {type(exc).__name__}: {exc}")',
              "            if not automatic:",
              '                messagebox.showerror("GTO+ launch error", str(exc), parent=self)',
          ]

          # Insert the three automatic process-management methods before the
          # existing manual socket configuration method.
          insertion_anchor = "    def _enable_socket(self):"
          if main.count(insertion_anchor) != 1:
              raise SystemExit("Could not locate the manual socket setup method.")
          new_methods = (
              "\n".join(auto_start_lines) + "\n\n"
              + "\n".join(auto_connect_lines) + "\n\n"
          )
          main = main.replace(insertion_anchor, new_methods + insertion_anchor, 1)

          # Replace only the launcher; leave v1.3.69's existing attach method intact.
          main = replace_method(main, "    def _launch_gto(self):", launch_lines, "GTO+ process launch")

          # Remove the old UAC self-restart helper. Windows security prompts are
          # left to Windows; Pigeon does not ask to elevate itself.
          restart_signature = "    def _restart_pigeon_elevated_for_gto(self, process_id: int):"
          if restart_signature in main:
              start = main.find(restart_signature)
              end = main.find("\n    def ", start + len(restart_signature))
              if end < 0:
                  raise SystemExit("Could not find the end of the old elevation helper.")
              main = main[:start] + main[end + 1:]

          # Add a bounded automatic connect retry branch. Successful connection
          # still flows through v1.3.69's normal connect_ok handler.
          connect_ok_anchor = '                elif kind == "connect_ok":\n'
          if main.count(connect_ok_anchor) != 1:
              raise SystemExit("Could not uniquely locate the connect_ok queue handler.")
          main = main.replace(
              connect_ok_anchor,
              connect_ok_anchor + "                    self._gto_auto_connect_busy = False\n",
              1,
          )
          tree_loaded_anchor = '                elif kind == "tree_loaded":\n'
          if main.count(tree_loaded_anchor) != 1:
              raise SystemExit("Could not uniquely locate the tree_loaded queue handler.")
          retry_event = [
              '                elif kind == "auto_gto_connect_retry":',
              "                    self._gto_auto_connect_busy = False",
              '                    details = payload if isinstance(payload, dict) else {}',
              '                    attempt = int(details.get("attempt", 0))',
              '                    error = str(details.get("error", "GTO+ socket is not ready"))',
              "                    if attempt < 9:",
              '                        self.status_var.set(f"GTO+接続待機中… ({attempt + 2}/10)")',
              "                        self.after(1800, lambda n=attempt + 1: self._auto_connect_gto_plus(n))",
              "                    else:",
              '                        self.status_var.set(f"GTO+自動接続失敗: {error}")',
          ]
          main = main.replace(
              tree_loaded_anchor,
              "\n".join(retry_event) + "\n" + tree_loaded_anchor,
              1,
          )

          # Pigeon shutdown closes only the exact PID that this instance launched
          # or adopted. It never kills GTO+ processes by image name.
          close_old = (
              "        try:\n"
              "            self.integration.stop(detach=True, terminate=False)\n"
              "        except Exception:\n"
              "            pass\n"
              "        self.destroy()"
          )
          close_new = (
              "        try:\n"
              "            self.integration.stop(detach=True, terminate=False)\n"
              "        except Exception:\n"
              "            pass\n"
              "        owned_pid = int(getattr(self, \"gto_owned_process_pid\", 0) or 0)\n"
              "        if owned_pid > 0 and os.name == \"nt\":\n"
              "            try:\n"
              "                subprocess.run(\n"
              '                    ["taskkill", "/PID", str(owned_pid), "/T", "/F"],\n'
              "                    check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,\n"
              "                    timeout=8, creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0),\n"
              "                )\n"
              "            except Exception:\n"
              "                pass\n"
              "        self.destroy()"
          )
          main = replace_once(main, close_old, close_new, "close owned GTO+ with Pigeon")

          # Update availability button: keep the previously requested grey
          # disabled state when no newer stable version exists.
          main = replace_once(
              main,
              "from pigeon_updater import start_update_check",
              "from pigeon_updater import start_update_check, start_update_availability_check",
              "updater availability import",
          )

          style_anchor = '        style.map("Accent.TButton", background=[("active", "#35c78e")])'
          style_insert = (
              style_anchor + "\n"
              '        style.configure("MutedUpdate.TButton", background="#354255", foreground="#aab5c5")\n'
              '        style.map("MutedUpdate.TButton", background=[("disabled", "#354255")], foreground=[("disabled", "#8997aa")])\n'
              '        style.configure("RetryUpdate.TButton", background="#64748b", foreground="#f2f6fc")'
          )
          main = replace_once(main, style_anchor, style_insert, "update button styles")

          old_button = (
              "        self.update_button = ttk.Button(\n"
              '            header, text="UPDATE NOW", style="Accent.TButton",\n'
              "            command=self._begin_app_update,\n"
              "        )"
          )
          new_button = (
              "        self.update_button = ttk.Button(\n"
              '            header, text="CHECKING…", style="MutedUpdate.TButton",\n'
              "            command=self._begin_app_update, state=\"disabled\",\n"
              "        )"
          )
          main = replace_once(main, old_button, new_button, "initial update button state")

          update_method_lines = [
              "    def _refresh_update_button_state(self):",
              '        """Check only the stable manifest; do not download if no update exists."""',
              '        if getattr(self, "_update_check_active", False) or getattr(self, "_update_in_progress", False):',
              "            return",
              "        self._update_check_active = True",
              "        try:",
              '            self.update_button.configure(state="disabled", style="MutedUpdate.TButton", text="CHECKING…")',
              "        except tk.TclError:",
              "            self._update_check_active = False",
              "            return",
              "        def on_result(available: bool, current: str, candidate: str):",
              "            def apply_result():",
              "                self._update_check_active = False",
              "                if available:",
              '                    self.update_button.configure(state="normal", style="Accent.TButton", text="UPDATE NOW", command=self._begin_app_update)',
              '                    self.update_status_var.set(f"Update {candidate} available (current {current}).")',
              "                else:",
              '                    self.update_button.configure(state="disabled", style="MutedUpdate.TButton", text="UP TO DATE")',
              '                    self.update_status_var.set(f"Pigeon Poker is up to date ({current}).")',
              "            try:",
              "                self.after(0, apply_result)",
              "            except tk.TclError:",
              "                pass",
              "        def on_error(error: str):",
              "            def apply_error():",
              "                self._update_check_active = False",
              '                self.update_button.configure(state="normal", style="RetryUpdate.TButton", text="RETRY CHECK", command=self._refresh_update_button_state)',
              '                self.update_status_var.set(f"Update check failed: {error}")',
              "            try:",
              "                self.after(0, apply_error)",
              "            except tk.TclError:",
              "                pass",
              "        start_update_availability_check(ROOT, on_result, on_error)",
          ]
          update_anchor = "    def _begin_app_update(self):"
          if main.count(update_anchor) != 1:
              raise SystemExit("Could not uniquely locate the update action method.")
          main = main.replace(update_anchor, "\n".join(update_method_lines) + "\n\n" + update_anchor, 1)

          # Update button visual state during a manual update check and restore
          # the no-update/failed-check states appropriately.
          update_start = main.find("    def _begin_app_update(self):")
          update_end = main.find("\n    def ", update_start + 5)
          if update_start < 0 or update_end < 0:
              raise SystemExit("Could not isolate the manual update method.")
          update_method = main[update_start:update_end]
          update_method = replace_once(
              update_method,
              'self.update_button.configure(state="disabled")',
              'self.update_button.configure(state="disabled", style="MutedUpdate.TButton", text="CHECKING…")',
              "update checking button state",
          )
          normal_state = 'self.update_button.configure(state="normal")'
          if update_method.count(normal_state) != 2:
              raise SystemExit("Expected exactly two original UPDATE NOW re-enable states in the v1.3.69 update method.")
          update_method = update_method.replace(
              normal_state,
              'self.update_button.configure(state="disabled", style="MutedUpdate.TButton", text="UP TO DATE")',
              1,
          )
          update_method = update_method.replace(
              normal_state,
              'self.update_button.configure(state="normal", style="RetryUpdate.TButton", text="RETRY CHECK", command=self._refresh_update_button_state)',
              1,
          )
          main = main[:update_start] + update_method + main[update_end:]

          # Calibrate the existing v1.3.69 GTO+ UI probe for the added 30px
          # client width. Left-side matrix/board coordinates remain unchanged;
          # centered range-editor elements and ROIs move right by 15px.
          probe = replace_once(probe, "_REFERENCE_SIZE = (665, 570)", "_REFERENCE_SIZE = (695, 570)", "probe reference client width")
          probe_replacements = [
              ("_OOP_CLOSE_RECT = (488, 66, 504, 84)", "_OOP_CLOSE_RECT = (503, 66, 519, 84)"),
              ("_OOP_CLOSE_CENTER = (496, 75)", "_OOP_CLOSE_CENTER = (511, 75)"),
              ("_RANGE_SOURCE_FIELD_RECT = (112, 427, 412, 449)", "_RANGE_SOURCE_FIELD_RECT = (127, 427, 427, 449)"),
              ("_RANGE_SOURCE_FIELD_CENTER = (262, 438)", "_RANGE_SOURCE_FIELD_CENTER = (277, 438)"),
              ("_RANGE_EDITOR_CLEAR_RECT = (417, 307, 502, 331)", "_RANGE_EDITOR_CLEAR_RECT = (432, 307, 517, 331)"),
              ("_RANGE_EDITOR_CLEAR_CENTER = (460, 319)", "_RANGE_EDITOR_CLEAR_CENTER = (475, 319)"),
              ("_RANGE_EDITOR_DONE_RECT = (417, 422, 502, 447)", "_RANGE_EDITOR_DONE_RECT = (432, 422, 517, 447)"),
              ("_RANGE_EDITOR_DONE_CENTER = (460, 434)", "_RANGE_EDITOR_DONE_CENTER = (475, 434)"),
              ("_DIALOG_ROI = (100, 60, 515, 460)", "_DIALOG_ROI = (115, 60, 530, 460)"),
              ("_RANGE_EDITOR_VERIFY_ROI = (240, 60, 515, 460)", "_RANGE_EDITOR_VERIFY_ROI = (255, 60, 530, 460)"),
              ("[414, 343, 476, 376]", "[429, 343, 491, 376]"),
          ]
          for old, new in probe_replacements:
              if old not in probe:
                  raise SystemExit("Missing v1.3.69 UI probe calibration constant: " + old)
              probe = probe.replace(old, new)

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["pigeon_gto_plus/auto_solve_ui.py"] = probe.encode("utf-8")
          files["VERSION.txt"] = (target_version + chr(10)).encode("ascii")

          # Syntax check every Python payload file.
          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          # Strong structural assertions: original 69 host/frame, no scaling
          # experiments, auto-start/auto-connect/owned-PID close and update restart.
          required_main = (
              'self.show_page("gto")',
              "self.after(1200, self._auto_start_gto_plus)",
              "self.after(1200, self._refresh_update_button_state)",
              'self.gto_host = tk.Frame(host_col, bg="#080f18", height=570)',
              'self.gto_host.pack(fill="both", expand=True, padx=8, pady=8)',
              'controls_outer = tk.Frame(row, bg=COLORS["bg"], width=320)',
              "width=302, yscrollincrement=24,",
              "def _auto_start_gto_plus(self):",
              "def _auto_connect_gto_plus(self, attempt: int = 0):",
              "def _launch_gto(self, automatic: bool = False):",
              "self.integration.enable_socket_connection()",
              "self._launch_gto(automatic=True)",
              "self.integration.launch_and_dock(host_hwnd, startup_timeout=25)",
              "self.integration.connect(timeout=10.0)",
              'elif kind == "auto_gto_connect_retry":',
              '["taskkill", "/PID", str(owned_pid), "/T", "/F"]',
              'text="UP TO DATE"',
              'state="disabled", style="MutedUpdate.TButton"',
              "start_update_availability_check(ROOT, on_result, on_error)",
          )
          for marker in required_main:
              if marker not in main:
                  raise SystemExit("Missing v1.3.80 requirement: " + marker)
          for forbidden in (
              "gto_viewport",
              "_layout_embedded_gto_host",
              "reference_width = 1320.0",
              "scale = min(",
              "place_configure(width=",
              "def _restart_pigeon_elevated_for_gto(",
              "Windows permissions required",
          ):
              if forbidden in main:
                  raise SystemExit("An unwanted experimental/GTO elevation path remains: " + forbidden)
          if "ShellExecuteW(" in main and '"runas"' in main:
              raise SystemExit("An app-generated GTO+ UAC elevation path remains.")

          if 'controls_outer.pack(side="right", fill="y", padx=(12, 0))' not in main:
              raise SystemExit("Original left/right frame arrangement changed.")
          if "_REFERENCE_SIZE = (695, 570)" not in probe:
              raise SystemExit("The UI automation client-width calibration was not updated.")
          if "_OOP_CLOSE_CENTER = (511, 75)" not in probe:
              raise SystemExit("The centered range-editor close target was not updated.")

          # Confirm update restart semantics: the packaged helper waits for the
          # old PID to close, applies files, then relaunches the new PigeonPoker.pyw.
          updater = files["pigeon_updater.py"].decode("utf-8")
          if "subprocess.Popen([executable, str(app_root / \"PigeonPoker.pyw\")], **kwargs)" not in updater:
              raise SystemExit("The update helper does not relaunch PigeonPoker.pyw.")
          if "while _pid_is_running(parent_pid)" not in updater:
              raise SystemExit("The update helper does not wait for the previous Pigeon process to exit.")

          # Verify the new widths give exactly 30 logical pixels back to GTO+.
          if 350 - 320 != 30 or 332 - 302 != 30:
              raise SystemExit("GTO+ workspace width adjustment is not exactly 30px.")

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("v1.3.80 ZIP CRC check failed.")
              if set(archive.namelist()) != package_names:
                  raise SystemExit("v1.3.80 package file set differs from the full package.")
              final_main = archive.read("PigeonPoker.pyw").decode("utf-8")
              ast.parse(final_main, filename="PigeonPoker.pyw")
              for marker in required_main:
                  if marker not in final_main:
                      raise SystemExit("Packaged app lost a requirement: " + marker)

          digest = hashlib.sha256(payload).hexdigest()
          encoded = base64.b64encode(payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + target_version)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded), chunk_size)):
              name = f"payload.part-{index:03d}"
              (release_dir / name).write_text(encoded[offset:offset + chunk_size], encoding="ascii")
              chunks.append(name)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + chr(10), encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "v1.3.69のPigeon内GTO+ネイティブ埋め込み方式を復元。画面倍率・別viewport・レスポンシブ枠変更は不使用。"
              "CONNECTION右カラム幅を350から320へ、Canvasを332から302へ変更し、GTO+ WORKSPACEに30pxを戻す。"
              "起動時はGTO+ Engineページを表示し、GTO+の既存プロセスを正確な実行パスで検索して再接続、無ければソケット設定後にPigeon内へ起動。"
              "起動後のsocket接続は最大10回自動再試行。Pigeon終了・更新時は管理対象のGTO+ PIDだけを終了。"
              "更新helperは新しいPigeonPoker.pywを再起動するため、更新後も同じGTO+自動起動フローを実行。"
              "UP TO DATE時の更新ボタン無効化を維持。GTO+ UI probeは+30px workspaceに合わせて中心ダイアログ座標のみ補正。"
              "レンジ生成・HU/プリフロップデータはv1.3.69を基準として維持。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(payload),
              "source_baseline": source_version,
              "source_updater": "1.3.77",
              "gto_workspace_width_delta": 30,
              "connection_column_width": 320,
              "connection_canvas_width": 302,
              "auto_show_gto_page": True,
              "auto_launch_and_connect_gto": True,
              "close_owned_gto_with_pigeon": True,
              "update_restart_reopens_gto": True,
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          (release_dir / "payload.ready").write_text(
              "verified " + target_version + chr(10), encoding="ascii"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/{repo}/main/releases/v{target_version}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "published_version": target_version,
              "base": source_version,
              "app_source_blob": pinned_blobs["PigeonPoker.pyw"],
              "range_source_blobs": {k: pinned_blobs[k] for k in range_blobs} if False else {
                  "live_range_builder.py": pinned_blobs["pigeon_gto_plus/live_range_builder.py"],
                  "ui_probe.py": pinned_blobs["pigeon_gto_plus/ui_probe.py"],
                  "preflop_screenshot_ranges.py": pinned_blobs["pigeon_poker/preflop_screenshot_ranges.py"],
              },
              "workspace_width_gain": 30,
              "connection_width": 320,
              "gto_autostart_autoconnect_shutdown": "implemented",
              "update_restart_reopens_gto": True,
              "package_size": len(payload),
              "sha256": digest,
          }, ensure_ascii=False))
          PY
      - name: Publish full v1.3.80 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.80/
          git commit -m "Release Pigeon Poker v1.3.80 restored v1.3.69 GTO workspace and auto lifecycle"
          git push
