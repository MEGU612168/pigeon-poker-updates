name: Build verified Pigeon Poker v1.5.26 PRO / TOP PRO VIP release

on:
  push:
    paths:
      - "releases/v1.5.26/payload.ready"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-native-windows-tk-render:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all 174 range charts with native Windows Tk Canvas
        shell: pwsh
        run: |
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_chart_canvas.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_scenario_resolver.py
          python staging/test_range_chart_canvas_windows.py

  build-and-publish:
    needs: verify-native-windows-tk-render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify desktop features and legacy preflop retirement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import pathlib

          source = pathlib.Path("staging/source_1_3_101/pigeon_poker")
          asset = (source / "range_tables_v2.bin").read_bytes()
          digest = hashlib.sha256(asset).hexdigest()
          if len(asset) != 848418 or digest != "61e2ea29dade57077908b8db5c37be0cde9ade6a237f85b00770dd57a109f715":
              raise SystemExit("The original 174-range bitmap failed its independent size/hash check.")
          encoded = base64.b64encode(asset).decode("ascii")
          module = (
              "# Generated from range_tables_v2.bin. Kept as .py so the original 1.5.0 updater can accept it.\n"
              "RANGE_TABLES_V2_B64 = (\n"
              + "".join("    " + repr(encoded[i:i + 100]) + "\n" for i in range(0, len(encoded), 100))
              + ")\n"
          )
          (source / "range_tables_v2_asset.py").write_text(module, encoding="utf-8")
          print(f"Generated legacy-compatible image carrier: {len(asset)} bytes, SHA-256 {digest}")
          PY
          python -m py_compile staging/source_1_3_101/PigeonPoker.pyw
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_image_catalog.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_chart_canvas.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_scenario_resolver.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_tables_v2_asset.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_cleanup.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_174_policy.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_174_policy_data.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/poker_reasoning.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/vip_ai.py
          python -m py_compile staging/source_1_3_101/pigeon_updater.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/phone_remote.py
          python staging/test_phone_remote.py
          python staging/test_pokercraft_features.py
          python staging/test_allin_runout_presentation.py
          python staging/test_casino_games.py
          python staging/test_casino_ui_and_stakes.py
          python staging/test_casino_visual_ui.py
          python staging/test_vip_pro_and_dock.py
          git add staging/test_wallet_bonus.py
          python staging/test_wallet_bonus.py
          python staging/test_postflop_controls.py
          python staging/test_poker_reasoning.py
          python staging/test_cpu_learning.py
          python staging/test_preflop_legacy_cleanup.py
          python staging/test_preflop_policy_removed.py
          python staging/test_preflop_174_policy.py
          python staging/test_preflop_size_controls.py
          python staging/test_range_image_asset_packaging.py
          python staging/test_real_range_bitmap_asset.py
          python staging/test_range_chart_canvas.py
          python staging/test_range_image_catalog.py

      - name: Assemble and validate the full update package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import importlib.util
          import io
          import json
          import pathlib
          import tempfile
          import zipfile
          from datetime import datetime, timezone

          root = pathlib.Path(".")
          release_dir = root / "releases" / "v1.5.26"
          meta_path = release_dir / "release.json"
          source_dir = root / "staging" / "source_1_3_101"
          if not meta_path.is_file():
              raise SystemExit("Missing v1.5.26 release.json")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          if meta.get("schema_version") != 1 or meta.get("product") != "pigeon-poker" or meta.get("channel") != "stable":
              raise SystemExit("Invalid release metadata")
          stable_manifest_path = root / "stable.json"
          if stable_manifest_path.is_file():
              stable_manifest = json.loads(stable_manifest_path.read_text(encoding="utf-8"))
              if bool(stable_manifest.get("updates_paused", False)) and meta.get("preflop_174_policy_verified") is not True:
                  raise SystemExit("Stable distribution is paused and this release has not passed the 174-scenario verification gate.")
          if str(meta.get("distribution_status", "")).lower() == "withdrawn":
              raise SystemExit("This release is withdrawn and must not be distributed.")
          if meta.get("preflop_174_policy_verified") is not True:
              raise SystemExit("The complete 174-scenario preflop policy has not been verified; stable publication is blocked.")
          expected_duplicate_groups = [[195, 204], [196, 205], [238, 243]]
          if meta.get("unique_semantic_situations_expected") != 171:
              raise SystemExit("The audited 174-entry dataset must report 171 unique semantic situations.")
          if meta.get("duplicate_semantic_scenario_groups") != expected_duplicate_groups:
              raise SystemExit("The known exact duplicate scenario groups do not match the audited source.")
          version = str(meta.get("version", "")).strip()
          if version != "1.5.26" or release_dir.name != "v" + version:
              raise SystemExit("Unexpected release version")
          if not source_dir.is_dir():
              raise SystemExit("Verified staging source directory is missing")

          files = {
              "PigeonPoker.pyw": source_dir / "PigeonPoker.pyw",
              "pigeon_updater.py": source_dir / "pigeon_updater.py",
          }
          for package in ("pigeon_poker", "pigeon_gto_plus"):
              package_dir = source_dir / package
              if not package_dir.is_dir():
                  raise SystemExit("Missing application module directory: " + package)
              for path in sorted(package_dir.rglob("*.py")):
                  if path.is_file() and "__pycache__" not in path.parts and not any(part.startswith(".") for part in path.parts):
                      files[(pathlib.Path(package) / path.relative_to(package_dir)).as_posix()] = path
          image_asset_path = source_dir / "pigeon_poker" / "range_tables_v2.bin"
          if not image_asset_path.is_file():
              raise SystemExit("The original 174 range bitmap is missing from the staged app source.")
          image_asset = image_asset_path.read_bytes()
          image_asset_sha256 = hashlib.sha256(image_asset).hexdigest()
          if len(image_asset) != 848418 or image_asset_sha256 != "61e2ea29dade57077908b8db5c37be0cde9ade6a237f85b00770dd57a109f715":
              raise SystemExit("The 174 range bitmap failed its source size or SHA-256 check.")
          asset_module_path = source_dir / "pigeon_poker" / "range_tables_v2_asset.py"
          if not asset_module_path.is_file():
              raise SystemExit("The legacy-compatible 174-range Python asset carrier is missing.")
          files["pigeon_poker/range_tables_v2_asset.py"] = asset_module_path
          required = {"PigeonPoker.pyw", "pigeon_updater.py", "pigeon_poker/range_tables_v2_asset.py"}
          if not required.issubset(files):
              raise SystemExit("Application root source files are incomplete")

          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              archive.writestr("VERSION.txt", version + "\n")
              for name, path in files.items():
                  data = path.read_bytes()
                  if not data:
                      raise SystemExit("Empty source file: " + name)
                  if pathlib.PurePosixPath(name).suffix.lower() in {".py", ".pyw"}:
                      ast.parse(data.decode("utf-8"), filename=name)
                  archive.writestr(name, data)

          payload = buffer.getvalue()
          if not payload or len(payload) > 18 * 1024 * 1024:
              raise SystemExit("Payload size is outside the supported range")
          digest = hashlib.sha256(payload).hexdigest()

          updater_path = source_dir / "pigeon_updater.py"
          spec = importlib.util.spec_from_file_location("pigeon_v141_updater", updater_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load packaged updater for validation")
          updater = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = updater
          spec.loader.exec_module(updater)
          manifest_for_test = {
              "version": version,
              "payload_size": len(payload),
              "payload_sha256": digest,
              "package_mode": "full",
          }
          with tempfile.TemporaryDirectory() as tmp:
              extracted_root = pathlib.Path(tmp) / "extract"
              extracted = updater._validate_and_extract(payload, manifest_for_test, extracted_root)
              carrier_path = extracted_root / "pigeon_poker" / "range_tables_v2_asset.py"
              carrier_scope = {}
              exec(compile(carrier_path.read_text(encoding="utf-8"), str(carrier_path), "exec"), carrier_scope)
              extracted_asset = base64.b64decode(carrier_scope["RANGE_TABLES_V2_B64"], validate=True)
              extracted_image_sha256 = hashlib.sha256(extracted_asset).hexdigest()
          extracted_set = set(extracted)
          if not {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}.issubset(extracted_set):
              raise SystemExit("Shipped updater did not extract every required root file")
          if "pigeon_poker/preflop_gto_strategy.py" in extracted_set:
              raise SystemExit("Retired legacy preflop policy must not be bundled")
          if "pigeon_poker/range_tables_v2_asset.py" not in extracted_set:
              raise SystemExit("The 174 range bitmap carrier is missing from the validated update ZIP")
          if "pigeon_poker/range_tables_v2.bin" in extracted_set:
              raise SystemExit("The update ZIP must not ship the .bin path rejected by the original 1.5.0 updater")
          if extracted_image_sha256 != "61e2ea29dade57077908b8db5c37be0cde9ade6a237f85b00770dd57a109f715":
              raise SystemExit("The 174 range bitmap changed while packaging the update")
          def legacy_v150_allows(name):
              path = pathlib.PurePosixPath(name)
              if name in {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}:
                  return True
              return (
                  len(path.parts) >= 2
                  and path.parts[0] in {"pigeon_poker", "pigeon_gto_plus"}
                  and path.suffix.lower() == ".py"
                  and not any(part.startswith(".") or part == "__pycache__" for part in path.parts)
              )
          legacy_rejected = sorted(name for name in extracted_set if not legacy_v150_allows(name))
          if legacy_rejected:
              raise SystemExit("The 1.5.0 updater would reject these package members: " + ", ".join(legacy_rejected))
          if "pigeon_poker/preflop_174_policy.py" not in extracted_set:
              raise SystemExit("The 174-scenario CPU policy is missing from the package")
          if "pigeon_poker/preflop_174_policy_data.py" not in extracted_set:
              raise SystemExit("The embedded 174-scenario source dataset is missing from the package")
          reasoning_path = source_dir / "pigeon_poker" / "poker_reasoning.py"
          reasoning_source = reasoning_path.read_text(encoding="utf-8")
          if "def build_174_preflop_range_estimate(" not in reasoning_source:
              raise SystemExit("The postflop policy does not build Bayesian ranges from the 174 preflop chart.")
          required_postflop_hooks = (
              "def _postflop_showdown_value_profile(",
              "def _postflop_pure_bluff_allowed(",
              "def _postflop_thin_value_size_allowed(",
              "def _postflop_sdv_aggression_allowed(",
              "def _postflop_raise_increment(",
              "SDV-bet-candidates-blocked=",
              "sdv_passive_baseline_ev",
              "hole_suit_counts",
              "hole_contribution_ranks",
              "has_sdv=has_sdv",
              "SDV-profile=",
          )
          missing_postflop_hooks = [
              hook for hook in required_postflop_hooks if hook not in reasoning_source
          ]
          if missing_postflop_hooks:
              raise SystemExit("The strengthened postflop policy is incomplete: " + ", ".join(missing_postflop_hooks))
          if ("VIP_PRO_BASE_SAMPLES = 1024" not in reasoning_source
                  or "VIP_TOP_PRO_BASE_SAMPLES = 4096" not in reasoning_source
                  or "def _vip_base_sample_budget(" not in reasoning_source
                  or reasoning_source.count("_vip_base_sample_budget(cpu)") < 2):
              raise SystemExit("VIP base sample budgets are not wired into both actual equity sampling loops.")
          if "sdv_candidates_blocked += 1" not in reasoning_source:
              raise SystemExit("SDV candidates are not being counted and filtered before strategy mixing.")
          if "def _call_realized_equity(" not in reasoning_source or "def _geometric_bet_fraction(" not in reasoning_source:
              raise SystemExit("The postflop equity-realization or geometric-sizing theory is missing.")
          if "pigeon_poker/preflop_cleanup.py" not in extracted_set:
              raise SystemExit("Retired preflop cleanup module is missing from the update")
          if ("pigeon_poker/preflop_screenshot_" + "ranges.py") in extracted_set:
              raise SystemExit("Retired preflop implementation must not be bundled")
          app_source = (source_dir / "PigeonPoker.pyw").read_text(encoding="utf-8")
          phone_remote_path = source_dir / "pigeon_poker" / "phone_remote.py"
          if not phone_remote_path.is_file():
              raise SystemExit("Smartphone remote module is missing from the app source.")
          phone_remote_source = phone_remote_path.read_text(encoding="utf-8")
          required_phone_remote_hooks = (
              "from pigeon_poker.phone_remote import PhoneRemoteServer",
              "self.phone_remote_actions: queue.Queue",
              "def _phone_remote_tick(self):",
              "def _process_phone_remote_action(self, request:",
              "self.phone_remote.publish_state(",
              "self.phone_remote.stop()",
              "def build_phone_snapshot(",
              "PAIR PHONE",
              "PHONE_ACTIONS = frozenset",
          )
          missing_phone_remote_hooks = [
              hook for hook in required_phone_remote_hooks
              if hook not in app_source and hook not in phone_remote_source
          ]
          if missing_phone_remote_hooks:
              raise SystemExit("Smartphone remote integration is incomplete: " + ", ".join(missing_phone_remote_hooks))
          casino_source_path = source_dir / "pigeon_poker" / "casino_games.py"
          if not casino_source_path.is_file():
              raise SystemExit("The Blackjack/Baccarat casino engine is missing from the package.")
          casino_source = casino_source_path.read_text(encoding="utf-8")
          required_casino_app_hooks = (
              "from pigeon_poker.casino_games import",
              "def _build_casino_page(",
              "def _casino_start_blackjack(",
              "def _casino_blackjack_action(",
              "def _casino_play_baccarat(",
              "def _casino_debit_wager(",
              "def _casino_credit_payout(",
              "def _casino_save_blackjack_state(",
              "def _open_casino_window(",
              "def _hide_casino_window(",
              "def _casino_draw_squeezed_card(",
              "def _casino_draw_baccarat_table(",
              "def _casino_animate_baccarat_to_state(",
              "MANDATORY SQUEEZE",
              '"table_stack_toggle"',
              "def _casino_draw_card(",
              "def _casino_draw_chip(",
              "def _casino_draw_blackjack_table(",
              "def _casino_draw_baccarat_table(",
              "def _casino_animate_blackjack_to_state(",
              "def _casino_animate_baccarat_to_state(",
              "def _apply_one_time_270_dollar_casino_test_refund(",
              '"casino-test-refund"',
              '"NL500": (250, 500)',
              '"NL1000": (500, 1000)',
              '"casino-wager"',
              '"casino-payout"',
              "serialize_blackjack_state",
              "restore_blackjack_state",
          )
          missing_casino_app_hooks = [
              hook for hook in required_casino_app_hooks if hook not in app_source
          ]
          required_casino_engine_hooks = (
              "def new_blackjack_round(",
              "def blackjack_hit(",
              "def blackjack_stand(",
              "def blackjack_double(",
              "def baccarat_banker_should_draw(",
              "def new_baccarat_round(",
              "def serialize_blackjack_state(",
              "def restore_blackjack_state(",
          )
          missing_casino_engine_hooks = [
              hook for hook in required_casino_engine_hooks if hook not in casino_source
          ]
          if missing_casino_app_hooks or missing_casino_engine_hooks:
              raise SystemExit(
                  "Casino implementation is incomplete. App hooks: "
                  + ", ".join(missing_casino_app_hooks)
                  + "; engine hooks: " + ", ".join(missing_casino_engine_hooks)
              )
          required_allin_runout_hooks = (
              "RUNOUT_REVEAL_STAGES = ((\"FLOP\", 0, 3), (\"TURN\", 3, 4), (\"RIVER\", 4, 5))",
              "def _animate_multi_runout_reveal(",
              "def _multi_runout_reveal_step(",
              "def _multi_runout_reveal_frame(",
              "def _finish_allin_runout_reveal(",
              "cash_runout_show_hole_cards",
              "cash_runout_reveal_pending",
              "cash_runout_reveal_counts",
              "cash_runout_reveal_anim",
              "cash_runout_pre_settlement_stacks",
              "cash_runout_pre_settlement_pot",
              "cash_runout_prompt_token",
              "ALLIN_RUNOUT_HOLE_REVEAL_PAUSE_MS",
              "ALLIN_RUNOUT_FLOP_TO_TURN_PAUSE_MS",
              "ALLIN_RUNOUT_TURN_TO_RIVER_PAUSE_MS",
              "def initial_allin_runout_reveal_count(",
              "cash_runout_initial_reveal_count",
          )
          missing_allin_runout_hooks = [
              hook for hook in required_allin_runout_hooks if hook not in app_source
          ]
          if missing_allin_runout_hooks:
              raise SystemExit("All-in runout presentation hooks are missing: " + ", ".join(missing_allin_runout_hooks))
          required_vip_pro_hooks = (
              "VIP_PRO_SIMULATIONS = 1024",
              "VIP_TOP_PRO_SIMULATIONS = 4096",
              "simulations=(",
              "VIP_TOP_PRO_ROLE",
              '"balanced" if is_vip_mode(table_mode) else profile.archetype',
              "vip_cpu._vip_top_pro_mode",
              "make_vip_auto_rebuy_plan(",
              'is_top_pro = (vip_role_text == "TOP PRO")',
              "VIP PRIVATE CLUB",
              "vip_rail_double_line",
              "window._pigeon_vip_theme = vip_mode",
              'vip_dock = is_vip_mode(state.get("cash_game_mode", RUSH_MODE))',
              'size_actions.configure(height=28 if vip_mode else 30)',
              'situation_actions.configure(height=18 if vip_mode else 20)',
              '("size_actions", "situation_actions", 28 if vip_dock else 30)',
              '("situation_actions", "utility_actions", 18 if vip_dock else 20)',
              "PRO 1,024 BASE MC",
              "TOP PRO 4,096 BASE MC",
              "#71172c",
              "#e2bd69",
              "dock_row.winfo_children()",
              "dock_row.pack_forget()",
          )
          missing_vip_hooks = [hook for hook in required_vip_pro_hooks if hook not in app_source]
          if missing_vip_hooks:
              raise SystemExit("VIP Pro / compact dock hooks missing: " + ", ".join(missing_vip_hooks))
          vip_module = source_dir / "pigeon_poker" / "vip_ai.py"
          if not vip_module.is_file():
              raise SystemExit("VIP Pro / TOP PRO role policy module is missing.")
          vip_source = vip_module.read_text(encoding="utf-8")
          required_vip_role_hooks = (
              "VIP_PRO_COUNT = 3",
              "VIP_TOP_PRO_COUNT = 2",
              "VIP_AUTO_REBUY_THRESHOLD_BB = 80",
              "VIP_AUTO_REBUY_TARGET_BB = 100",
              "def make_vip_auto_rebuy_plan(",
          )
          missing_vip_role_hooks = [
              hook for hook in required_vip_role_hooks if hook not in vip_source
          ]
          if missing_vip_role_hooks:
              raise SystemExit("VIP lineup or auto-rebuy policy is incomplete: " + ", ".join(missing_vip_role_hooks))
          if "postflop_range_estimator" not in app_source or app_source.count("range_estimator=postflop_range_estimator") < 2:
              raise SystemExit("The cash CPU does not feed 174-chart Bayesian ranges into both postflop decision paths.")
          if "preflop_gto_strategy" in app_source or "choose_preflop_action" in app_source:
              raise SystemExit("Application still references the retired preflop policy")
          if "_choose_preflop_legal_fallback" in app_source:
              raise SystemExit("Temporary generic preflop fallback must not remain in the application")
          if "from pigeon_poker.preflop_174_policy import choose_preflop_174_action" not in app_source:
              raise SystemExit("Application does not import the 174-scenario CPU policy")
          if app_source.count("choose_preflop_174_action(") < 2:
              raise SystemExit("Application does not route both preflop CPU decision paths through the strict 174-scenario policy")
          preflop_policy_source = (source_dir / "pigeon_poker" / "preflop_174_policy.py").read_text(encoding="utf-8")
          if "No exact 174-scenario action history" not in preflop_policy_source:
              raise SystemExit("Unmatched preflop states are not explicitly routed away from chart data.")
          if "unmeasured-image-cell" not in preflop_policy_source:
              raise SystemExit("Unmeasured 169-cell entries are still being inferred as chart data.")
          if "ranked = [(_history_distance" in preflop_policy_source:
              raise SystemExit("Fuzzy nearest-node preflop chart selection must remain disabled.")
          required_feature_hooks = (
              "def _build_pokercraft_page(",
              "def _tick_pokercraft_live_refresh(",
              "def _draw_history_cards_icon(",
              "def _open_live_hand_flow(",
              "def _open_realtime_preflop_range(",
              "def _historical_preflop_range_chart(",
              "def _open_preflop_range_view(",
              "TIME (JST)",
          )
          missing_hooks = [hook for hook in required_feature_hooks if hook not in app_source]
          if missing_hooks:
              raise SystemExit("Desktop feature hooks missing from packaged app: " + ", ".join(missing_hooks))
          if "from pigeon_poker.range_chart_canvas import" not in app_source or "from pigeon_poker.range_scenario_resolver import" not in app_source:
              raise SystemExit("Native Canvas range chart and bitmap-independent resolver are not wired into the app.")
          if "create_range_photo(" in app_source or "from pigeon_poker.range_image_catalog import" in app_source:
              raise SystemExit("Runtime preflop range display still depends on the legacy bitmap renderer.")
          if not (source_dir / "pigeon_poker" / "range_chart_canvas.py").is_file():
              raise SystemExit("Native Canvas range chart module is missing.")
          if not (source_dir / "pigeon_poker" / "range_scenario_resolver.py").is_file():
              raise SystemExit("Bitmap-independent range resolver module is missing.")
          if "cleanup_retired_preflop_modules()" not in app_source:
              raise SystemExit("Application does not clean up retired preflop source files")
          if ("preflop_screenshot_" + "ranges") in app_source:
              raise SystemExit("Application still references the retired preflop implementation")

          encoded = base64.b64encode(payload).decode("ascii")
          (release_dir / "payload-updater.zip.b64").write_text(encoded, encoding="ascii")
          published_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          release_notes = str(meta.get("release_notes", "Legacy preflop strategy retired; 174-scenario preflop policy integration pending."))
          manifest = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
