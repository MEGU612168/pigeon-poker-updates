name: Release Pigeon Poker v1.3.79 native GTO+ zoom fit, lifecycle preserved

on:
  push:
    paths:
      - "releases/v1.3.79/build.request"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from the complete verified v1.3.77 source snapshot and patch only geometry methods
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import io
          import json
          import pathlib
          import time
          import zipfile

          source_version = "1.3.77"
          target_version = "1.3.79"
          source_dir = pathlib.Path("staging") / "source_1_3_77"
          expected_files = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py",
              "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py",
              "pigeon_poker/preflop_screenshot_ranges.py",
          }
          if not source_dir.is_dir():
              raise SystemExit("Verified complete v1.3.77 source snapshot is missing.")

          files = {}
          for name in expected_files:
              path = source_dir / name
              if not path.is_file():
                  raise SystemExit("Missing required v1.3.77 source file: " + name)
              files[name] = path.read_bytes()

          if files["VERSION.txt"].decode("ascii").strip() != source_version:
              raise SystemExit("Source snapshot is not exactly v1.3.77.")

          range_blobs = {
              "pigeon_gto_plus/live_range_builder.py": "4b8d0c287acce64cce98562313ea63f73cfb3b60",
              "pigeon_gto_plus/ui_probe.py": "6984be9b528ce4f463d8f0bf7ce72d95038ed1fd",
              "pigeon_poker/preflop_screenshot_ranges.py": "5a816dc1a2a07d686c6fe83b7e04155549ac4818",
          }
          for name, expected_blob in range_blobs.items():
              data = files[name]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise SystemExit("v1.3.69 range baseline mismatch: " + name)

          main = files["PigeonPoker.pyw"].decode("utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}.")
              return source.replace(old, new, 1)

          def replace_method(source: str, signature: str, new_lines: list[str], label: str) -> str:
              if source.count(signature) != 1:
                  raise SystemExit(f"{label}: method signature must occur exactly once.")
              start = source.find(signature)
              end = source.find("\n    def ", start + len(signature))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: could not find the next class method boundary.")
              new_method = "\n".join(new_lines).rstrip()
              if not new_method.startswith(signature):
                  raise SystemExit(f"{label}: replacement has the wrong method signature.")
              return source[:start] + new_method + "\n\n" + source[end + 1:]

          # First ensure the starting source truly contains the GTO+ lifecycle.
          required_lifecycle = (
              "    def _auto_start_gto_plus(self):",
              "    def _launch_gto(self, automatic: bool = False):",
              "    def _attach_existing_gto(self, process_id: int, automatic: bool = False):",
              "    def _connect_gto(self, automatic: bool = False, attempt: int = 0):",
              "    def _on_close(self):",
              "        self.after(350, self._auto_start_gto_plus)",
              "self.integration.enable_socket_connection()",
              "self.integration.launch_and_dock(host_hwnd, startup_timeout=25)",
              "self.integration.attach_existing_and_dock(",
              "self.integration.connect(timeout=10.0)",
              '["taskkill", "/PID", str(self.gto_owned_pid), "/T", "/F"]',
          )
          for item in required_lifecycle:
              if item not in main:
                  raise SystemExit("The full v1.3.77 GTO+ lifecycle source is incomplete: " + item)

          # Pigeon frame and split layout stay unchanged. Only the child window
          # is sized to the actual GTO+ UI reference image (1320x676).
          main = replace_once(
              main,
              'self.gto_viewport, bg="#080f18", width=665, height=570,',
              'self.gto_viewport, bg="#080f18", width=1320, height=676,',
              "native GTO+ reference initial dimensions",
          )
          main = replace_once(
              main,
              'relx=0.5, rely=0.5, anchor="center", width=665, height=570,',
              'relx=0.5, rely=0.5, anchor="center", width=1320, height=676,',
              "native GTO+ reference initial placement",
          )

          layout_lines = [
              "    def _layout_embedded_gto_host(self) -> bool:",
              '        """Fit the complete native GTO+ UI to the fixed Pigeon viewport.',
              "        GTO+ recalculates its own interface zoom when its HWND receives",
              "        the new client size. The Pigeon workspace frame is not resized.",
              '        """',
              "        try:",
              "            self.update_idletasks()",
              "            viewport_width = int(self.gto_viewport.winfo_width())",
              "            viewport_height = int(self.gto_viewport.winfo_height())",
              "            if viewport_width < 2 or viewport_height < 2:",
              "                return False",
              "            reference_width = 1320.0",
              "            reference_height = 676.0",
              "            scale = min(",
              "                viewport_width / reference_width,",
              "                viewport_height / reference_height,",
              "                1.0,",
              "            )",
              "            if scale <= 0:",
              "                return False",
              "            target_width = max(2, int(round(reference_width * scale)))",
              "            target_height = max(2, int(round(reference_height * scale)))",
              "            current_size = (",
              "                int(self.gto_host.winfo_width()),",
              "                int(self.gto_host.winfo_height()),",
              "            )",
              "            if current_size != (target_width, target_height):",
              "                self.gto_host.place_configure(",
              "                    width=target_width, height=target_height,",
              "                )",
              "            self._gto_display_scale = scale",
              "            self._gto_native_zoom_percent = int(round(scale * 100))",
              "            return True",
              "        except (tk.TclError, ZeroDivisionError, ValueError):",
              "            return False",
          ]
          main = replace_method(
              main,
              "    def _layout_embedded_gto_host(self) -> bool:",
              layout_lines,
              "native zoom layout",
          )

          schedule_lines = [
              "    def _schedule_embedded_gto_geometry_sync(self, reason: str) -> None:",
              '        """Re-sync the native zoom immediately, after Tk layout, and after GTO WM_SIZE."""',
              "        if not self.gto_embedded:",
              "            return",
              "        self._layout_embedded_gto_host()",
              "        self._sync_embedded_gto_geometry(reason)",
              "        try:",
              "            self.after_idle(",
              '                lambda r=reason: self._sync_embedded_gto_geometry(r + "-idle")',
              "            )",
              '            self.after(250, lambda r=reason: self._sync_embedded_gto_geometry(r + "-settled"))',
              '            self.after(900, lambda r=reason: self._sync_embedded_gto_geometry(r + "-native-zoom-settled"))',
              "        except tk.TclError:",
              "            pass",
          ]
          main = replace_method(
              main,
              "    def _schedule_embedded_gto_geometry_sync(self, reason: str) -> None:",
              schedule_lines,
              "native zoom geometry schedule",
          )

          resize_lines = [
              "    def _resize_embedded(self, _event=None):",
              "        self._layout_embedded_gto_host()",
              '        self._sync_embedded_gto_geometry("viewport-configure")',
          ]
          main = replace_method(
              main,
              "    def _resize_embedded(self, _event=None):",
              resize_lines,
              "native zoom viewport resize",
          )

          # Prove that all lifecycle methods survived the three isolated edits.
          for item in required_lifecycle:
              if item not in main:
                  raise SystemExit("GTO+ lifecycle method was lost during geometry patch: " + item)
          if main.count("    def _auto_start_gto_plus(self):") != 1:
              raise SystemExit("GTO+ auto-start method is missing or duplicated.")
          if main.count("    def _launch_gto(self, automatic: bool = False):") != 1:
              raise SystemExit("GTO+ launch method is missing or duplicated.")
          if main.count("    def _connect_gto(self, automatic: bool = False, attempt: int = 0):") != 1:
              raise SystemExit("GTO+ connect method is missing or duplicated.")

          # Verify the Pigeon outer layout has not changed.
          for item in (
              'row.pack(fill="both", expand=True, padx=22, pady=(0, 20))',
              'host_col.pack(side="left", fill="both", expand=True)',
              'self.gto_viewport = tk.Frame(host_col, bg="#080f18")',
              'self.gto_viewport.pack(fill="both", expand=True, padx=8, pady=8)',
              'controls_outer.pack(side="right", fill="y", padx=(12, 0))',
              'controls_canvas = tk.Canvas(',
          ):
              if item not in main:
                  raise SystemExit("The fixed Pigeon outer frame changed: " + item)
          if 'controls_outer.pack(fill="x"' in main or "controls_toggle" in main:
              raise SystemExit("A previous experimental full-width controls layout remains.")

          # Preserve update-check UI from v1.3.77.
          if 'self.after(1200, self._refresh_update_button_state)' not in main:
              raise SystemExit("Automatic update availability check is missing.")
          if 'text="UP TO DATE"' not in main or 'state="disabled", style="MutedUpdate.TButton"' not in main:
              raise SystemExit("No-update button disabled state is missing.")

          # Fit tests from the exact 1320x676 user screenshot. Only the native
          # GTO child shrinks; all results remain inside the existing viewport.
          def fit(width: int, height: int):
              scale = min(width / 1320.0, height / 676.0, 1.0)
              return scale, int(round(1320 * scale)), int(round(676 * scale))

          scale, fw, fh = fit(856, 548)
          if (fw, fh) != (856, 438) or fw > 856 or fh > 548:
              raise SystemExit(f"Native zoom fit test failed: {(scale, fw, fh)}")
          if abs(fw / fh - 1320 / 676) > 0.004:
              raise SystemExit("Native zoom fit does not preserve the real GTO+ aspect ratio.")
          scale2, w2, h2 = fit(714, 548)
          if w2 > 714 or h2 > 548 or abs(w2 / h2 - 1320 / 676) > 0.004:
              raise SystemExit(f"Compact viewport fit test failed: {(scale2, w2, h2)}")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (target_version + chr(10)).encode("ascii")

          for name, data in files.items():
              if name.endswith(".py") or name.endswith(".pyw"):
                  ast.parse(data.decode("utf-8"), filename=name)

          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  archive.writestr(name, files[name])
          final_payload = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload), "r") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Final v1.3.79 ZIP CRC check failed.")
              if set(archive.namelist()) != expected_files:
                  raise SystemExit("Final v1.3.79 package file set changed.")
              if archive.read("VERSION.txt").decode("ascii").strip() != target_version:
                  raise SystemExit("Final v1.3.79 version marker mismatch.")
              final_main = archive.read("PigeonPoker.pyw").decode("utf-8")
              for item in required_lifecycle:
                  if item not in final_main:
                      raise SystemExit("Packaged GTO+ lifecycle is incomplete: " + item)
              ast.parse(final_main, filename="PigeonPoker.pyw")

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded_final = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + target_version)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded_final, encoding="ascii")
          chunk_size = 48000
          chunks = []
          for index, offset in enumerate(range(0, len(encoded_final), chunk_size)):
              part = f"payload.part-{index:03d}"
              (release_dir / part).write_text(encoded_final[offset:offset + chunk_size], encoding="ascii")
              chunks.append(part)
          (release_dir / "payload.parts.json").write_text(
              json.dumps({"parts": chunks}, indent=2) + chr(10), encoding="utf-8"
          )

          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          notes = (
              "完全なv1.3.77ソースから再構築し、GTO+起動・既存プロセス再接続・自動ソケット設定・自動接続・終了処理を保持。"
              "Pigeonの外側のGTO+ WORKSPACE枠と左右パネル配置は変更しない。"
              "ユーザー提供の実画面1320x676を基準に、GTO+ネイティブウィンドウだけを枠内へ均等縮小。"
              "GTO+自身のWM_SIZEに伴う内部ズームを利用し、全UI・インポート済みレンジツリーを同一倍率で表示。"
              "UIサイズ変更後250ms/900msで再同期。更新なしボタン無効化も維持。"
              "HU/プリフロップレンジ関連3ファイルはv1.3.69とバイト単位で同一。"
          )
          release = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "package_mode": "full",
              "release_notes": notes,
              "payload_sha256": digest,
              "payload_size": len(final_payload),
              "source_snapshot": source_version,
              "range_baseline": "1.3.69",
              "native_gto_reference_size": [1320, 676],
              "fixed_outer_workspace_frame": True,
              "native_gto_zoom_on_resize": True,
              "automatic_gto_start_connect_shutdown_preserved": True,
              "update_button_disabled_when_current": True,
              "files": sorted(files),
          }
          (release_dir / "release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          (release_dir / "payload.ready").write_text(
              "verified " + target_version + chr(10), encoding="ascii"
          )
          stable = {
              "schema_version": 1,
              "product": "pigeon-poker",
              "channel": "stable",
              "version": target_version,
              "published_at": now,
              "release_notes": notes,
              "package_mode": "full",
              "payload_encoding": "base64",
              "payload_url": (
                  f"https://raw.githubusercontent.com/MEGU612168/pigeon-poker-updates/main/releases/v{target_version}/"
                  f"payload-updater.zip.b64?v={digest}"
              ),
              "payload_sha256": digest,
              "payload_size": len(final_payload),
          }
          pathlib.Path("stable.json").write_text(
              json.dumps(stable, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          (release_dir / "build.request").unlink(missing_ok=True)
          print(json.dumps({
              "published_version": target_version,
              "source_snapshot": source_version,
              "gto_native_reference_size": [1320, 676],
              "outer_frame_unchanged": True,
              "gto_auto_start_launch_attach_connect_shutdown_methods": "all preserved",
              "range_baseline": "1.3.69 byte-identical",
              "fit_test": {"scale": scale, "width": fw, "height": fh},
              "payload_size": len(final_payload),
              "payload_sha256": digest,
          }, ensure_ascii=False))
          PY
      - name: Publish verified full v1.3.79 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add stable.json releases/v1.3.79/
          git commit -m "Release Pigeon Poker v1.3.79 native GTO+ zoom fit with lifecycle intact"
          git push
