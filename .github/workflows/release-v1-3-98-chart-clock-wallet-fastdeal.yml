name: Release Pigeon Poker v1.3.98 chart-locked preflop, CPU clock, withdrawable balance and fast deal
on:
  push:
    paths:
      - "releases/v1.3.98/build.request"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source 75-node strategy
        run: |
          set -euo pipefail
          python staging/test_preflop_ranges_75.py
          python - <<'PY'
          import importlib.util
          import sys
          spec = importlib.util.spec_from_file_location("chart", "staging/preflop_screenshot_ranges_75.py")
          m = importlib.util.module_from_spec(spec); sys.modules[spec.name] = m; spec.loader.exec_module(m)
          d = m._data()
          assert len(d["nodes"]) == 75
          assert sum(len(n["hands"]) for n in d["nodes"]) == 12675
          sizes = sorted({round(float(a["amount_bb"]), 3) for n in d["nodes"]
                          for acts in n["hands"].values() for a in acts if a["action"] == "raise"})
          assert sizes and all(0 < x <= 100 for x in sizes)
          print("Verified 75 nodes, 12,675 hand classes; fixed raise sizes:", sizes)
          PY
      - name: Build Stable v1.3.98 from exact v1.3.97
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, base64, hashlib, io, json, pathlib, re, subprocess, time, urllib.request, zipfile

          REPO = "MEGU612168/pigeon-poker-updates"
          SOURCE_VERSION = "1.3.97"
          TARGET_VERSION = "1.3.98"
          SOURCE_SHA256 = "a015676bbfdf328695d9b7efa3ce87cb0623072d1408140136275d5f2cd3d9ef"
          SOURCE_SIZE = 266012
          url = f"https://raw.githubusercontent.com/{REPO}/main/releases/v{SOURCE_VERSION}/payload-updater.zip.b64?v={SOURCE_SHA256}"
          req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"})
          with urllib.request.urlopen(req, timeout=90) as response:
              encoded = response.read().decode("ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != SOURCE_SIZE or hashlib.sha256(payload).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Pinned v1.3.97 source integrity failure.")

          expected = {
              "PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt",
              "pigeon_gto_plus/auto_solve_ui.py", "pigeon_gto_plus/live_range_builder.py",
              "pigeon_gto_plus/ui_probe.py", "pigeon_poker/preflop_screenshot_ranges.py",
          }
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              if z.testzip() or set(z.namelist()) != expected:
                  raise SystemExit("Unexpected or damaged v1.3.97 package.")
              files = {n: z.read(n) for n in z.namelist()}
          if files["VERSION.txt"].decode().strip() != SOURCE_VERSION:
              raise SystemExit("Source version marker mismatch.")

          def rep(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return src.replace(old, new, 1)

          # Add a human-facing chart reader; it reuses the exact same rows and
          # action-size conversion that the CPU uses.
          chart_path = "pigeon_poker/preflop_screenshot_ranges.py"
          chart = files[chart_path].decode("utf-8")
          helper = r'''
          def preflop_chart_options(table: Any, hand: Any, actor_id: str) -> dict[str, Any] | None:
              """Return only chart-supported Fold, Call/Check and fixed-BB Raise choices."""
              if str(getattr(hand, "street", "")).lower() != "preflop":
                  return None
              node_id = _node_for_actor(table, hand, str(actor_id))
              if node_id is None:
                  return None
              try:
                  player = hand.player(actor_id)
                  combo = hand_class_from_cards(getattr(player, "hole_cards", ()))
                  if combo is None:
                      return None
                  node = _data()["nodes_by_id"][node_id]
                  raw = node["hands"].get(combo) or []
                  legal = _legal_actions(hand, str(actor_id))
                  if not any(float(a.get("frequency", 0.0)) > 0 for a in raw):
                      return {"node_id": node_id, "hand_class": combo, "fold": True,
                              "call_action": None, "raise_action": None, "raise_amount": None,
                              "raise_frequency": 0.0}
                  choices = _decision_choices(node, combo, hand, str(actor_id), legal)
                  fold = False
                  call_action = None
                  raises: dict[tuple[str, int], float] = {}
                  max_target = int(legal.get("max_target", 0) or 0)
                  for action, amount, weight in choices:
                      key = str(action).lower().replace("-", "_")
                      if key == "fold":
                          fold = True
                      elif key in {"call", "check"}:
                          if call_action is None or key == "call":
                              call_action = key
                      elif key in {"allin", "all_in", "jam", "shove"}:
                          if max_target > 0:
                              option = ("all-in", max_target)
                              raises[option] = raises.get(option, 0.0) + float(weight)
                      elif key in {"raise", "bet"} and amount is not None:
                          option = (key, int(amount))
                          raises[option] = raises.get(option, 0.0) + float(weight)
                  chosen = max(raises.items(), key=lambda item: (item[1], -item[0][1]), default=None)
                  return {
                      "node_id": node_id, "hand_class": combo, "fold": bool(fold),
                      "call_action": call_action,
                      "raise_action": chosen[0][0] if chosen else None,
                      "raise_amount": chosen[0][1] if chosen else None,
                      "raise_frequency": float(chosen[1]) if chosen else 0.0,
                  }
              except (AttributeError, KeyError, TypeError, ValueError, RuntimeError, OverflowError):
                  return None

          '''
          if "def preflop_chart_options(" not in chart:
              chart = rep(chart, "\ndef coverage_summary()", "\n" + helper + "\ndef coverage_summary()",
                          "insert chart options helper")
          if "def preflop_chart_options(" not in chart:
              raise SystemExit("Chart-derived human options missing.")
          ast.parse(chart, filename=chart_path)
          files[chart_path] = chart.encode("utf-8")

          main = files["PigeonPoker.pyw"].decode("utf-8")
          main = rep(
              main,
              "from pigeon_poker.preflop_screenshot_ranges import choose_preflop_action",
              "from pigeon_poker.preflop_screenshot_ranges import choose_preflop_action, preflop_chart_options",
              "import human chart options",
          )

          # Reject human-entered preflop sizes that differ from the range chart.
          human_action_pattern = (
              r'(        hand = self\.cash_table\.hand\n'
              r'        if hand\.next_to_act != "hero":\n'
              r'            return\n)'
              r'(        try:\n)'
          )
          guard = '''        if hand.street == "preflop" and not bool(getattr(self, "cash_gto_spot_mode", False)):
                      chart_controls = preflop_chart_options(self.cash_table, hand, "hero")
                      if chart_controls is None:
                          self.cash_status_var.set("PREFLOP CHART LINE NOT COVERED • ACTION BLOCKED")
                          return
                      key = str(action).lower().replace("_", "-")
                      allowed = False
                      if key == "fold":
                          allowed = bool(chart_controls.get("fold"))
                      elif key in {"call", "check"}:
                          allowed = key == chart_controls.get("call_action")
                      elif key in {"raise", "bet"}:
                          allowed = (key == chart_controls.get("raise_action")
                                     and amount is not None
                                     and int(amount) == int(chart_controls.get("raise_amount") or -1))
                      elif key in {"all-in", "allin"}:
                          allowed = chart_controls.get("raise_action") == "all-in"
                      if not allowed:
                          self.cash_status_var.set("USE THE CHART ACTIONS AND BB SIZE ONLY")
                          return
          '''
          main, count = re.subn(human_action_pattern, lambda m: m.group(1) + guard + m.group(2), main, count=1)
          if count != 1:
              raise SystemExit("Could not enforce preflop chart sizing at the human action boundary.")

          # Only the three chart actions are exposed during preflop. The Raise
          # button displays the exact BB target. The reusable Fold widget remains.
          hero_pattern = (
              r'(            if hand\.next_to_act == "hero":\n'
              r'                record\["status"\]\.set\("YOUR TURN"\)\n)'
              r'                try:\n'
              r'                    legal = hand\.legal_actions\("hero"\)\n'
          )
          hero_ui = r'''
                      if hand.street == "preflop" and not bool(state.get("cash_gto_spot_mode", False)):
                          chart_controls = preflop_chart_options(table, hand, "hero")
                          fold_button = record["fold_button"]
                          rush = is_rush_mode(state.get("cash_game_mode", RUSH_MODE))
                          fold_command = (
                              (lambda tid=slot.table_id: self._handle_table_fold(tid))
                              if rush else
                              (lambda tid=slot.table_id: self._floating_table_action(tid, "fold"))
                          )
                          fold_button.configure(
                              text="FOLD", command=fold_command,
                              state="normal" if chart_controls and chart_controls.get("fold") else "disabled"
                          )
                          fold_button.pack(side="left", padx=2)
                          call_action = chart_controls.get("call_action") if chart_controls else None
                          call_label = "CHECK" if call_action == "check" else "CALL"
                          call_button = self._compact_action_button(
                              actions_frame, call_label,
                              (lambda tid=slot.table_id, act=call_action:
                                  self._floating_table_action(tid, act)) if call_action else (lambda: None),
                              "accent"
                          )
                          call_button.configure(state="normal" if call_action else "disabled")
                          call_button.pack(side="left", padx=2)
                          raise_action = chart_controls.get("raise_action") if chart_controls else None
                          raise_amount = chart_controls.get("raise_amount") if chart_controls else None
                          if raise_amount is not None and int(hand.big_blind) > 0:
                              raise_bb = int(raise_amount) / int(hand.big_blind)
                              raise_label = f"RAISE {raise_bb:.2f} BB"
                              if raise_action == "all-in":
                                  raise_label += " (ALL-IN)"
                              raise_button = self._compact_action_button(
                                  actions_frame, raise_label,
                                  lambda tid=slot.table_id, act=raise_action, amt=raise_amount:
                                      self._floating_table_action(tid, act, None if act == "all-in" else amt),
                                  "accent"
                              )
                              raise_button.configure(state="normal")
                          else:
                              raise_button = self._compact_action_button(
                                  actions_frame, "RAISE — BB", lambda: None, "accent"
                              )
                              raise_button.configure(state="disabled")
                          raise_button.pack(side="left", padx=2)
                          record["status"].set(
                              f"YOUR TURN • CHART {chart_controls['node_id']} / {chart_controls['hand_class']}"
                              if chart_controls else "PREFLOP CHART LINE NOT COVERED • NO OFF-CHART ACTION"
                          )
                          try:
                              record["window"].deiconify()
                          except tk.TclError:
                              pass
                          continue
          '''
          main, count = re.subn(hero_pattern, lambda m: m.group(1) + hero_ui + '\n                try:\n                    legal = hand.legal_actions("hero")\n',
                                main, count=1)
          if count != 1:
              raise SystemExit("Could not replace the HERO preflop action controls.")

          # Add a distinct withdrawable sub-balance. Restore historic simulated
          # withdrawal entries one time so the previous $2 is not lost.
          wallet_helpers = r'''
              def _ensure_withdrawable_wallet_schema(self):
                  import sqlite3
                  with sqlite3.connect(str(self.wallet_store.db_path), timeout=20) as con:
                      con.execute("PRAGMA busy_timeout=20000")
                      con.execute("BEGIN IMMEDIATE")
                      columns = {row[1] for row in con.execute("PRAGMA table_info(wallet_account)")}
                      if "withdrawable_cents" not in columns:
                          con.execute("ALTER TABLE wallet_account ADD COLUMN withdrawable_cents INTEGER NOT NULL DEFAULT 0")
                      marker = con.execute("SELECT 1 FROM wallet_meta WHERE key='withdrawable_migration_v1'").fetchone()
                      if marker is None:
                          old = con.execute(
                              "SELECT COALESCE(SUM(-delta_cents),0) FROM cashier_transactions "
                              "WHERE kind='withdrawal' AND delta_cents<0 AND note='Simulated wallet debit'"
                          ).fetchone()
                          restore = max(0, int(old[0] or 0))
                          if restore:
                              con.execute(
                                  "UPDATE wallet_account SET withdrawable_cents=withdrawable_cents+?,updated_at=? WHERE account_id=1",
                                  (restore, datetime.now(timezone.utc).isoformat(timespec="seconds")),
                              )
                          con.execute(
                              "INSERT INTO wallet_meta(key,value) VALUES('withdrawable_migration_v1',?)",
                              (datetime.now(timezone.utc).isoformat(timespec="seconds"),),
                          )
                      con.execute("COMMIT")

              def _withdrawable_balance_cents(self):
                  import sqlite3
                  with sqlite3.connect(str(self.wallet_store.db_path), timeout=20) as con:
                      row = con.execute("SELECT withdrawable_cents FROM wallet_account WHERE account_id=1").fetchone()
                  return max(0, int(row[0])) if row else 0

              def _move_wallet_to_withdrawable(self, amount_cents):
                  import sqlite3
                  amount = int(amount_cents)
                  if amount <= 0:
                      raise ValueError("出金可能額へ移す金額を入力してください。")
                  now = datetime.now(timezone.utc).isoformat(timespec="seconds")
                  with sqlite3.connect(str(self.wallet_store.db_path), timeout=20) as con:
                      con.row_factory = sqlite3.Row
                      con.execute("PRAGMA busy_timeout=20000")
                      con.execute("BEGIN IMMEDIATE")
                      row = con.execute(
                          "SELECT balance_cents,withdrawable_cents FROM wallet_account WHERE account_id=1"
                      ).fetchone()
                      if row is None:
                          con.execute("ROLLBACK")
                          raise ValueError("ウォレット口座が見つかりません。")
                      balance = int(row["balance_cents"])
                      available = int(row["withdrawable_cents"])
                      if amount > balance:
                          con.execute("ROLLBACK")
                          raise ValueError("ウォレット残高が不足しています。")
                      new_balance, new_available = balance - amount, available + amount
                      con.execute(
                          "UPDATE wallet_account SET balance_cents=?,withdrawable_cents=?,updated_at=? WHERE account_id=1",
                          (new_balance, new_available, now),
                      )
                      con.execute(
                          "INSERT INTO cashier_transactions "
                          "(transaction_id,played_at,kind,delta_cents,balance_after_cents,recipient,note) "
                          "VALUES(?,?,?,?,?,?,?)",
                          (uuid.uuid4().hex, now, "withdrawable-transfer", -amount, new_balance,
                           "withdrawable", "Moved from Wallet to Withdrawable Balance"),
                      )
                      con.execute("COMMIT")
                  return {"balance_cents": new_balance, "withdrawable_cents": new_available}

          '''
          main = rep(main, "    def _cashier_withdraw(self):\n", wallet_helpers + "    def _cashier_withdraw(self):\n",
                     "add withdrawable balance helpers")
          main = rep(
              main,
              "        self.cashier_ledger = CashierLedger(self.wallet_store.db_path)\n",
              "        self.cashier_ledger = CashierLedger(self.wallet_store.db_path)\n"
              "        self._ensure_withdrawable_wallet_schema()\n",
              "perform once-only withdrawal restore",
          )

          dollar = chr(36)
          withdraw_pattern = r'    def _cashier_withdraw\(self\):\n.*?(?=\n    def _cashier_transfer)'
          new_withdraw = f'''    def _cashier_withdraw(self):
                  try:
                      self._sync_external_wallet_balance()
                      amount = self._parse_cashier_amount(self.cashier_withdraw_var.get())
                      result = self._move_wallet_to_withdrawable(amount)
                      self.cash_balance_cents = result["balance_cents"]
                      self._update_cash_balance()
                      self._refresh_cashier()
                      self.cashier_status_var.set(
                          f"Withdrawable Balance +{dollar}{{amount/100:.2f}} • "
                          f"available {dollar}{{result['withdrawable_cents']/100:,.2f}}"
                      )
                      self.cashier_withdraw_var.set("")
                  except Exception as exc:
                      messagebox.showerror("Cashier", str(exc), parent=self)
          '''
          new_withdraw = new_withdraw.replace("                  ", "        ")
          main, count = re.subn(withdraw_pattern, new_withdraw.rstrip(), main, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace legacy withdrawal implementation.")

          refresh_start = main.index("    def _refresh_cashier(self):")
          refresh_end = main.index("\n    def _build_table(self):", refresh_start)
          refresh = main[refresh_start:refresh_end]
          summary_pattern = r'        self\.cashier_summary_var\.set\(\n.*?\n        \)'
          new_summary = f'''        withdrawable = self._withdrawable_balance_cents()
                  self.cashier_summary_var.set(
                      f"Wallet {dollar}" + f"{{self.cash_balance_cents/100:,.2f}} • Withdrawable {dollar}" + f"{{withdrawable/100:,.2f}} • "
                      f"{{summary['count']}} transactions • Credits {dollar}" + f"{{summary['credits']/100:,.2f}} • "
                      f"Debits {dollar}" + f"{{summary['debits']/100:,.2f}}"
                  )'''
          new_summary = new_summary.replace("                  ", "        ")
          refresh, count = re.subn(summary_pattern, new_summary, refresh, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not add Withdrawable Balance to Cashier summary.")
          main = main[:refresh_start] + refresh + main[refresh_end:]

          main = rep(
              main,
              '"SIMULATED WITHDRAWAL", self.cashier_withdraw_var,\n'
              '                           "Remove funds from the local wallet ledger. Seated table chips are not part of the available wallet balance.",\n'
              '                           self._cashier_withdraw, "SIMULATE WITHDRAWAL"',
              '"MOVE TO WITHDRAWABLE", self.cashier_withdraw_var,\n'
              '                           "Move funds from Wallet into Withdrawable Balance. The amount remains available in your local wallet ledger.",\n'
              '                           self._cashier_withdraw, "MOVE TO WITHDRAWABLE"',
              "rename withdrawal action",
          )

          # Shorten actual rendered dealing: 2 animation frames per card and
          # nearly no pause between cards, not just divided wait constants.
          main = rep(
              main,
              'self.deal_animation_jobs[table_id]["after_id"] = self.after(max(1, DEAL_FIRST_DELAY_MS // 4),lambda tid=table_id:self._deal_animation_tick(tid))',
              'self.deal_animation_jobs[table_id]["after_id"] = self.after(1, lambda tid=table_id: self._deal_animation_tick(tid))',
              "deal starts immediately",
          )
          main = rep(main, 'progress=min(1.0,job["frame"]/float(DEAL_FLIGHT_FRAMES))',
                     'progress=min(1.0,job["frame"]/2.0)', "2 frame card flight")
          main = rep(main, 'if job["frame"]<DEAL_FLIGHT_FRAMES:', 'if job["frame"]<2:',
                     "2 frame stop condition")
          main = rep(
              main,
              'self.after(max(1, DEAL_FLIGHT_FRAME_MS // 4),lambda tid=table_id:self._deal_animation_frame(tid))',
              'self.after(1, lambda tid=table_id: self._deal_animation_frame(tid))',
              "minimal flight frame interval",
          )
          main = rep(
              main,
              'self.after(max(1, DEAL_BETWEEN_CARDS_MS // 4),lambda tid=table_id:self._deal_animation_tick(tid))',
              'self.after(1, lambda tid=table_id: self._deal_animation_tick(tid))',
              "minimal gap between cards",
          )
          main = rep(
              main,
              '            HOLE_REVEAL_PAUSE_MS, lambda tid=table_id: self._initial_hole_flip_frame(tid))',
              '            max(1, HOLE_REVEAL_PAUSE_MS // 4), lambda tid=table_id: self._initial_hole_flip_frame(tid))',
              "short initial reveal pause",
          )
          main = rep(
              main,
              'progress = min(1.0, progress + 1.0 / float(HOLE_REVEAL_FRAMES))',
              'progress = min(1.0, progress + 0.5)',
              "2 frame reveal",
          )
          main = rep(
              main,
              '                HOLE_REVEAL_FRAME_MS, lambda tid=table_id: self._initial_hole_flip_frame(tid))',
              '                1, lambda tid=table_id: self._initial_hole_flip_frame(tid))',
              "minimal reveal frame interval",
          )

          # Per-CPU-turn watchdog uses exactly the player's per-street limit.
          main = rep(
              main,
              "        def work():\n            decisions = []\n",
              "        def work():\n            decisions = []\n            active_cpu_turn_timer = None\n            active_cpu_turn_timed_out = None\n",
              "initialize CPU time limit tracking",
          )
          actor_anchor = "                    actor_name = hand.player(pid).name\n"
          actor_timer = r'''
                              action_timeout_seconds = float(action_seconds_for_street(hand.street))
                              turn_timed_out = threading.Event()
                              turn_committed = threading.Event()
                              turn_lock = threading.Lock()
                              turn_hand_token = id(hand)
                              turn_event_count = len(hand.events)
                              def expire_cpu_turn(
                                  tid=table_id, player_id=pid, actor=actor_name,
                                  hand_token=turn_hand_token, event_count=turn_event_count,
                                  expired=turn_timed_out, committed=turn_committed, lock=turn_lock,
                                  timeout_seconds=action_timeout_seconds
                              ):
                                  with lock:
                                      if committed.is_set():
                                          return
                                      expired.set()
                                      cancel_event.set()
                                  self.jobs.put(("cash_cpu_timeout", {
                                      "table_id": tid, "player_id": player_id, "name": actor,
                                      "hand_token": hand_token, "event_count": event_count,
                                      "seconds": timeout_seconds,
                                  }))
                              turn_timer = threading.Timer(action_timeout_seconds, expire_cpu_turn)
                              turn_timer.daemon = True
                              active_cpu_turn_timer = turn_timer
                              active_cpu_turn_timed_out = turn_timed_out
                              self.jobs.put(("cash_cpu_thinking", {
                                  "table_id": table_id, "player_id": pid, "name": actor_name,
                                  "seconds": action_timeout_seconds,
                              }))
                              turn_timer.start()
          '''
          main = rep(main, actor_anchor, actor_anchor + actor_timer, "start CPU action timer before thinking")
          # Existing delayed thinking notification is redundant; remove it.
          old_thinking = '''                    self.jobs.put(("cash_cpu_thinking", {
                          "table_id": table_id, "player_id": pid, "name": actor_name,
                          "seconds": think_seconds,
                      }))
          '''
          old_thinking = old_thinking.replace("                          ", "                        ")
          try:
              main = rep(main, old_thinking, "", "remove delayed duplicate CPU thinking event")
          except SystemExit:
              # The duplicate visual event is harmless if formatting differs; timer remains authoritative.
              pass

          # Cancel timer on normal action, but retain it for an exact GTO wait:
          # if the solver does not respond before the budget, CPU timeout recovers.
          gto_anchor = '''                                result = session.cpu_decide(
                                    hand, pid, rng=cpu.rng,
                                    level=(5 if is_vip_mode(active_mode) else cpu.level),
                                    archetype=("balanced" if is_vip_mode(active_mode) else
                                               (profile.archetype if profile else "balanced")),
                                )
                            table.sync_external_hand_state()
          '''
          gto_new = '''                                result = session.cpu_decide(
                                    hand, pid, rng=cpu.rng,
                                    level=(5 if is_vip_mode(active_mode) else cpu.level),
                                    archetype=("balanced" if is_vip_mode(active_mode) else
                                               (profile.archetype if profile else "balanced")),
                                )
                                with turn_lock:
                                    if not turn_timed_out.is_set() and not cancel_event.is_set():
                                        turn_committed.set()
                                        turn_timer.cancel()
                            table.sync_external_hand_state()
          '''
          try:
              main = rep(main, gto_anchor, gto_new, "cancel timer when GTO decision returns")
          except SystemExit:
              raise SystemExit("Could not find GTO decision call to attach timeout cancellation.")

          main = rep(
              main,
              "                        table.act(pid, decision.action, decision.amount)\n",
              "                        with turn_lock:\n"
              "                            if turn_timed_out.is_set() or cancel_event.is_set():\n"
              "                                break\n"
              "                            table.act(pid, decision.action, decision.amount)\n"
              "                            turn_committed.set()\n"
              "                            turn_timer.cancel()\n",
              "commit normal CPU action atomically before expiry",
          )
          main = rep(
              main,
              '                table.sync_external_hand_state()\n                self.jobs.put(("cash_cpu_done", {',
              '                if active_cpu_turn_timed_out is not None and active_cpu_turn_timed_out.is_set():\n'
              '                    return\n'
              '                if active_cpu_turn_timer is not None:\n'
