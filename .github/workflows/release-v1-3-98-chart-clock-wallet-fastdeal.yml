              '                table.sync_external_hand_state()\n                self.jobs.put(("cash_cpu_done", {',
              "do not post stale snapshot after timeout",
          )
          main = rep(
              main,
              '            except Exception as exc:\n                self.jobs.put(("cash_cpu_error", {',
              '            except Exception as exc:\n'
              '                if active_cpu_turn_timer is not None:\n'
              '                    active_cpu_turn_timer.cancel()\n'
