          if "resume_header_button" in main or 'child is record.get("fold_button")' not in main:
              raise SystemExit("v1.3.97 sit-out Resume or persistent Fold behavior was lost.")

          files["PigeonPoker.pyw"] = main.encode("utf-8")
          files["VERSION.txt"] = (TARGET_VERSION + "\n").encode("ascii")
          out = io.BytesIO()
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(files):
                  z.writestr(name, files[name])
          final_payload = out.getvalue()
          with zipfile.ZipFile(io.BytesIO(final_payload)) as z:
              if z.testzip() or set(z.namelist()) != expected:
                  raise SystemExit("Final ZIP integrity or file-set validation failed.")
              for name in expected:
                  if name.endswith((".py", ".pyw")):
                      ast.parse(z.read(name).decode("utf-8"), filename=name)

          digest = hashlib.sha256(final_payload).hexdigest()
          encoded_final = base64.b64encode(final_payload).decode("ascii")
          release_dir = pathlib.Path("releases") / ("v" + TARGET_VERSION)
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "payload-updater.zip.b64").write_text(encoded_final, encoding="ascii")
          parts = []
          for i, start in enumerate(range(0, len(encoded_final), 48000)):
              name = f"payload.part-{i:03d}"
              (release_dir / name).write_text(encoded_final[start:start + 48000], encoding="ascii")
              parts.append(name)
          (release_dir / "payload.parts.json").write_text(json.dumps({"parts": parts}, indent=2) + "\n", encoding="utf-8")
          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
