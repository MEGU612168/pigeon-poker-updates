name: Verify PokerCraft, live hand flow, and legacy preflop retirement

on:
  push:
    branches:
      - main
      - feature/pokercraft-live-range-tools
      - fix/174-range-asset-packaging
    paths:
      - "staging/source_1_3_101/PigeonPoker.pyw"
      - "staging/source_1_3_101/pigeon_poker/preflop_cleanup.py"
      - "staging/source_1_3_101/pigeon_poker/preflop_174_policy.py"
      - "staging/source_1_3_101/pigeon_poker/preflop_174_policy_data.py"
      - "staging/source_1_3_101/pigeon_poker/range_image_catalog.py"
      - "staging/source_1_3_101/pigeon_poker/range_tables_v2.bin"
      - "staging/source_1_3_101/pigeon_updater.py"
      - "staging/test_range_image_catalog.py"
      - "staging/test_range_image_asset_packaging.py"
      - "staging/test_real_range_bitmap_asset.py"
      - "staging/test_preflop_174_policy.py"
      - "staging/test_preflop_legacy_cleanup.py"
      - "staging/test_preflop_policy_removed.py"
      - "staging/test_pokercraft_features.py"
      - ".github/workflows/verify-pokercraft-live-range.yml"
  pull_request:
    branches:
      - main
    paths:
      - "staging/source_1_3_101/PigeonPoker.pyw"
      - "staging/source_1_3_101/pigeon_updater.py"
      - "staging/test_range_image_asset_packaging.py"
      - ".github/workflows/verify-pokercraft-live-range.yml"
      - "staging/source_1_3_101/pigeon_poker/preflop_cleanup.py"
      - "staging/source_1_3_101/pigeon_poker/preflop_174_policy.py"
      - "staging/source_1_3_101/pigeon_poker/preflop_174_policy_data.py"
      - "staging/source_1_3_101/pigeon_poker/range_image_catalog.py"
      - "staging/test_range_image_catalog.py"
      - "staging/test_preflop_174_policy.py"
      - "staging/test_preflop_legacy_cleanup.py"
      - "staging/test_preflop_policy_removed.py"
      - "staging/test_pokercraft_features.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Pigeon Poker
        run: |
          python -m py_compile staging/source_1_3_101/PigeonPoker.pyw
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_cleanup.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_174_policy.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/preflop_174_policy_data.py
          python -m py_compile staging/source_1_3_101/pigeon_poker/range_image_catalog.py
          python -m py_compile staging/source_1_3_101/pigeon_updater.py
      - name: Verify PokerCraft, live-flow and range controls
        run: |
          python staging/test_pokercraft_features.py
          python staging/test_range_image_catalog.py
          python staging/test_range_image_asset_packaging.py
          python staging/test_real_range_bitmap_asset.py
      - name: Verify legacy preflop strategy retirement
        run: |
          python staging/test_preflop_legacy_cleanup.py
          python staging/test_preflop_policy_removed.py
          python staging/test_preflop_174_policy.py
      - name: Verify postflop and CPU compatibility
        run: |
          python staging/test_postflop_controls.py
          python staging/test_poker_reasoning.py
          python staging/test_cpu_learning.py
