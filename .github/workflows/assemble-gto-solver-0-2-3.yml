name: Assemble Pigeon GTO Solver payload

on:
  push:
    branches:
      - gto-solver-service-prototype
    paths:
      - "gto_solver/releases/v0.2.3/assemble.request"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gto-solver-service-prototype
      - name: Assemble and verify base64 payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            gto_solver/releases/v0.2.3/payload.part-001 \
            gto_solver/releases/v0.2.3/payload.part-002 \
            gto_solver/releases/v0.2.3/payload.part-003 \
            gto_solver/releases/v0.2.3/payload.part-004 \
            gto_solver/releases/v0.2.3/payload.part-005 \
            gto_solver/releases/v0.2.3/payload.part-006 \
            gto_solver/releases/v0.2.3/payload.part-007 \
            gto_solver/releases/v0.2.3/payload.part-008 \
            gto_solver/releases/v0.2.3/payload.part-009 \
          > gto_solver/releases/v0.2.3/payload.zip.b64
          test "$(wc -c < gto_solver/releases/v0.2.3/payload.zip.b64)" -eq 26076
          base64 --decode gto_solver/releases/v0.2.3/payload.zip.b64 > /tmp/solver-payload.zip
          echo "2298808087162ca783657d1b20cbccbb1f7f6bfe8122f594db0b13363221f88f  /tmp/solver-payload.zip" | sha256sum --check
          unzip -t /tmp/solver-payload.zip
          git status --short
      - name: Commit assembled payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gto_solver/releases/v0.2.3/payload.zip.b64
          git commit -m "Assemble verified Pigeon GTO Solver v0.2.3 payload"
          git push origin HEAD:gto-solver-service-prototype
