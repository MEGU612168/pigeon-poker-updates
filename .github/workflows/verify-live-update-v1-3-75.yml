name: Verify the live v1.3.75 update with the shipped updater

on:
  push:
    paths:
      - "update-diagnostics/v1.3.75.request"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute the exact shipped updater checks against stable.json and v1.3.75
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import tempfile
          import sys

          source = pathlib.Path("staging/source_1_3_75/pigeon_updater.py")
          if not source.is_file():
              raise SystemExit("Extracted exact shipped updater source is missing.")
          sys.path.insert(0, str(source.parent))
          import pigeon_updater as updater

          manifest = updater._fetch_manifest()
          if manifest["version"] != "1.3.75":
              raise SystemExit(f"Stable manifest unexpectedly reports {manifest['version']!r}.")
          if updater._version_tuple(manifest["version"]) <= updater._version_tuple("1.3.74"):
              raise SystemExit("The updater does not consider 1.3.75 newer than 1.3.74.")

          transport_limit = (
              updater.MAX_COMPRESSED_BYTES * 2
              if manifest.get("payload_encoding") == "base64"
              else updater.MAX_COMPRESSED_BYTES
          )
          downloaded = updater._https_get(
              str(manifest["payload_url"]),
              max_bytes=transport_limit,
              timeout=60,
          )
          payload = updater._decode_downloaded_payload(downloaded, manifest)
          if len(payload) != int(manifest["payload_size"]):
              raise SystemExit("Decoded payload size differs from stable manifest.")
          if hashlib.sha256(payload).hexdigest() != manifest["payload_sha256"]:
              raise SystemExit("Decoded payload SHA-256 differs from stable manifest.")

          with tempfile.TemporaryDirectory() as temporary:
              destination = pathlib.Path(temporary) / "staged"
              extracted = updater._validate_and_extract(payload, manifest, destination)
              required = {"PigeonPoker.pyw", "pigeon_updater.py", "VERSION.txt"}
              if not required.issubset(set(extracted)):
                  raise SystemExit("Updater did not extract its required root files.")
              bundled_version = (destination / "VERSION.txt").read_text(encoding="utf-8").strip()
              if bundled_version != "1.3.75":
                  raise SystemExit(f"Staged package contains unexpected version {bundled_version!r}.")

          result = {
              "stable_version": manifest["version"],
              "available_to_1_3_74": True,
              "downloaded_transport_bytes": len(downloaded),
              "decoded_payload_bytes": len(payload),
              "sha256": manifest["payload_sha256"],
              "package_validation": "passed using the shipped v1.3.69 updater code",
              "extracted_files": extracted,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Record verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          printf '%s\n' "Live stable v1.3.75 package successfully fetched, decoded, hash-verified and extracted by the shipped updater." > update-diagnostics/v1.3.75.verified
          git add update-diagnostics/v1.3.75.verified
          git commit -m "Record live v1.3.75 updater compatibility verification"
          git push
